<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصنع المجد للأعلاف - صفحة المعرض والمبيعات المباشرة</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.5);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 5mm;
      }
      html, body {
        height: max-content !important;
        overflow: hidden !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 8px !important;
        page-break-inside: avoid !important;
      }
      th, td {
        border: 1.5px solid #000000 !important;
        color: #000000 !important;
        padding: 5px 8px !important;
        font-size: 11px !important;
        text-align: right !important;
      }
      th {
        background-color: #f3f4f6 !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, remove, update, get, db: rtdb
    };
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    // Error Boundary
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center space-y-4">
              <i data-lucide="alert-triangle" className="w-12 h-12 text-gold"></i>
              <h2 className="text-xl font-bold">حدث خطأ في واجهة المعرض</h2>
              <button onClick={() => window.location.reload()} className="gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs">
                إعادة تنشيط الصفحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function ShowroomApp() {
      const [activeTab, setActiveTab] = useState('pos'); // pos, stock, sales, reports

      // Collections from DB
      const [products, setProducts] = useState([]);
      const [showroomStock, setShowroomStock] = useState({});
      const [showroomSales, setShowroomSales] = useState([]);

      // POS Form State
      const [clientName, setClientName] = useState('');
      const [cartItems, setCartItems] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [notes, setNotes] = useState('');

      // Active Modal
      const [activeModal, setActiveModal] = useState(null);
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [editingStockProduct, setEditingStockProduct] = useState(null);
      const [stockInputValue, setStockInputValue] = useState('');

      // UI States
      const [toast, setToast] = useState(null);

      // Report Month Filter
      const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Sync Database
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            // Products defined by Admin
            onValue(ref(db, 'products'), snapshot => {
              try {
                const data = snapshot.val();
                setProducts(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            // Showroom Stock Count
            onValue(ref(db, 'showroomStock'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomStock(data || {});
              } catch (e) { console.error(e); }
            });

            // Showroom Sales Invoices
            onValue(ref(db, 'showroomSales'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomSales(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, products, showroomStock, showroomSales, cartItems]);

      // Low Stock Warning Items (<= 5 Bags)
      const lowStockItems = useMemo(() => {
        return products.filter(p => {
          const stockObj = showroomStock[p.id];
          const qty = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
          return qty <= 5;
        });
      }, [products, showroomStock]);

      // Filtered Products for Searching in POS
      const filteredProducts = useMemo(() => {
        return products.filter(p => p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }, [products, searchQuery]);

      // Cart Calculations
      const cartTotalAmount = useMemo(() => {
        return cartItems.reduce((sum, item) => sum + (parseFloat(item.totalPrice) || 0), 0);
      }, [cartItems]);

      const cartTotalBags = useMemo(() => {
        return cartItems.reduce((sum, item) => sum + (parseInt(item.quantityBags) || 0), 0);
      }, [cartItems]);

      // Add Product to Invoice Cart
      const handleAddToCart = (product) => {
        const existingIndex = cartItems.findIndex(item => item.productId === product.id);
        const stockQty = showroomStock[product.id] ? parseInt(showroomStock[product.id].bagsCount) || 0 : 0;

        if (stockQty <= 0) {
          showToast(`نفذ رصيد صنف (${product.name}) في مخزن المعرض!`, 'error');
          return;
        }

        const pricePerBag = parseFloat(product.pricePerBag) || (((parseFloat(product.pricePerTon) || 0) * (parseFloat(product.bagWeightKg) || 25)) / 1000);

        if (existingIndex > -1) {
          const updated = [...cartItems];
          const currentQty = updated[existingIndex].quantityBags;
          if (currentQty + 1 > stockQty) {
            showToast(`لا يمكن إضافة أكثر من المتاح بالمخزن (${stockQty} شكارة)`, 'error');
            return;
          }
          updated[existingIndex].quantityBags += 1;
          updated[existingIndex].totalPrice = updated[existingIndex].quantityBags * pricePerBag;
          setCartItems(updated);
        } else {
          setCartItems([...cartItems, {
            productId: product.id,
            productName: product.name,
            bagWeightKg: product.bagWeightKg || 25,
            pricePerBag: pricePerBag,
            quantityBags: 1,
            unitLabel: 'شيكارة',
            totalPrice: pricePerBag
          }]);
        }
      };

      // Update Item Quantity in Cart
      const handleUpdateCartQty = (index, newQty) => {
        const qty = parseInt(newQty) || 1;
        const item = cartItems[index];
        const stockQty = showroomStock[item.productId] ? parseInt(showroomStock[item.productId].bagsCount) || 0 : 0;

        if (qty > stockQty) {
          showToast(`الكمية المطلوبة أقصاها الرصيد المتوفر (${stockQty} شكارة)`, 'error');
          return;
        }

        const updated = [...cartItems];
        updated[index].quantityBags = qty;
        updated[index].totalPrice = qty * item.pricePerBag;
        setCartItems(updated);
      };

      // Remove Item from Cart
      const handleRemoveCartItem = (index) => {
        setCartItems(cartItems.filter((_, i) => i !== index));
      };

      // Save Invoice and Deduct Stock
      const handleCreateInvoice = (e) => {
        e.preventDefault();
        if (!clientName.trim()) {
          showToast('يرجى إدخال اسم العميل بشكل أساسي!', 'error');
          return;
        }
        if (cartItems.length === 0) {
          showToast('يرجى إضافة منتج واحد على الأقل للفاتورة!', 'error');
          return;
        }

        const { ref, push, set, update, db } = window.rtdbMethods;
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const invoiceNum = Math.floor(100000 + Math.random() * 900000);

        const preparedItems = cartItems.map(item => ({
          productId: item.productId,
          productName: item.productName,
          quantity: item.quantityBags,
          unitLabel: 'شيكارة',
          unitPrice: item.pricePerBag,
          total: item.totalPrice,
          weightKg: item.bagWeightKg * item.quantityBags
        }));

        const newSaleRef = push(ref(db, 'showroomSales'));
        const invoiceData = {
          invoiceNumber: invoiceNum,
          clientName: clientName.trim(),
          date: today,
          time: timeNow,
          items: preparedItems,
          totalAmount: cartTotalAmount,
          totalBags: cartTotalBags,
          notes: notes,
          createdAt: new Date().toISOString()
        };

        set(newSaleRef, invoiceData).then(() => {
          // الخصم التلقائي من مخزون المعرض لكل صنف
          cartItems.forEach(item => {
            const currentStock = showroomStock[item.productId] ? parseInt(showroomStock[item.productId].bagsCount) || 0 : 0;
            const updatedBags = Math.max(0, currentStock - item.quantityBags);

            update(ref(db, `showroomStock/${item.productId}`), {
              bagsCount: updatedBags,
              productName: item.productName,
              updatedAt: new Date().toISOString()
            });
          });

          // إضافة سجل للنظام
          push(ref(db, 'logs'), {
            action: 'SHOWROOM_SALE',
            description: `فاتورة معرض جديدة للعميل: ${clientName} بمبلغ ${cartTotalAmount} ج.م`,
            timestamp: new Date().toISOString()
          });

          setSelectedInvoice({ id: newSaleRef.key, ...invoiceData });
          setActiveModal('printInvoiceModal');

          // إعادة ضبط الفاتورة
          setClientName('');
          setCartItems([]);
          setNotes('');
          showToast('تمت الفاتورة وخصم الكمية من مخزون المعرض بنجاح');
        });
      };

      // Update Stock Quantity Directly
      const handleSaveStockEdit = (e) => {
        e.preventDefault();
        if (!editingStockProduct || !window.rtdbMethods) return;
        const { ref, update, db } = window.rtdbMethods;
        const newBags = parseInt(stockInputValue) || 0;

        update(ref(db, `showroomStock/${editingStockProduct.id}`), {
          bagsCount: newBags,
          productName: editingStockProduct.name,
          updatedAt: new Date().toISOString()
        }).then(() => {
          showToast(`تم تعديل مخزون المعرض للمنتج (${editingStockProduct.name}) إلى ${newBags} شكارة`);
          setActiveModal(null);
          setEditingStockProduct(null);
        });
      };

      // Report Sales Filtered
      const monthlyReportSales = useMemo(() => {
        return showroomSales.filter(s => s.date && s.date.slice(0, 7) === reportMonth);
      }, [showroomSales, reportMonth]);

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">
          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header Bar */}
          <header className="glass-card sticky top-0 z-40 px-6 py-4 flex items-center justify-between border-b border-dark-700">
            <div className="flex items-center gap-3">
              <img src={LOGO_URL} alt="Logo" className="w-10 h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
              <div>
                <h1 className="font-bold text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-[10px] text-gray-400">صفحة مبيعات المعرض والمخزون المباشر</p>
              </div>
            </div>

            <nav className="flex items-center gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700">
              {[
                { id: 'pos', label: 'إنشاء فاتورة جديدة', icon: 'shopping-cart' },
                { id: 'stock', label: 'التحكم في المخزون', icon: 'boxes' },
                { id: 'sales', label: 'سجل المبيعات', icon: 'receipt' },
                { id: 'reports', label: 'التقارير الشهريّة', icon: 'bar-chart-2' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                  {tab.id === 'stock' && lowStockItems.length > 0 && (
                    <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                  )}
                </button>
              ))}
            </nav>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">

            {/* 🚨 Critical Low Stock Warning Banner */}
            {lowStockItems.length > 0 && (
              <div className="bg-red-950/80 border border-red-600/60 p-4 rounded-2xl flex items-center justify-between shadow-xl animate-pulse">
                <div className="flex items-center gap-3">
                  <i data-lucide="alert-triangle" className="w-6 h-6 text-red-400"></i>
                  <div>
                    <h4 className="font-bold text-sm text-red-200">تنبيه حرج بالنواقص في مخزون المعرض!</h4>
                    <p className="text-xs text-red-300">
                      الأصناف التالية وصل رصيدها لـ 5 شكاير أو أقل: {lowStockItems.map(i => i.name).join('، ')}
                    </p>
                  </div>
                </div>
                <button onClick={() => setActiveTab('stock')} className="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-xl text-xs">
                  تعديل الرصيد الآن
                </button>
              </div>
            )}

            {/* TAB: POS (إنشاء الفاتورة والواجهة الرئيسية) */}
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                {/* قسم اختيار المنتجات المضافة من الإدارة (Left/Top 7 Cols) */}
                <div className="lg:col-span-7 space-y-4">
                  <div className="glass-card p-4 rounded-2xl flex items-center gap-3 border border-dark-700">
                    <i data-lucide="search" className="w-5 h-5 text-gold"></i>
                    <input
                      type="text"
                      placeholder="ابحث عن منتج مضاف من لوحة الإدارة..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="bg-transparent border-none text-white text-xs w-full focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {filteredProducts.map(prod => {
                      const stockObj = showroomStock[prod.id];
                      const bagsCount = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
                      const pricePerBag = parseFloat(prod.pricePerBag) || (((parseFloat(prod.pricePerTon) || 0) * (parseFloat(prod.bagWeightKg) || 25)) / 1000);
                      const isLow = bagsCount <= 5;

                      return (
                        <div key={prod.id} className={`glass-card p-4 rounded-2xl border flex flex-col justify-between space-y-3 ${isLow ? 'border-red-500/50 bg-red-950/10' : 'border-dark-700'}`}>
                          <div>
                            <div className="flex justify-between items-start">
                              <h4 className="font-bold text-sm text-white">{prod.name}</h4>
                              <span className="text-[10px] text-gray-400 bg-dark-950 px-2 py-0.5 rounded-lg">وزن {prod.bagWeightKg || 25}كجم</span>
                            </div>
                            <p className="text-xs text-gold font-bold mt-1">سعر الشيكارة: {pricePerBag.toLocaleString()} ج.م</p>
                          </div>

                          <div className="flex justify-between items-center pt-2 border-t border-dark-700/60">
                            <span className={`text-xs font-black ${isLow ? 'text-red-400' : 'text-green-400'}`}>
                              المتوفر: {bagsCount} شكارة
                            </span>
                            <button
                              onClick={() => handleAddToCart(prod)}
                              disabled={bagsCount <= 0}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 ${bagsCount > 0 ? 'gold-gradient text-dark-950 hover:brightness-110' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
                            >
                              <i data-lucide="plus" className="w-3.5 h-3.5"></i> إضافة للفاتورة
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* قسم تفاصيل الفاتورة الحالية والعميل (Right/Bottom 5 Cols) */}
                <div className="lg:col-span-5 space-y-4">
                  <form onSubmit={handleCreateInvoice} className="glass-card p-6 rounded-3xl border border-dark-700 space-y-5 gold-glow">
                    <div className="flex items-center gap-3 border-b border-dark-700 pb-3">
                      <img src={LOGO_URL} alt="Logo" className="w-8 h-8 rounded-full border border-gold object-contain" />
                      <h3 className="font-bold text-base text-gold">إعداد فاتورة مبيعات المعرض</h3>
                    </div>

                    <div>
                      <label className="text-xs text-gray-300 block mb-1 font-bold">اسم العميل <span className="text-red-400">*</span></label>
                      <input
                        type="text"
                        required
                        placeholder="اكتب اسم العميل بالكامل..."
                        value={clientName}
                        onChange={e => setClientName(e.target.value)}
                        className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none focus:border-gold"
                      />
                    </div>

                    {/* قائمة المنتجات المضافة للفاتورة */}
                    <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                      <label className="text-xs text-gray-400 block">الأصناف المضافة:</label>
                      {cartItems.length === 0 ? (
                        <p className="text-xs text-gray-500 text-center py-4 bg-dark-950 rounded-xl">لم يتم إضافة أي شيكارة بعد</p>
                      ) : (
                        cartItems.map((item, idx) => (
                          <div key={idx} className="bg-dark-950 p-3 rounded-xl border border-dark-700 flex justify-between items-center text-xs">
                            <div>
                              <strong className="text-white block">{item.productName}</strong>
                              <span className="text-gray-400 text-[10px]">{item.pricePerBag} ج.م / شكارة</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <input
                                type="number"
                                min="1"
                                value={item.quantityBags}
                                onChange={e => handleUpdateCartQty(idx, e.target.value)}
                                className="w-14 bg-dark-800 border border-dark-700 rounded-lg p-1 text-center text-gold font-bold text-xs"
                              />
                              <span className="font-bold text-white min-w-[60px] text-left">{item.totalPrice.toLocaleString()} ج.م</span>
                              <button type="button" onClick={() => handleRemoveCartItem(idx)} className="text-red-400 p-1 hover:text-red-300">
                                <i data-lucide="trash" className="w-4 h-4"></i>
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">ملاحظات إضافية</label>
                      <input
                        type="text"
                        placeholder="اختياري..."
                        value={notes}
                        onChange={e => setNotes(e.target.value)}
                        className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white outline-none"
                      />
                    </div>

                    {/* إجمالي الفاتورة */}
                    <div className="bg-dark-950 p-4 rounded-2xl border border-gold/30 space-y-2 text-xs">
                      <div className="flex justify-between text-gray-300">
                        <span>إجمالي الشكاير المطلوبة:</span>
                        <strong className="text-white font-black">{cartTotalBags} شكارة</strong>
                      </div>
                      <div className="flex justify-between text-base font-black border-t border-dark-700 pt-2">
                        <span className="gold-text">المبلغ الإجمالي للفاتورة:</span>
                        <span className="text-gold">{cartTotalAmount.toLocaleString()} ج.م</span>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl hover:brightness-110 transition-all text-sm flex items-center justify-center gap-2 shadow-lg"
                    >
                      <i data-lucide="printer" className="w-4 h-4"></i> تأكيد الفاتورة والطباعة
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* TAB: STOCK CONTROL (قسم التحكم وتتبع مخزون المعرض) */}
            {activeTab === 'stock' && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h2 className="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="boxes" className="w-5 h-5 text-gold"></i>
                    قسم التحكم في مخزون شيكارات المعرض والتعديل المباشر
                  </h2>
                  <span className="text-xs text-gray-400">تتبع مستقل عن المخزن الرئيسي للمصنع</span>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {products.map(prod => {
                    const stockObj = showroomStock[prod.id];
                    const bagsCount = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
                    const isLow = bagsCount <= 5;

                    return (
                      <div key={prod.id} className={`glass-card p-6 rounded-3xl border flex flex-col justify-between space-y-4 ${isLow ? 'border-red-500/80 bg-red-950/20' : 'border-dark-700'}`}>
                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="font-bold text-base text-white">{prod.name}</h3>
                            <p className="text-xs text-gray-400">وزن الشيكارة: {prod.bagWeightKg || 25} كجم</p>
                          </div>
                          {isLow && (
                            <span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse">
                              رصيد حرج!
                            </span>
                          )}
                        </div>

                        <div className="bg-dark-950 p-4 rounded-2xl border border-dark-700 flex justify-between items-center">
                          <span className="text-xs text-gray-400 block">الرصيد المتوفر المعروض:</span>
                          <span className={`text-2xl font-black ${isLow ? 'text-red-400' : 'text-gold'}`}>
                            {bagsCount} <span className="text-xs font-normal text-white">شكارة</span>
                          </span>
                        </div>

                        <button
                          onClick={() => {
                            setEditingStockProduct(prod);
                            setStockInputValue(bagsCount);
                            setActiveModal('editStockModal');
                          }}
                          className="w-full bg-dark-800 hover:bg-gold hover:text-dark-950 text-gold font-bold py-2.5 rounded-xl text-xs border border-gold/30 transition-all flex items-center justify-center gap-1.5"
                        >
                          <i data-lucide="edit-3" className="w-4 h-4"></i> تعديل كمية الشكاير
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: SALES LOG (عرض تفاصيل المبيعات) */}
            {activeTab === 'sales' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold flex items-center gap-2">
                  <i data-lucide="receipt" className="w-5 h-5 text-gold"></i>
                  سجل جميع فواتير مبيعات المعرض
                </h2>

                <div className="glass-card rounded-2xl overflow-hidden border border-dark-700">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-4">رقم الفاتورة</th>
                        <th className="p-4">تاريخ الفاتورة</th>
                        <th className="p-4">اسم العميل</th>
                        <th className="p-4">عدد الشكاير</th>
                        <th className="p-4">إجمالي المبلغ</th>
                        <th className="p-4 text-center">الإجراءات</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {showroomSales.map(sale => (
                        <tr key={sale.id} className="hover:bg-dark-800/40">
                          <td className="p-4 font-mono font-bold text-gray-300">#{sale.invoiceNumber || String(sale.id).slice(-5)}</td>
                          <td className="p-4 text-gray-400">{sale.date} - {sale.time}</td>
                          <td className="p-4 font-bold text-white">{sale.clientName}</td>
                          <td className="p-4 text-green-400 font-bold">{sale.totalBags} شكارة</td>
                          <td className="p-4 font-black text-gold">{Number(sale.totalAmount || 0).toLocaleString()} ج.م</td>
                          <td className="p-4 text-center">
                            <button
                              onClick={() => {
                                setSelectedInvoice(sale);
                                setActiveModal('printInvoiceModal');
                              }}
                              className="px-3 py-1.5 bg-dark-700 hover:text-gold rounded-xl font-bold border border-dark-600 transition-all flex items-center gap-1 mx-auto"
                            >
                              <i data-lucide="eye" className="w-3.5 h-3.5"></i> طباعة الفاتورة
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: REPORTS (التقارير الشهريّة) */}
            {activeTab === 'reports' && (
              <div className="space-y-6">
                <div className="glass-card p-6 rounded-3xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-base font-bold text-gold">تقارير مبيعات المعرض لكل شهر</h3>
                    <input
                      type="month"
                      value={reportMonth}
                      onChange={e => setReportMonth(e.target.value)}
                      className="bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white outline-none focus:border-gold"
                    />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-dark-950 p-4 rounded-2xl border border-dark-700 text-xs">
                    <div>
                      <span className="text-gray-400 block">إجمالي مبيعات شهر ({reportMonth}):</span>
                      <p className="text-2xl font-black text-gold mt-1">
                        {monthlyReportSales.reduce((sum, s) => sum + (parseFloat(s.totalAmount) || 0), 0).toLocaleString()} ج.م
                      </p>
                    </div>
                    <div>
                      <span className="text-gray-400 block">عدد الفواتير المحررة:</span>
                      <p className="text-2xl font-black text-white mt-1">{monthlyReportSales.length} فاتورة</p>
                    </div>
                    <div>
                      <span className="text-gray-400 block">إجمالي عدد الشكاير المباعة:</span>
                      <p className="text-2xl font-black text-green-400 mt-1">
                        {monthlyReportSales.reduce((sum, s) => sum + (parseInt(s.totalBags) || 0), 0)} شكارة
                      </p>
                    </div>
                  </div>
                </div>

                <div className="glass-card rounded-2xl p-4 overflow-x-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold">
                      <tr>
                        <th className="p-3">التاريخ</th>
                        <th className="p-3">رقم الفاتورة</th>
                        <th className="p-3">اسم العميل</th>
                        <th className="p-3">عدد الشكاير</th>
                        <th className="p-3">المبلغ الإجمالي</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {monthlyReportSales.map(s => (
                        <tr key={s.id} className="hover:bg-dark-800/50">
                          <td className="p-3">{s.date}</td>
                          <td className="p-3 font-mono text-gray-400">#{s.invoiceNumber || String(s.id).slice(-5)}</td>
                          <td className="p-3 font-bold">{s.clientName}</td>
                          <td className="p-3 text-green-400 font-bold">{s.totalBags} شكارة</td>
                          <td className="p-3 text-gold font-black">{Number(s.totalAmount || 0).toLocaleString()} ج.م</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* MODAL: EDIT SHOWROOM STOCK */}
          {activeModal === 'editStockModal' && editingStockProduct && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveStockEdit} className="glass-card p-6 rounded-3xl w-full max-w-md space-y-4">
                <h3 className="text-lg font-bold text-gold">تعديل كمية الشكاير المعروضة: {editingStockProduct.name}</h3>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">العدد المتوفر حالياً بالمخزن</label>
                  <input
                    type="number"
                    min="0"
                    required
                    value={stockInputValue}
                    onChange={e => setStockInputValue(e.target.value)}
                    className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm text-white outline-none focus:border-gold"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button type="submit" className="px-5 py-2 rounded-xl gold-gradient text-dark-950 font-bold text-xs">حفظ التحديث</button>
                </div>
              </form>
            </div>
          )}

          {/* 📄 MODAL: PRINT SHOWROOM INVOICE */}
          {activeModal === 'printInvoiceModal' && selectedInvoice && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-3xl max-h-[92vh] overflow-y-auto space-y-6 shadow-2xl">
                
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold text-black flex items-center gap-2">
                    <i data-lucide="printer" className="w-5 h-5 text-gold"></i>
                    معاينة فاتورة المعرض
                  </h3>
                  <div className="flex items-center gap-2">
                    <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                      <i data-lucide="printer" className="w-4 h-4"></i> طباعة الفاتورة
                    </button>
                    <button onClick={() => setActiveModal(null)} className="bg-gray-200 hover:bg-gray-300 text-black px-3 py-2 rounded-xl text-xs font-bold">إغلاق</button>
                  </div>
                </div>

                <div id="print-area" className="p-4 space-y-4">
                  <div className="flex justify-between items-center border-b-2 border-black pb-4">
                    <div className="text-right">
                      <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                      <p className="text-xs font-bold text-gray-700 mt-1">فاتورة بيع مباشرة - المعرض الرئيسي</p>
                      <p className="text-[10px] text-gray-600">التاريخ: {selectedInvoice.date} | الوقت: {selectedInvoice.time}</p>
                    </div>
                    <img src={LOGO_URL} alt="Logo" className="w-20 h-20 rounded-full border border-black object-contain" />
                  </div>

                  <div className="grid grid-cols-2 gap-3 bg-gray-50 p-4 rounded-xl border border-black text-xs">
                    <div>
                      <span className="text-gray-500 block">اسم العميل:</span>
                      <strong className="text-sm font-black text-black">{selectedInvoice.clientName}</strong>
                    </div>
                    <div>
                      <span className="text-gray-500 block">رقم الفاتورة:</span>
                      <strong className="text-black font-mono">#{selectedInvoice.invoiceNumber || String(selectedInvoice.id).slice(-6)}</strong>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-bold text-xs text-black">الأصناف المشتراة بالشيكارة:</h4>
                    <table className="w-full text-right text-xs border-collapse">
                      <thead>
                        <tr className="bg-gray-200 text-black border-b border-black">
                          <th className="p-2.5 border border-black font-bold">#</th>
                          <th className="p-2.5 border border-black font-bold">صنف العلف</th>
                          <th className="p-2.5 border border-black font-bold">عدد الشكاير</th>
                          <th className="p-2.5 border border-black font-bold">سعر الشيكارة</th>
                          <th className="p-2.5 border border-black font-bold">الإجمالي</th>
                        </tr>
                      </thead>
                      <tbody>
                        {Array.isArray(selectedInvoice.items) && selectedInvoice.items.map((item, idx) => (
                          <tr key={idx} className="border-b border-black">
                            <td className="p-2 border border-black text-center font-bold">{idx + 1}</td>
                            <td className="p-2 border border-black font-bold">{item.productName}</td>
                            <td className="p-2 border border-black font-black">{item.quantity} شكارة</td>
                            <td className="p-2 border border-black">{Number(item.unitPrice || 0).toLocaleString()} ج.م</td>
                            <td className="p-2 border border-black font-bold">{Number(item.total || 0).toLocaleString()} ج.م</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="flex justify-between items-center bg-gray-100 p-4 rounded-xl border border-black text-xs">
                    <div>
                      <span className="text-gray-600 block">ملاحظات:</span>
                      <p className="font-bold text-black">{selectedInvoice.notes || 'تسليم فوري من المعرض'}</p>
                    </div>
                    <div className="text-left">
                      <div>إجمالي عدد الشكاير: <strong className="text-black font-black">{selectedInvoice.totalBags} شكارة</strong></div>
                      <div>المبلغ الإجمالي المطلوب: <strong className="text-black font-black text-base">{Number(selectedInvoice.totalAmount || 0).toLocaleString()} جنيه</strong></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 text-center text-xs pt-8 font-bold border-t border-gray-300">
                    <div>توقيع المسؤول بالمعرض: .........</div>
                    <div>توقيع العميل المستلم: .........</div>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2.5 bg-gray-800 text-white rounded-xl text-xs font-bold">إغلاق المعاينة</button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <ShowroomApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
