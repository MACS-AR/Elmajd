<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصنع المجد للأعلاف - صفحة المعرض والمبيعات المباشرة</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.5);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    /* 🐔 حركة اهتزاز الدجاجة فوق الرسالة الترحيبية */
    @keyframes chickenWiggle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-10px) rotate(-8deg); }
      50% { transform: translateY(0) rotate(8deg); }
      75% { transform: translateY(-5px) rotate(-4deg); }
    }

    .chicken-wiggler {
      animation: chickenWiggle 1.2s ease-in-out infinite;
    }

    /* 🖨️ تحسينات الطباعة لتظهر بشكل جميل وواضح جداً */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-border {
        border: 2px solid #000000 !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 10px !important;
      }
      th, td {
        border: 1.5px solid #000000 !important;
        color: #000000 !important;
        padding: 8px 10px !important;
        font-size: 12px !important;
        text-align: right !important;
      }
      th {
        background-color: #f0f0f0 !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, remove, update, get, db: rtdb
    };
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    // Error Boundary
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center space-y-4">
              <i data-lucide="alert-triangle" className="w-12 h-12 text-gold"></i>
              <h2 className="text-xl font-bold">حدث خطأ في واجهة المعرض</h2>
              <button onClick={() => window.location.reload()} className="gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs">
                إعادة تنشيط الصفحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function ShowroomApp() {
      const [activeTab, setActiveTab] = useState('pos'); // pos, stock, sales, reports

      // Intro Splash State
      const [showIntro, setShowIntro] = useState(true);

      // Collections from DB
      const [products, setProducts] = useState([]);
      const [showroomStock, setShowroomStock] = useState({});
      const [showroomSales, setShowroomSales] = useState([]);

      // POS Form State
      const [clientName, setClientName] = useState('');
      const [cartItems, setCartItems] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [notes, setNotes] = useState('');

      // Sales Filter States
      const [salesSearchClient, setSalesSearchClient] = useState('');
      const [salesStartDate, setSalesStartDate] = useState('');
      const [salesEndDate, setSalesEndDate] = useState('');

      // Active Modal & Print Mode
      const [activeModal, setActiveModal] = useState(null); // printInvoiceModal, printSalesLogModal, editStockModal
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [editingStockProduct, setEditingStockProduct] = useState(null);
      const [stockInputValue, setStockInputValue] = useState('');

      // UI States
      const [toast, setToast] = useState(null);

      // Report Month Filter
      const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // إخفاء الواجهة الترحيبية بعد 3 ثوانٍ
      useEffect(() => {
        const timer = setTimeout(() => {
          setShowIntro(false);
        }, 3000);
        return () => clearTimeout(timer);
      }, []);

      // Sync Database
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'products'), snapshot => {
              try {
                const data = snapshot.val();
                setProducts(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'showroomStock'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomStock(data || {});
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'showroomSales'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomSales(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, products, showroomStock, showroomSales, cartItems, searchQuery, showIntro, salesSearchClient, salesStartDate, salesEndDate]);

      // Low Stock Warning Items (<= 5 Bags)
      const lowStockItems = useMemo(() => {
        return products.filter(p => {
          const stockObj = showroomStock[p.id];
          const qty = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
          return qty <= 5;
        });
      }, [products, showroomStock]);

      // 🔍 تصفية المنتجات عند البحث فقط (بدون إخفاء المضاف مسبقاً)
      const searchedProducts = useMemo(() => {
        if (!searchQuery.trim()) return []; // لا يتم عرض أي منتج إلا عند البحث
        return products.filter(p => p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase().trim()));
      }, [products, searchQuery]);

      // 📜 فلترة مبيعات السجل (حسب العميل والتاريخ)
      const filteredSalesLog = useMemo(() => {
        return showroomSales.filter(sale => {
          const matchesClient = !salesSearchClient.trim() || (sale.clientName && sale.clientName.toLowerCase().includes(salesSearchClient.toLowerCase().trim()));
          const matchesStart = !salesStartDate || (sale.date && sale.date >= salesStartDate);
          const matchesEnd = !salesEndDate || (sale.date && sale.date <= salesEndDate);
          return matchesClient && matchesStart && matchesEnd;
        });
      }, [showroomSales, salesSearchClient, salesStartDate, salesEndDate]);

      // Cart Calculations
      const cartTotalAmount = useMemo(() => {
        return cartItems.reduce((sum, item) => sum + (parseFloat(item.totalPrice) || 0), 0);
      }, [cartItems]);

      const cartTotalBags = useMemo(() => {
        return cartItems.reduce((sum, item) => sum + (parseInt(item.quantityBags) || 0), 0);
      }, [cartItems]);

      // Add Product to Invoice Cart
      const handleAddToCart = (product) => {
        const existingIndex = cartItems.findIndex(item => item.productId === product.id);
        const stockQty = showroomStock[product.id] ? parseInt(showroomStock[product.id].bagsCount) || 0 : 0;

        if (stockQty <= 0) {
          showToast(`نفذ رصيد صنف (${product.name}) في مخزن المعرض!`, 'error');
          return;
        }

        const pricePerBag = parseFloat(product.pricePerBag) || (((parseFloat(product.pricePerTon) || 0) * (parseFloat(product.bagWeightKg) || 25)) / 1000);

        if (existingIndex > -1) {
          const updated = [...cartItems];
          const currentQty = updated[existingIndex].quantityBags;
          if (currentQty + 1 > stockQty) {
            showToast(`لا يمكن إضافة أكثر من المتاح بالمخزن (${stockQty} شكارة)`, 'error');
            return;
          }
          updated[existingIndex].quantityBags += 1;
          updated[existingIndex].totalPrice = updated[existingIndex].quantityBags * pricePerBag;
          setCartItems(updated);
        } else {
          setCartItems([...cartItems, {
            productId: product.id,
            productName: product.name,
            bagWeightKg: product.bagWeightKg || 25,
            pricePerBag: pricePerBag,
            quantityBags: 1,
            unitLabel: 'شيكارة',
            totalPrice: pricePerBag
          }]);
        }

        showToast(`تم إدراج (${product.name}) بالفاتورة`);
      };

      const handleUpdateCartQty = (index, newQty) => {
        const qty = parseInt(newQty) || 1;
        const item = cartItems[index];
        const stockQty = showroomStock[item.productId] ? parseInt(showroomStock[item.productId].bagsCount) || 0 : 0;

        if (qty > stockQty) {
          showToast(`الكمية المطلوبة أقصاها الرصيد المتوفر (${stockQty} شكارة)`, 'error');
          return;
        }

        const updated = [...cartItems];
        updated[index].quantityBags = qty;
        updated[index].totalPrice = qty * item.pricePerBag;
        setCartItems(updated);
      };

      const handleRemoveCartItem = (index) => {
        setCartItems(cartItems.filter((_, i) => i !== index));
      };

      const handleCreateInvoice = (e) => {
        e.preventDefault();
        if (!clientName.trim()) {
          showToast('يرجى إدخال اسم العميل بشكل أساسي!', 'error');
          return;
        }
        if (cartItems.length === 0) {
          showToast('يرجى إضافة منتج واحد على الأقل للفاتورة!', 'error');
          return;
        }

        const { ref, push, set, update, db } = window.rtdbMethods;
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const invoiceNum = Math.floor(100000 + Math.random() * 900000);

        const preparedItems = cartItems.map(item => ({
          productId: item.productId,
          productName: item.productName,
          quantity: item.quantityBags,
          unitLabel: 'شيكارة',
          unitPrice: item.pricePerBag,
          total: item.totalPrice,
          weightKg: item.bagWeightKg * item.quantityBags
        }));

        const newSaleRef = push(ref(db, 'showroomSales'));
        const invoiceData = {
          invoiceNumber: invoiceNum,
          clientName: clientName.trim(),
          date: today,
          time: timeNow,
          items: preparedItems,
          totalAmount: cartTotalAmount,
          totalBags: cartTotalBags,
          notes: notes,
          createdAt: new Date().toISOString()
        };

        set(newSaleRef, invoiceData).then(() => {
          cartItems.forEach(item => {
            const currentStock = showroomStock[item.productId] ? parseInt(showroomStock[item.productId].bagsCount) || 0 : 0;
            const updatedBags = Math.max(0, currentStock - item.quantityBags);

            update(ref(db, `showroomStock/${item.productId}`), {
              bagsCount: updatedBags,
              productName: item.productName,
              updatedAt: new Date().toISOString()
            });
          });

          push(ref(db, 'logs'), {
            action: 'SHOWROOM_SALE',
            description: `فاتورة معرض جديدة للعميل: ${clientName} بمبلغ ${cartTotalAmount} ج.م`,
            timestamp: new Date().toISOString()
          });

          setSelectedInvoice({ id: newSaleRef.key, ...invoiceData });
          setActiveModal('printInvoiceModal');

          setClientName('');
          setCartItems([]);
          setNotes('');
          setSearchQuery('');
          showToast('تمت الفاتورة وخصم الكمية من مخزون المعرض بنجاح');
        });
      };

      const handleSaveStockEdit = (e) => {
        e.preventDefault();
        if (!editingStockProduct || !window.rtdbMethods) return;
        const { ref, update, db } = window.rtdbMethods;
        const newBags = parseInt(stockInputValue) || 0;

        update(ref(db, `showroomStock/${editingStockProduct.id}`), {
          bagsCount: newBags,
          productName: editingStockProduct.name,
          updatedAt: new Date().toISOString()
        }).then(() => {
          showToast(`تم تعديل مخزون المعرض للمنتج (${editingStockProduct.name}) إلى ${newBags} شكارة`);
          setActiveModal(null);
          setEditingStockProduct(null);
        });
      };

      const monthlyReportSales = useMemo(() => {
        return showroomSales.filter(s => s.date && s.date.slice(0, 7) === reportMonth);
      }, [showroomSales, reportMonth]);

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white relative pb-20 md:pb-6">
          
          {/* 🐔 1. شاشة الانترو - الفرخة المتهزة فوق الرسالة الترحيبية */}
          {showIntro && (
            <div className="fixed inset-0 z-50 bg-dark-950 flex flex-col items-center justify-center p-4">
              <div className="text-center space-y-4">
                <div className="inline-block text-8xl md:text-9xl chicken-wiggler drop-shadow-[0_10px_25px_rgba(212,175,55,0.5)]">
                  🐓
                </div>
                <h2 className="text-2xl md:text-4xl font-black gold-text">مرحباً بك في معرض مصنع المجد للأعلاف</h2>
                <p className="text-xs md:text-sm text-gray-400">جاري فتح الواجهة الرئيسية...</p>
              </div>
            </div>
          )}

          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-20 md:bottom-6 right-4 left-4 md:left-auto z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center justify-between md:justify-start gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <div className="flex items-center gap-2">
                <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
                {toast.message}
              </div>
            </div>
          )}

          {/* Header Bar */}
          <header className="glass-card sticky top-0 z-40 px-4 md:px-6 py-3 md:py-4 flex flex-col md:flex-row items-center justify-between border-b border-dark-700 gap-3">
            <div className="flex items-center justify-between w-full md:w-auto">
              <div className="flex items-center gap-3">
                <img src={LOGO_URL} alt="Logo" className="w-9 h-9 md:w-10 md:h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
                <div>
                  <h1 className="font-bold text-sm md:text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                  <p className="text-[9px] md:text-[10px] text-gray-400">صفحة مبيعات المعرض والمخزون المباشر</p>
                </div>
              </div>
            </div>

            <nav className="hidden md:flex items-center gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700">
              {[
                { id: 'pos', label: 'إنشاء فاتورة', icon: 'shopping-cart' },
                { id: 'stock', label: 'المخزون', icon: 'boxes' },
                { id: 'sales', label: 'سجل المبيعات', icon: 'receipt' },
                { id: 'reports', label: 'التقارير', icon: 'bar-chart-2' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                  {tab.id === 'stock' && lowStockItems.length > 0 && (
                    <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                  )}
                </button>
              ))}
            </nav>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-3 md:px-4 py-4 md:py-6 space-y-4 md:space-y-6">

            {/* 🚨 تنبيه النواقص */}
            {lowStockItems.length > 0 && (
              <div className="bg-red-950/80 border border-red-600/60 p-3 md:p-4 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-xl animate-pulse">
                <div className="flex items-center gap-3">
                  <i data-lucide="alert-triangle" className="w-6 h-6 text-red-400 shrink-0"></i>
                  <div>
                    <h4 className="font-bold text-xs md:text-sm text-red-200">تنبيه بالنواقص بالمخزن!</h4>
                    <p className="text-[11px] md:text-xs text-red-300">
                      أصناف رصيدها 5 أو أقل: {lowStockItems.map(i => i.name).join('، ')}
                    </p>
                  </div>
                </div>
                <button onClick={() => setActiveTab('stock')} className="w-full sm:w-auto bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs shrink-0 text-center">
                  تعديل الرصيد
                </button>
              </div>
            )}

            {/* TAB: POS (إنشاء الفاتورة والبحث والنتائج المباشرة) */}
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6">
                
                {/* 🔍 قسم البحث للظهور المباشر أسفل الخانة عند البحث فقط */}
                <div className="lg:col-span-7 space-y-4">
                  <div className="glass-card p-3 md:p-4 rounded-2xl flex items-center gap-3 border border-gold/40 shadow-lg">
                    <i data-lucide="search" className="w-5 h-5 text-gold shrink-0"></i>
                    <input
                      type="text"
                      placeholder="ابحث باسم صنف العلف للظهور والإضافة..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="bg-transparent border-none text-white text-xs md:text-sm w-full focus:outline-none placeholder:text-gray-500"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery('')} className="text-gray-400 hover:text-white text-xs">
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    )}
                  </div>

                  {/* 📜 المنتجات التي تبحث عنها فقط تعرض أسفل حقل البحث */}
                  {searchQuery.trim().length > 0 ? (
                    <div className="space-y-3">
                      <h4 className="text-xs font-bold text-gold flex items-center gap-1">
                        <i data-lucide="filter" className="w-3.5 h-3.5"></i>
                        نتائج البحث عن ({searchQuery}):
                      </h4>
                      {searchedProducts.length === 0 ? (
                        <div className="glass-card p-6 text-center text-xs text-gray-400 rounded-2xl">
                          لا يوجد منتج مطابق لهذا الاسم
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {searchedProducts.map(prod => {
                            const stockObj = showroomStock[prod.id];
                            const bagsCount = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
                            const pricePerBag = parseFloat(prod.pricePerBag) || (((parseFloat(prod.pricePerTon) || 0) * (parseFloat(prod.bagWeightKg) || 25)) / 1000);
                            const isLow = bagsCount <= 5;

                            return (
                              <div key={prod.id} className={`glass-card p-3.5 rounded-2xl border flex flex-col justify-between space-y-3 ${isLow ? 'border-red-500/50 bg-red-950/10' : 'border-dark-700'}`}>
                                <div>
                                  <div className="flex justify-between items-start">
                                    <h4 className="font-bold text-xs md:text-sm text-white">{prod.name}</h4>
                                    <span className="text-[9px] text-gray-400 bg-dark-950 px-2 py-0.5 rounded-lg">وزن {prod.bagWeightKg || 25}كجم</span>
                                  </div>
                                  <p className="text-xs text-gold font-bold mt-1">سعر الشيكارة: {pricePerBag.toLocaleString()} ج.م</p>
                                </div>

                  <div className="flex justify-between items-center border-b-2 border-black pb-3">
                    <div>
                      <h1 className="text-xl font-black text-black">مصنع المجد للأعلاف - كشف المبيعات</h1>
                      <p className="text-xs font-bold text-gray-700 mt-1">
                        تصفية: {salesSearchClient ? `العميل (${salesSearchClient})` : 'جميع العملاء'} | 
                        المدة: {salesStartDate || 'البداية'} إلى {salesEndDate || 'الآن'}
                      </p>
                    </div>
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full border border-black object-contain" />
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black">
                        <th className="p-2 border border-black font-bold">رقم الفاتورة</th>
                        <th className="p-2 border border-black font-bold">التاريخ والوقت</th>
                        <th className="p-2 border border-black font-bold">اسم العميل</th>
                        <th className="p-2 border border-black font-bold">عدد الشكاير</th>
                        <th className="p-2 border border-black font-bold">المبلغ الإجمالي</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredSalesLog.map(sale => (
                        <tr key={sale.id}>
                          <td className="p-2 border border-black font-mono font-bold">#{sale.invoiceNumber || String(sale.id).slice(-5)}</td>
                          <td className="p-2 border border-black">{sale.date} - {sale.time}</td>
                          <td className="p-2 border border-black font-bold">{sale.clientName}</td>
                          <td className="p-2 border border-black text-center font-bold">{sale.totalBags} شكارة</td>
                          <td className="p-2 border border-black font-bold">{Number(sale.totalAmount || 0).toLocaleString()} ج.م</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl border border-black text-xs font-bold">
                    <div>إجمالي عدد الفواتير: {filteredSalesLog.length} فاتورة</div>
                    <div>إجمالي المبيعات بالجنيه: {filteredSalesLog.reduce((sum, s) => sum + (parseFloat(s.totalAmount) || 0), 0).toLocaleString()} ج.م</div>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <ShowroomApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
