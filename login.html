  <style>

<body class="pb-20 md:pb-0">
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, remove, update, get, runTransaction, db: rtdb
    };
    
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, Component } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center space-y-4">
              <i data-lucide="alert-triangle" className="w-12 h-12 text-gold"></i>
              <h2 className="text-xl font-bold">حدث خطأ في واجهة المعرض</h2>
              <button onClick={() => window.location.reload()} className="gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs">
                إعادة تنشيط الصفحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function ShowroomApp() {
      const [activeTab, setActiveTab] = useState('pos');
      const [products, setProducts] = useState([]);
      const [showroomStock, setShowroomStock] = useState({});
      const [showroomSales, setShowroomSales] = useState([]);

      // POS Form State
      const [clientName, setClientName] = useState('');
      const [cartItems, setCartItems] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [showProductSearch, setShowProductSearch] = useState(false); // لإخفاء أو إظهار البحث
      const [notes, setNotes] = useState('');
      const [discount, setDiscount] = useState(0); // ميزة الخصم الجديدة
      const [paymentMethod, setPaymentMethod] = useState('كاش'); // ميزة طريقة الدفع

      // Active Modal & Toast
      const [activeModal, setActiveModal] = useState(null);
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [editingStockProduct, setEditingStockProduct] = useState(null);
      const [stockInputValue, setStockInputValue] = useState('');
      const [toast, setToast] = useState(null);
      const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      useEffect(() => {
        const initFirebaseListeners = () => {
          if (!window.rtdbMethods) return;
          const { ref, onValue, db } = window.rtdbMethods;

          onValue(ref(db, 'products'), snapshot => {
            try {
              const data = snapshot.val();
              setProducts(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
            } catch (e) { console.error(e); }
          });

          onValue(ref(db, 'showroomStock'), snapshot => {
            try {
              const data = snapshot.val();
              setShowroomStock(data || {});
            } catch (e) { console.error(e); }
          });

          onValue(ref(db, 'showroomSales'), snapshot => {
            try {
              const data = snapshot.val();
              setShowroomSales(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
            } catch (e) { console.error(e); }
          });
        };

        if (window.rtdbMethods) {
          initFirebaseListeners();
        } else {
          window.addEventListener('firebaseReady', initFirebaseListeners);
        }

        return () => window.removeEventListener('firebaseReady', initFirebaseListeners);
      }, []);

      useEffect(() => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }, [activeTab, activeModal, products, showroomStock, showroomSales, cartItems, showProductSearch]);

      const lowStockItems = useMemo(() => {
        return products.filter(p => {
          const stockObj = showroomStock[p.id];
          const qty = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
          return qty <= 5;
        });
      }, [products, showroomStock]);

      const filteredProducts = useMemo(() => {
        return products.filter(p => p.name && p.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }, [products, searchQuery]);

      // Cart Calculations
      const subTotalAmount = useMemo(() => {
        return cartItems.reduce((sum, item) => sum + (parseFloat(item.totalPrice) || 0), 0);
      }, [cartItems]);

      const cartTotalAmount = useMemo(() => {
        const final = subTotalAmount - (parseFloat(discount) || 0);
        return final > 0 ? final : 0;
      }, [subTotalAmount, discount]);

      const cartTotalBags = useMemo(() => {
        return cartItems.reduce((sum, item) => sum + (parseInt(item.quantityBags) || 0), 0);
      }, [cartItems]);

      // إخفاء القائمة تلقائياً بعد اختيار المنتج لملاءمة الهاتف
      const handleAddToCart = (product) => {
        const existingIndex = cartItems.findIndex(item => item.productId === product.id);
        const stockQty = showroomStock[product.id] ? parseInt(showroomStock[product.id].bagsCount) || 0 : 0;

        if (stockQty <= 0) {
          showToast(`نفذ رصيد صنف (${product.name}) في مخزن المعرض!`, 'error');
          return;
        }

        const pricePerBag = parseFloat(product.pricePerBag) || (((parseFloat(product.pricePerTon) || 0) * (parseFloat(product.bagWeightKg) || 25)) / 1000);

        if (existingIndex > -1) {
          const updated = [...cartItems];
          const currentQty = updated[existingIndex].quantityBags;
          if (currentQty + 1 > stockQty) {
            showToast(`لا يمكن إضافة أكثر من المتاح بالمخزن (${stockQty} شكارة)`, 'error');
            return;
          }
          updated[existingIndex].quantityBags += 1;
          updated[existingIndex].totalPrice = updated[existingIndex].quantityBags * pricePerBag;
          setCartItems(updated);
        } else {
          setCartItems([...cartItems, {
            productId: product.id,
            productName: product.name,
            bagWeightKg: product.bagWeightKg || 25,
            pricePerBag: pricePerBag,
            quantityBags: 1,
            unitLabel: 'شيكارة',
            totalPrice: pricePerBag
          }]);
        }

        // إخفاء البحث وإعادة ضبط حقل البحث للاستفادة من مساحة الشاشة
        setSearchQuery('');
        setShowProductSearch(false);
        showToast(`تم إضافة (${product.name}) إلى الفاتورة`);
      };

      const handleUpdateCartQty = (index, newQty) => {
        const qty = parseInt(newQty) || 1;
        const item = cartItems[index];
        const stockQty = showroomStock[item.productId] ? parseInt(showroomStock[item.productId].bagsCount) || 0 : 0;

        if (qty > stockQty) {
          showToast(`الكمية المطلوبة أقصاها الرصيد المتوفر (${stockQty} شكارة)`, 'error');
          return;
        }

        const updated = [...cartItems];
        updated[index].quantityBags = qty;
        updated[index].totalPrice = qty * item.pricePerBag;
        setCartItems(updated);
      };

      const handleRemoveCartItem = (index) => {
        setCartItems(cartItems.filter((_, i) => i !== index));
      };

      const handleClearCart = () => {
        setCartItems([]);
        setClientName('');
        setNotes('');
        setDiscount(0);
        showToast('تم تفريغ الفاتورة');
      };

      const handleCreateInvoice = async (e) => {
        e.preventDefault();
        if (!clientName.trim()) {
          showToast('يرجى إدخال اسم العميل بشكل أساسي!', 'error');
          return;
        }
        if (cartItems.length === 0) {
          showToast('يرجى إضافة منتج واحد على الأقل للفاتورة!', 'error');
          return;
        }

        const { ref, push, set, runTransaction, db } = window.rtdbMethods;
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
        const invoiceNum = Math.floor(100000 + Math.random() * 900000);

        const preparedItems = cartItems.map(item => ({
          productId: item.productId,
          productName: item.productName,
          quantity: item.quantityBags,
          unitLabel: 'شيكارة',
          unitPrice: item.pricePerBag,
          total: item.totalPrice,
          weightKg: item.bagWeightKg * item.quantityBags
        }));

        const newSaleRef = push(ref(db, 'showroomSales'));
        const invoiceData = {
          invoiceNumber: invoiceNum,
          clientName: clientName.trim(),
          date: today,
          time: timeNow,
          items: preparedItems,
          subTotal: subTotalAmount,
          discount: parseFloat(discount) || 0,
          totalAmount: cartTotalAmount,
          paymentMethod: paymentMethod,
          totalBags: cartTotalBags,
          notes: notes,
          createdAt: new Date().toISOString()
        };

        try {
          await set(newSaleRef, invoiceData);

          for (const item of cartItems) {
            const stockRef = ref(db, `showroomStock/${item.productId}`);
            await runTransaction(stockRef, (currentData) => {
              if (!currentData) {
                return { bagsCount: 0, productName: item.productName, updatedAt: new Date().toISOString() };
              }
              const currentBags = parseInt(currentData.bagsCount) || 0;
              return {
                ...currentData,
                bagsCount: Math.max(0, currentBags - item.quantityBags),
                productName: item.productName,
                updatedAt: new Date().toISOString()
              };
            });
          }

          push(ref(db, 'logs'), {
            action: 'SHOWROOM_SALE',
            description: `فاتورة معرض للعميل: ${clientName} بمبلغ ${cartTotalAmount} ج.م (${paymentMethod})`,
            timestamp: new Date().toISOString()
          });

          setSelectedInvoice({ id: newSaleRef.key, ...invoiceData });
          setActiveModal('printInvoiceModal');

          setClientName('');
          setCartItems([]);
          setNotes('');
          setDiscount(0);
          showToast('تمت الفاتورة وخصم الكمية بنجاح');
        } catch (err) {
          console.error(err);
          showToast('حدث خطأ أثناء حفظ الفاتورة، يرجى إعادة المحاولة', 'error');
        }
      };

      const handleSaveStockEdit = (e) => {
        e.preventDefault();
        if (!editingStockProduct || !window.rtdbMethods) return;
        const { ref, update, db } = window.rtdbMethods;
        const newBags = parseInt(stockInputValue) || 0;

        update(ref(db, `showroomStock/${editingStockProduct.id}`), {
          bagsCount: newBags,
          productName: editingStockProduct.name,
          updatedAt: new Date().toISOString()
        }).then(() => {
          showToast(`تم تعديل مخزون المعرض للمنتج (${editingStockProduct.name}) إلى ${newBags} شكارة`);
          setActiveModal(null);
          setEditingStockProduct(null);
        });
      };

      const monthlyReportSales = useMemo(() => {
        return showroomSales.filter(s => s.date && s.date.slice(0, 7) === reportMonth);
      }, [showroomSales, reportMonth]);

      const tabs = [
        { id: 'pos', label: 'الفاتورة', icon: 'shopping-cart' },
        { id: 'stock', label: 'المخزون', icon: 'boxes' },
        { id: 'sales', label: 'السجل', icon: 'receipt' },
        { id: 'reports', label: 'التقارير', icon: 'bar-chart-2' }
      ];

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">
          {/* Toast Alert */}
          {toast && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 md:left-6 md:translate-x-0 z-50 px-5 py-3 rounded-xl shadow-2xl text-xs md:text-sm font-bold flex items-center gap-2 border transition-all ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header Bar - Responsive for Mobile & Desktop */}
          <header className="glass-card sticky top-0 z-40 px-4 md:px-6 py-3 md:py-4 flex items-center justify-between border-b border-dark-700">
            <div className="flex items-center gap-2 md:gap-3">
              <img src={LOGO_URL} alt="Logo" className="w-8 h-8 md:w-10 md:h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
              <div>
                <h1 className="font-bold text-sm md:text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-[9px] md:text-[10px] text-gray-400">مبيعات المعرض والمخزون المباشر</p>
              </div>
            </div>

            {/* Desktop Navigation */}
            <nav className="hidden md:flex items-center gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700">
              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                  {tab.id === 'stock' && lowStockItems.length > 0 && (
                    <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                  )}
                </button>
              ))}
            </nav>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-3 md:px-4 py-4 md:py-6 space-y-4 md:space-y-6">
            
            {/* Warning Banner */}
            {lowStockItems.length > 0 && (
              <div className="bg-red-950/80 border border-red-600/60 p-3 md:p-4 rounded-2xl flex items-center justify-between shadow-xl animate-pulse text-xs md:text-sm">
                <div className="flex items-center gap-2 md:gap-3">
                  <i data-lucide="alert-triangle" className="w-5 h-5 md:w-6 md:h-6 text-red-400 shrink-0"></i>
                  <div>
                    <h4 className="font-bold text-red-200">تنبيه حرج بالنواقص!</h4>
                    <p className="text-[11px] md:text-xs text-red-300">
                      الأصناف الذاتية لـ 5 شكاير أو أقل: {lowStockItems.map(i => i.name).join('، ')}
                    </p>
                  </div>
                </div>
                <button onClick={() => setActiveTab('stock')} className="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-[10px] md:text-xs shrink-0">
                  تعديل الرصيد
                </button>
              </div>
            )}

            {/* TAB: POS */}
            {activeTab === 'pos' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6">

                {/* Left/Top: Cart Form First on Mobile for smooth UI */}
                <div className="lg:col-span-6 space-y-4">
                  <form onSubmit={handleCreateInvoice} className="glass-card p-4 md:p-6 rounded-3xl border border-dark-700 space-y-4 gold-glow">
                    <div className="flex items-center justify-between border-b border-dark-700 pb-3">
                      <div className="flex items-center gap-2">
                        <i data-lucide="shopping-bag" className="w-5 h-5 text-gold"></i>
                        <h3 className="font-bold text-sm md:text-base text-gold">إعداد فاتورة مبيعات المعرض</h3>
                      </div>
                      <div className="flex gap-2">
                        <button 
                          type="button" 
                          onClick={() => setShowProductSearch(!showProductSearch)} 
                          className="bg-gold/20 text-gold px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 hover:bg-gold/30 border border-gold/40"
                        >
                          <i data-lucide={showProductSearch ? 'x' : 'plus'} className="w-3.5 h-3.5"></i>
                          {showProductSearch ? 'إخفاء المنتجات' : 'إضافة منتج'}
                        </button>
                        {cartItems.length > 0 && (
                          <button type="button" onClick={handleClearCart} className="text-red-400 p-1.5 hover:text-red-300">
                            <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                          </button>
                        )}
                      </div>
                    </div>

                    <div>
                      <label className="text-xs text-gray-300 block mb-1 font-bold">اسم العميل <span className="text-red-400">*</span></label>
                      <input
                        type="text"
                        required
                        placeholder="اكتب اسم العميل بالكامل..."
                        value={clientName}
                        onChange={e => setClientName(e.target.value)}
                        className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 md:p-3 text-xs text-white outline-none focus:border-gold"
                      />
                    </div>

                    {/* قائمة المنتجات المضافة للفاتورة */}
                    <div className="space-y-2">
                      <label className="text-xs text-gray-400 block font-bold">الأصناف المضافة بالفاتورة:</label>
                      {cartItems.length === 0 ? (
                        <div onClick={() => setShowProductSearch(true)} className="cursor-pointer text-xs text-gray-400 text-center py-6 border border-dashed border-dark-700 bg-dark-950/60 rounded-2xl space-y-1 hover:border-gold/50 transition-all">
                          <i data-lucide="plus-circle" className="w-6 h-6 mx-auto text-gold"></i>
                          <p>انقر هنا للبحث وإضافة علف إلى الفاتورة</p>
                        </div>
                      ) : (
                        <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                          {cartItems.map((item, idx) => (
                            <div key={idx} className="bg-dark-950 p-2.5 md:p-3 rounded-2xl border border-dark-700 flex justify-between items-center text-xs">
                              <div>
                                <strong className="text-white block font-bold">{item.productName}</strong>
                                <span className="text-gray-400 text-[10px]">{item.pricePerBag} ج.م / شكارة</span>
                              </div>
                              <div className="flex items-center gap-2">
                                <input
                                  type="number"
                                  min="1"
                                  value={item.quantityBags}
                                  onChange={e => handleUpdateCartQty(idx, e.target.value)}
                                  className="w-12 bg-dark-800 border border-dark-700 rounded-lg p-1 text-center text-gold font-bold text-xs"
                                />
                                <span className="font-bold text-white min-w-[55px] text-left">{item.totalPrice.toLocaleString()} ج.م</span>
                                <button type="button" onClick={() => handleRemoveCartItem(idx)} className="text-red-400 p-1 hover:text-red-300">
                                  <i data-lucide="trash-2" className="w-4 h-4"></i>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    {/* طريقة الدفع والخصم */}
                    <div className="grid grid-cols-2 gap-3 pt-1">
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">طريقة الدفع</label>
                        <select 
                          value={paymentMethod} 
                          onChange={e => setPaymentMethod(e.target.value)}
                          className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2 text-xs text-white outline-none focus:border-gold"
                        >
                          <option value="كاش">كاش (نقدي)</option>
                          <option value="فيزا/شبكة">فيزا / شبكة</option>
                          <option value="تحويل بنكي">تحويل بنكي / فودافون كاش</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[11px] text-gray-400 block mb-1">خصم (جنيه)</label>
                        <input
                          type="number"
                          min="0"
                          placeholder="0"
                          value={discount}
                          onChange={e => setDiscount(e.target.value)}
                          className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2 text-xs text-gold font-bold outline-none focus:border-gold"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="text-[11px] text-gray-400 block mb-1">ملاحظات إضافية</label>
                      <input
                        type="text"
                        placeholder="اختياري..."
                        value={notes}
                        onChange={e => setNotes(e.target.value)}
                        className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2 text-xs text-white outline-none"
                      />
                    </div>

                    {/* الحساب النهائي */}
                    <div className="bg-dark-950 p-3.5 rounded-2xl border border-gold/30 space-y-1.5 text-xs">
                      <div className="flex justify-between text-gray-300">
                        <span>إجمالي الشكاير المطلوبة:</span>
                        <strong className="text-white font-black">{cartTotalBags} شكارة</strong>
                      </div>
                      {discount > 0 && (
                        <div className="flex justify-between text-red-400">
                          <span>الخصم المطبق:</span>
                          <strong>-{parseFloat(discount).toLocaleString()} ج.م</strong>
                        </div>
                      )}
                      <div className="flex justify-between text-sm md:text-base font-black border-t border-dark-700 pt-2">
                        <span className="gold-text">المبلغ الصافي للفاتورة:</span>
                        <span className="text-gold">{cartTotalAmount.toLocaleString()} ج.م</span>
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl hover:brightness-110 transition-all text-xs md:text-sm flex items-center justify-center gap-2 shadow-lg"
                    >
                      <i data-lucide="printer" className="w-4 h-4"></i> تأكيد الفاتورة والطباعة
                    </button>
                  </form>
                </div>

                {/* Right/Bottom: Product Search Drawer/Section */}
                <div className={`lg:col-span-6 space-y-4 ${!showProductSearch ? 'hidden lg:block' : 'block'}`}>
                  <div className="glass-card p-3 md:p-4 rounded-2xl flex items-center gap-2 border border-dark-700 shadow-md">
                    <i data-lucide="search" className="w-5 h-5 text-gold shrink-0"></i>
                    <input
                      type="text"
                      placeholder="ابحث عن منتج..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      className="bg-transparent border-none text-white text-xs w-full focus:outline-none"
                    />
                    {searchQuery && (
                      <button onClick={() => setSearchQuery('')} className="text-gray-400 text-xs">
                        <i data-lucide="x" className="w-4 h-4"></i>
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[70vh] overflow-y-auto pr-1">
                    {filteredProducts.map(prod => {
                      const stockObj = showroomStock[prod.id];
                      const bagsCount = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
                      const pricePerBag = parseFloat(prod.pricePerBag) || (((parseFloat(prod.pricePerTon) || 0) * (parseFloat(prod.bagWeightKg) || 25)) / 1000);
                      const isLow = bagsCount <= 5;

                      return (
                        <div key={prod.id} className={`glass-card p-3.5 rounded-2xl border flex flex-col justify-between space-y-2.5 transition-all ${isLow ? 'border-red-500/50 bg-red-950/10' : 'border-dark-700'}`}>
                          <div>
                            <div className="flex justify-between items-start gap-1">
                              <h4 className="font-bold text-xs md:text-sm text-white">{prod.name}</h4>
                              <span className="text-[9px] text-gray-400 bg-dark-950 px-1.5 py-0.5 rounded-md shrink-0">{prod.bagWeightKg || 25} كجم</span>
                            </div>
                            <p className="text-xs text-gold font-bold mt-1">السعر: {pricePerBag.toLocaleString()} ج.م</p>
                          </div>

                          <div className="flex justify-between items-center pt-2 border-t border-dark-700/60">
                            <span className={`text-[11px] font-black ${isLow ? 'text-red-400' : 'text-green-400'}`}>
                              المتوفر: {bagsCount} شكارة
                            </span>
                            <button
                              onClick={() => handleAddToCart(prod)}
                              disabled={bagsCount <= 0}
                              className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 ${bagsCount > 0 ? 'gold-gradient text-dark-950 hover:brightness-110 active:scale-95' : 'bg-gray-800 text-gray-500 cursor-not-allowed'}`}
                            >
                              <i data-lucide="plus" className="w-3.5 h-3.5"></i> اختيار
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {/* TAB: STOCK CONTROL */}
            {activeTab === 'stock' && (
              <div className="space-y-4 md:space-y-6">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                  <h2 className="text-base md:text-xl font-bold flex items-center gap-2">
                    <i data-lucide="boxes" className="w-5 h-5 text-gold"></i>
                    مخزون شيكارات المعرض
                  </h2>
                  <span className="text-[10px] md:text-xs text-gray-400">تتبع مستقل عن المخزن الرئيسي للمصنع</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                  {products.map(prod => {
                    const stockObj = showroomStock[prod.id];
                    const bagsCount = stockObj ? parseInt(stockObj.bagsCount) || 0 : 0;
                    const isLow = bagsCount <= 5;

                    return (
                      <div key={prod.id} className={`glass-card p-4 md:p-6 rounded-3xl border flex flex-col justify-between space-y-4 ${isLow ? 'border-red-500/80 bg-red-950/20' : 'border-dark-700'}`}>
                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="font-bold text-sm md:text-base text-white">{prod.name}</h3>
                            <p className="text-xs text-gray-400">وزن الشيكارة: {prod.bagWeightKg || 25} كجم</p>
                          </div>
                          {isLow && (
                            <span className="px-2 py-0.5 rounded-full text-[9px] font-bold bg-red-500/20 text-red-400 border border-red-500/40 animate-pulse">
                              حرج!
                            </span>
                          )}
                        </div>

                        <div className="bg-dark-950 p-3 md:p-4 rounded-2xl border border-dark-700 flex justify-between items-center">
                          <span className="text-xs text-gray-400 block">المتوفر بالمعرض:</span>
                          <span className={`text-xl md:text-2xl font-black ${isLow ? 'text-red-400' : 'text-gold'}`}>
                            {bagsCount} <span className="text-xs font-normal text-white">شكارة</span>
                          </span>
                        </div>

                        <button
                          onClick={() => {
                            setEditingStockProduct(prod);
                            setStockInputValue(bagsCount);
                            setActiveModal('editStockModal');
                          }}
                          className="w-full bg-dark-800 hover:bg-gold hover:text-dark-950 text-gold font-bold py-2 md:py-2.5 rounded-xl text-xs border border-gold/30 transition-all flex items-center justify-center gap-1.5"
                        >
                          <i data-lucide="edit-3" className="w-4 h-4"></i> تعديل الكمية
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* TAB: SALES LOG */}
            {activeTab === 'sales' && (
              <div className="space-y-4 md:space-y-6">
                <h2 className="text-base md:text-xl font-bold flex items-center gap-2">
                  <i data-lucide="receipt" className="w-5 h-5 text-gold"></i>
                  سجل مبيعات المعرض
                </h2>

                <div className="glass-card rounded-2xl overflow-x-auto border border-dark-700">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-3 md:p-4">رقم الفاتورة</th>
                        <th className="p-3 md:p-4">التاريخ</th>
                        <th className="p-3 md:p-4">العميل</th>
                        <th className="p-3 md:p-4">الشكاير</th>
                        <th className="p-3 md:p-4">المبلغ</th>
                        <th className="p-3 md:p-4 text-center">الإجراء</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {showroomSales.map(sale => (
                        <tr key={sale.id} className="hover:bg-dark-800/40">
                          <td className="p-3 md:p-4 font-mono font-bold text-gray-300">#{sale.invoiceNumber || String(sale.id).slice(-5)}</td>
                          <td className="p-3 md:p-4 text-gray-400">{sale.date}</td>
                          <td className="p-3 md:p-4 font-bold text-white">{sale.clientName}</td>
                          <td className="p-3 md:p-4 text-green-400 font-bold">{sale.totalBags} شكارة</td>
                          <td className="p-3 md:p-4 font-black text-gold">{Number(sale.totalAmount || 0).toLocaleString()} ج.م</td>
                          <td className="p-3 md:p-4 text-center">
                            <button
                              onClick={() => {
                                setSelectedInvoice(sale);
                                setActiveModal('printInvoiceModal');
                              }}
                              className="px-2.5 py-1 bg-dark-700 hover:text-gold rounded-lg font-bold border border-dark-600 transition-all flex items-center gap-1 mx-auto text-[10px] md:text-xs"
                            >
                              <i data-lucide="eye" className="w-3.5 h-3.5"></i> عرض
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: REPORTS */}
            {activeTab === 'reports' && (
              <div className="space-y-4 md:space-y-6">
                <div className="glass-card p-4 md:p-6 rounded-3xl space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm md:text-base font-bold text-gold">تقارير المبيعات الشهريّة</h3>
                    <input
                      type="month"
                      value={reportMonth}
                      onChange={e => setReportMonth(e.target.value)}
                      className="bg-dark-800 border border-dark-700 rounded-xl p-2 text-xs text-white outline-none focus:border-gold"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-dark-950 p-4 rounded-2xl border border-dark-700 text-xs">
                    <div>
                      <span className="text-gray-400 block">إجمالي الشهر ({reportMonth}):</span>
                      <p className="text-xl md:text-2xl font-black text-gold mt-1">
                        {monthlyReportSales.reduce((sum, s) => sum + (parseFloat(s.totalAmount) || 0), 0).toLocaleString()} ج.م
                      </p>
                    </div>
                    <div>
                      <span className="text-gray-400 block">عدد الفواتير:</span>
                      <p className="text-xl md:text-2xl font-black text-white mt-1">{monthlyReportSales.length} فاتورة</p>
                    </div>
                    <div>
                      <span className="text-gray-400 block">إجمالي الشكاير:</span>
                      <p className="text-xl md:text-2xl font-black text-green-400 mt-1">
                        {monthlyReportSales.reduce((sum, s) => sum + (parseInt(s.totalBags) || 0), 0)} شكارة
                      </p>
                    </div>
                  </div>
                </div>

                <div className="glass-card rounded-2xl p-3 md:p-4 overflow-x-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold">
                      <tr>
                        <th className="p-3">التاريخ</th>
                        <th className="p-3">رقم الفاتورة</th>
                        <th className="p-3">اسم العميل</th>
                        <th className="p-3">عدد الشكاير</th>
                        <th className="p-3">المبلغ الصافي</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {monthlyReportSales.map(s => (
                        <tr key={s.id} className="hover:bg-dark-800/50">
                          <td className="p-3">{s.date}</td>
                          <td className="p-3 font-mono text-gray-400">#{s.invoiceNumber || String(s.id).slice(-5)}</td>
                          <td className="p-3 font-bold">{s.clientName}</td>
                          <td className="p-3 text-green-400 font-bold">{s.totalBags} شكارة</td>
                          <td className="p-3 text-gold font-black">{Number(s.totalAmount || 0).toLocaleString()} ج.م</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* Bottom Navigation for Mobile Devices */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-dark-950/95 backdrop-blur-md border-t border-dark-700 md:hidden flex justify-around p-2">
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`flex flex-col items-center gap-1 p-2 rounded-xl text-[10px] font-bold transition-all ${activeTab === tab.id ? 'text-gold font-extrabold' : 'text-gray-400'}`}
              >
                <i data-lucide={tab.icon} className="w-5 h-5"></i>
                {tab.label}
              </button>
            ))}
          </nav>

          {/* MODAL: EDIT SHOWROOM STOCK */}
          {activeModal === 'editStockModal' && editingStockProduct && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveStockEdit} className="glass-card p-6 rounded-3xl w-full max-w-md space-y-4">
                <h3 className="text-base md:text-lg font-bold text-gold">تعديل كمية الشكاير: {editingStockProduct.name}</h3>
                <div>
                  <label className="text-xs text-gray-400 block mb-1">العدد المتوفر حالياً</label>
                  <input
                    type="number"
                    min="0"
                    required
                    value={stockInputValue}
                    onChange={e => setStockInputValue(e.target.value)}
                    className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm text-white outline-none focus:border-gold"
                  />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button type="submit" className="px-5 py-2 rounded-xl gold-gradient text-dark-950 font-bold text-xs">حفظ التحديث</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: PRINT SHOWROOM INVOICE */}
          {activeModal === 'printInvoiceModal' && selectedInvoice && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-2 md:p-4">
              <div className="bg-white text-black p-4 md:p-6 rounded-3xl w-full max-w-3xl max-h-[92vh] overflow-y-auto space-y-4 shadow-2xl">
                
                <div className="flex justify-between items-center border-b border-gray-200 pb-3 no-print">
                  <h3 className="text-sm md:text-lg font-bold text-black flex items-center gap-2">
                    <i data-lucide="printer" className="w-5 h-5 text-gold"></i>
                    معاينة فاتورة المعرض
                  </h3>
                  <div className="flex items-center gap-2">
                    <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-3 py-1.5 md:px-4 md:py-2 rounded-xl text-xs flex items-center gap-1 shadow">
                      <i data-lucide="printer" className="w-4 h-4"></i> طباعة
                    </button>
                    <button onClick={() => setActiveModal(null)} className="bg-gray-200 hover:bg-gray-300 text-black px-3 py-1.5 rounded-xl text-xs font-bold">إغلاق</button>
                  </div>
                </div>

                <div id="print-area" className="p-2 md:p-4 space-y-4">
                  <div className="flex justify-between items-center border-b-2 border-black pb-3">
                    <div className="text-right">
                      <h1 className="text-xl md:text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                      <p className="text-[11px] md:text-xs font-bold text-gray-700 mt-0.5">فاتورة بيع مباشرة - المعرض الرئيسي</p>
                      <p className="text-[10px] text-gray-600">التاريخ: {selectedInvoice.date} | الوقت: {selectedInvoice.time}</p>
                    </div>
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 md:w-20 md:h-20 rounded-full border border-black object-contain" />
                  </div>

                  <div className="grid grid-cols-2 gap-2 bg-gray-50 p-3 rounded-xl border border-black text-xs">
                    <div>
                      <span className="text-gray-500 block">اسم العميل:</span>
                      <strong className="text-xs md:text-sm font-black text-black">{selectedInvoice.clientName}</strong>
                    </div>
                    <div>
                      <span className="text-gray-500 block">رقم الفاتورة:</span>
                      <strong className="text-black font-mono">#{selectedInvoice.invoiceNumber || String(selectedInvoice.id).slice(-6)}</strong>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <h4 className="font-bold text-xs text-black">الأصناف المشتراة بالشيكارة:</h4>
                    <table className="w-full text-right text-xs border-collapse">
                      <thead>
                        <tr className="bg-gray-200 text-black border-b border-black">
                          <th className="p-2 border border-black font-bold">#</th>
                          <th className="p-2 border border-black font-bold">صنف العلف</th>
                          <th className="p-2 border border-black font-bold">الكمية</th>
                          <th className="p-2 border border-black font-bold">سعر الشيكارة</th>
                          <th className="p-2 border border-black font-bold">الإجمالي</th>
                        </tr>
                      </thead>
                      <tbody>
                        {Array.isArray(selectedInvoice.items) && selectedInvoice.items.map((item, idx) => (
                          <tr key={idx} className="border-b border-black">
                            <td className="p-1.5 border border-black text-center font-bold">{idx + 1}</td>
                            <td className="p-1.5 border border-black font-bold">{item.productName}</td>
                            <td className="p-1.5 border border-black font-black">{item.quantity} شكارة</td>
                            <td className="p-1.5 border border-black">{Number(item.unitPrice || 0).toLocaleString()} ج.م</td>
                            <td className="p-1.5 border border-black font-bold">{Number(item.total || 0).toLocaleString()} ج.م</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl border border-black text-xs">
                    <div>
                      <span className="text-gray-600 block">طريقة الدفع: <strong className="text-black">{selectedInvoice.paymentMethod || 'كاش'}</strong></span>
                      {selectedInvoice.notes && <p className="font-bold text-black text-[10px] mt-1">ملاحظات: {selectedInvoice.notes}</p>}
                    </div>
                    <div className="text-left space-y-0.5">
                      <div>عدد الشكاير: <strong className="text-black font-black">{selectedInvoice.totalBags} شكارة</strong></div>
                      {selectedInvoice.discount > 0 && <div>الخصم: <strong className="text-red-600">-{selectedInvoice.discount} ج.م</strong></div>}
                      <div>الصافي المطلوب: <strong className="text-black font-black text-sm md:text-base">{Number(selectedInvoice.totalAmount || 0).toLocaleString()} جنيه</strong></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4 text-center text-xs pt-6 font-bold border-t border-gray-300">
                    <div>توقيع المسؤول بالمعرض: .........</div>
                    <div>توقيع العميل المستلم: .........</div>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 bg-gray-800 text-white rounded-xl text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <ShowroomApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
