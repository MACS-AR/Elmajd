<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة العميل | مصنع المجد للأعلاف</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 10px !important;
      }
      th, td {
        border: 1.5px solid #000000 !important;
        color: #000000 !important;
        padding: 8px !important;
        font-size: 12px !important;
        text-align: right !important;
      }
      th {
        background-color: #e5e7eb !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, update, db: rtdb
    };
  </script>

  <!-- React Client Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png";

    function ClientApp() {
      const [currentClient, setCurrentClient] = useState(null);
      const [phoneInput, setPhoneInput] = useState('');
      const [activeTab, setActiveTab] = useState('newOrder'); // newOrder, myOrders, statement

      // Database lists
      const [clients, setClients] = useState([]);
      const [products, setProducts] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [myOrders, setMyOrders] = useState([]);
      const [allCollections, setAllCollections] = useState([]);

      // UI States
      const [toast, setToast] = useState(null);
      const [cartItems, setCartItems] = useState([]);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [unitType, setUnitType] = useState('ton');
      const [quantity, setQuantity] = useState('1');
      const [paymentType, setPaymentType] = useState('cash'); // cash or credit
      const [orderNotes, setOrderNotes] = useState('');
      const [activeModal, setActiveModal] = useState(null); // printStatement

      // Statement Filter Dates
      const [statementFilter, setStatementFilter] = useState({
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // 📲 التحقق التلقائي من رقم الهاتف والدخول
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const phoneParam = urlParams.get('phone') || localStorage.getItem('userPhone');
        const savedClient = localStorage.getItem('clientData');

        if (savedClient) {
          try {
            setCurrentClient(JSON.parse(savedClient));
          } catch(e) {}
        } else if (phoneParam) {
          const clean = String(phoneParam).replace(/\D/g, '');
          setCurrentClient({
            id: 'cli_' + clean,
            name: `عميل (${clean})`,
            phone: clean,
            address: 'مصر'
          });
        }
      }, []);

      // 🔄 مزامنة قاعدة البيانات والبحث عن بيانات العميل الحقيقية
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const phoneParam = urlParams.get('phone') || localStorage.getItem('userPhone');
        if (!phoneParam) return;
        const cleanPhone = String(phoneParam).replace(/\D/g, '');

        const checkInt = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(checkInt);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'clients'), snapshot => {
              const data = snapshot.val();
              if (data) {
                const list = Object.keys(data).map(k => ({ id: k, ...data[k] }));
                setClients(list);
                const matched = list.find(c => c.phone && String(c.phone).replace(/\D/g, '') === cleanPhone);
                if (matched) {
                  setCurrentClient(matched);
                  localStorage.setItem('clientData', JSON.stringify(matched));
                }
              }
            });
          }
        }, 100);
      }, []);

      // Realtime Sync for Orders, Products, Collections, Drivers
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'products'), snap => {
              const data = snap.val();
              setProducts(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'drivers'), snap => {
              const data = snap.val();
              setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'orders'), snap => {
              const data = snap.val();
              const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : [];
              setMyOrders(list);
            });

            onValue(ref(db, 'collections'), snap => {
              const data = snap.val();
              const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : [];
              setAllCollections(list);
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, currentClient, cartItems]);

      const handleManualLogin = (e) => {
        e.preventDefault();
        const clean = phoneInput.trim().replace(/\D/g, '');
        if (!clean) {
          showToast('يرجى إدخال رقم الهاتف', 'error');
          return;
        }

        const found = clients.find(c => c.phone && String(c.phone).replace(/\D/g, '') === clean);
        if (found) {
          setCurrentClient(found);
          localStorage.setItem('userPhone', clean);
          localStorage.setItem('clientData', JSON.stringify(found));
          showToast(`أهلاً بك يا ${found.name}`);
        } else {
          const newObj = { id: 'cli_' + clean, name: `عميل (${clean})`, phone: clean, address: 'مصر' };
          setCurrentClient(newObj);
          localStorage.setItem('userPhone', clean);
          localStorage.setItem('clientData', JSON.stringify(newObj));
          showToast('تم تسجيل الدخول برقم الهاتف');
        }
      };

      // سلة الطلبات
      const handleAddToCart = () => {
        const prod = products.find(p => p.id === selectedProductId);
        if (!prod) {
          showToast('اختر صنف العلف أولاً', 'error');
          return;
        }
        const qty = parseFloat(quantity) || 1;
        let price = 0;
        let weightTons = 0;

        if (unitType === 'ton') {
          price = (parseFloat(prod.pricePerTon) || 0) * qty;
          weightTons = qty;
        } else {
          price = (parseFloat(prod.pricePerBag) || 0) * qty;
          weightTons = (qty * (parseFloat(prod.bagWeightKg) || 25)) / 1000;
        }

        const newItem = {
          id: Date.now().toString(),
          productId: prod.id,
          productName: prod.name,
          unitType,
          unitLabel: unitType === 'ton' ? 'طن' : `شيكارة (${prod.bagWeightKg || 25} كجم)`,
          quantity: qty,
          price,
          weightTons
        };

        setCartItems([...cartItems, newItem]);
        setSelectedProductId('');
        setQuantity('1');
        showToast('تمت الإضافة للسلة');
      };

      const removeFromCart = (id) => setCartItems(cartItems.filter(i => i.id !== id));

      const totalOrderAmount = useMemo(() => cartItems.reduce((a, b) => a + b.price, 0), [cartItems]);
      const totalOrderWeight = useMemo(() => cartItems.reduce((a, b) => a + b.weightTons, 0), [cartItems]);

      // إرسال الطلب للإدارة (موضح فيه اسم العميل وأنه طلب مباشر)
      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (cartItems.length === 0) {
          showToast('السلة فارغة', 'error');
          return;
        }

        const { ref, push, set, db } = window.rtdbMethods;
        const newOrder = {
          repId: 'client_self',
          repName: `[طلب مباشر من العميل]`,
          repPhone: currentClient.phone || '',
          clientId: currentClient.id,
          clientName: currentClient.name,
          clientAddress: currentClient.address || '',
          driverId: drivers[0] ? drivers[0].id : 'default_driver',
          driverName: drivers[0] ? drivers[0].name : 'سائق المصنع',
          items: cartItems,
          cargoType: cartItems.map(i => i.productName).join(' + '),
          quantity: totalOrderWeight.toFixed(2),
          totalAmount: totalOrderAmount.toFixed(2),
          paymentType: paymentType, // نقدي أو آجل
          notes: orderNotes + (paymentType === 'credit' ? ' [طلب آجل]' : ' [طلب نقدي]'),
          status: 'قيد الانتظار',
          date: new Date().toISOString().slice(0, 10),
          createdAt: new Date().toISOString()
        };

        const newRef = push(ref(db, 'orders'));
        set(newRef, newOrder).then(() => {
          showToast('تم إرسال طلبك بنجاح للإدارة!');
          setCartItems([]);
          setOrderNotes('');
          setActiveTab('myOrders');
        });
      };

      // طلبات العميل الحالي
      const clientOrders = useMemo(() => {
        if (!currentClient) return [];
        return myOrders.filter(o => o.clientId === currentClient.id || (o.clientName && o.clientName.trim() === currentClient.name.trim()));
      }, [myOrders, currentClient]);

      // تحصيلات العميل الحالي
      const clientCollections = useMemo(() => {
        if (!currentClient) return [];
        return allCollections.filter(c => c.clientId === currentClient.id || (c.clientName && c.clientName.trim() === currentClient.name.trim()));
      }, [allCollections, currentClient]);

      // حساب المديونية الإجمالية والرصيد
      const clientBalanceInfo = useMemo(() => {
        const totalDebits = clientOrders.filter(o => o.status !== 'ملغي').reduce((sum, o) => sum + (parseFloat(o.totalAmount) || 0), 0);
        const totalCredits = clientCollections.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);
        const currentDebt = totalDebits - totalCredits;
        return { totalDebits, totalCredits, currentDebt };
      }, [clientOrders, clientCollections]);

      // تصفية حركات كشف الحساب بالفترة المحددة
      const filteredStatementOrders = useMemo(() => {
        return clientOrders.filter(o => {
          const matchFrom = statementFilter.fromDate ? o.date >= statementFilter.fromDate : true;
          const matchTo = statementFilter.toDate ? o.date <= statementFilter.toDate : true;
          return matchFrom && matchTo;
        });
      }, [clientOrders, statementFilter]);

      const filteredStatementCollections = useMemo(() => {
        return clientCollections.filter(c => {
          const matchFrom = statementFilter.fromDate ? c.date >= statementFilter.fromDate : true;
          const matchTo = statementFilter.toDate ? c.date <= statementFilter.toDate : true;
          return matchFrom && matchTo;
        });
      }, [clientCollections, statementFilter]);

      const combinedStatementLedger = useMemo(() => {
        const ledger = [];
        filteredStatementOrders.forEach(o => {
          ledger.push({
            date: o.date,
            type: 'فاتورة مبيعات',
            description: `طلب أعلاف (${o.cargoType || 'علف'}) - ${o.paymentType === 'credit' ? 'آجل' : 'نقدي'}`,
            debit: parseFloat(o.totalAmount) || 0,
            credit: 0
          });
        });
        filteredStatementCollections.forEach(c => {
          ledger.push({
            date: c.date,
            type: 'توريد وسداد',
            description: `توريد مبلغ نقدي (${c.method || 'نقدي'})`,
            debit: 0,
            credit: parseFloat(c.amount) || 0
          });
        });
        return ledger.sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [filteredStatementOrders, filteredStatementCollections]);

      // شاشة تسجيل الدخول إذا لم يتوفر الحساب
      if (!currentClient) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-dark-950">
            <form onSubmit={handleManualLogin} className="glass-card p-6 md:p-8 rounded-3xl w-full max-w-md gold-glow space-y-6 text-right">
              <div className="text-center">
                <img src={LOGO_URL} alt="Logo" className="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-gold shadow-lg p-1 bg-dark-900 object-contain" />
                <h1 className="text-2xl font-black text-white">بوابة العميل | <span className="gold-text">مصنع المجد</span></h1>
                <p className="text-xs text-gray-400 mt-1">أدخل رقم هاتفك لعرض حسابك، طلب الأعلاف، وكشف الحساب</p>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="text-xs text-gray-300 block mb-1 font-bold">رقم الهاتف المسجل</label>
                  <input
                    type="tel"
                    required
                    placeholder="مثال: 01012345678"
                    value={phoneInput}
                    onChange={e => setPhoneInput(e.target.value)}
                    className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm text-gold font-bold focus:border-gold outline-none text-right font-mono"
                  />
                </div>

                <button type="submit" className="w-full gold-gradient text-dark-950 font-black py-3.5 rounded-xl hover:brightness-110 transition-all text-xs md:text-sm shadow-lg flex items-center justify-center gap-2">
                  <i data-lucide="log-in" className="w-4 h-4"></i> الدخول إلى بوابة العميل
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header */}
          <header className="glass-card sticky top-0 z-40 px-4 md:px-6 py-3 md:py-4 flex flex-col md:flex-row items-center justify-between border-b border-dark-700 gap-3">
            <div className="flex items-center justify-between w-full md:w-auto">
              <div className="flex items-center gap-3">
                <img src={LOGO_URL} alt="Logo" className="w-9 h-9 md:w-10 md:h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
                <div>
                  <h1 className="font-bold text-sm md:text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                  <p className="text-[10px] text-gold font-bold">العميل: {currentClient.name} | <span dir="ltr">{currentClient.phone}</span></p>
                </div>
              </div>

              <button onClick={() => { localStorage.removeItem('clientData'); setCurrentClient(null); }} className="md:hidden text-xs text-red-400 bg-red-500/10 px-2.5 py-1 rounded-lg border border-red-500/20">
                خروج
              </button>
            </div>

            <nav className="flex items-center gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700 w-full md:w-auto justify-center">
              {[
                { id: 'newOrder', label: 'طلب أعلاف جديد', icon: 'plus-circle' },
                { id: 'myOrders', label: 'طلباتي ومشترياتي', icon: 'shopping-cart' },
                { id: 'statement', label: 'كشف الحساب والمديونية', icon: 'file-text' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                </button>
              ))}
            </nav>

            <button onClick={() => { localStorage.removeItem('clientData'); setCurrentClient(null); }} className="hidden md:flex bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-2 rounded-xl text-xs items-center gap-1.5">
              <i data-lucide="log-out" className="w-4 h-4"></i> خروج
            </button>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-3 md:px-4 py-4 md:py-8 space-y-6">

            {/* TAB 1: NEW ORDER */}
            {activeTab === 'newOrder' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-7 space-y-6">
                  <div className="glass-card p-5 rounded-3xl space-y-4">
                    <h3 className="text-base font-bold text-gold flex items-center gap-2">
                      <i data-lucide="package" className="w-5 h-5"></i>
                      اختر أصناف الأعلاف والكميات المطلوبة
                    </h3>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div className="md:col-span-1">
                        <label className="text-xs text-gray-400 block mb-1">الصنف</label>
                        <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                          <option value="">-- اختر الصنف --</option>
                          {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs text-gray-400 block mb-1">الوحدة</label>
                        <select value={unitType} onChange={e => setUnitType(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                          <option value="ton">بالطن</option>
                          <option value="bag">بالشيكارة</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-xs text-gray-400 block mb-1">الكمية</label>
                        <input type="number" step="0.1" min="0.1" value={quantity} onChange={e => setQuantity(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white font-bold" />
                      </div>
                    </div>

                    <button type="button" onClick={handleAddToCart} className="w-full bg-dark-800 border border-gold/40 hover:bg-gold hover:text-dark-950 text-gold font-bold p-3 rounded-xl text-xs flex items-center justify-center gap-2 transition">
                      <i data-lucide="plus" className="w-4 h-4"></i> إدراج في السلة
                    </button>
                  </div>
                </div>

                <div className="lg:col-span-5 glass-card p-5 rounded-3xl space-y-5 gold-glow flex flex-col justify-between">
                  <div className="space-y-4">
                    <h3 className="text-base font-bold text-gold border-b border-dark-700 pb-3 flex justify-between items-center">
                      <span>سلة طلباتك</span>
                      <span className="text-xs text-gray-400">{cartItems.length} صنف</span>
                    </h3>

                    <div className="space-y-2 max-h-52 overflow-y-auto">
                      {cartItems.length === 0 ? (
                        <p className="text-xs text-gray-500 text-center py-6">السلة فارغة</p>
                      ) : (
                        cartItems.map(item => (
                          <div key={item.id} className="bg-dark-950 p-3 rounded-xl flex justify-between items-center text-xs border border-dark-700">
                            <div>
                              <span className="font-bold text-white">{item.productName}</span>
                              <p className="text-[10px] text-gray-400">{item.quantity} {item.unitLabel} | <strong className="text-gold">{item.price.toLocaleString()} ج.م</strong></p>
                            </div>
                            <button onClick={() => removeFromCart(item.id)} className="text-red-400"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="space-y-2">
                      <label className="text-xs text-gray-400 block font-bold">طريقة الدفع المطلوبة:</label>
                      <div className="grid grid-cols-2 gap-2">
                        <button type="button" onClick={() => setPaymentType('cash')} className={`p-2.5 rounded-xl text-xs font-bold border ${paymentType === 'cash' ? 'bg-gold text-dark-950 border-gold' : 'bg-dark-800 text-gray-300 border-dark-700'}`}>
                          دفع نقدي كاش
                        </button>
                        <button type="button" onClick={() => setPaymentType('credit')} className={`p-2.5 rounded-xl text-xs font-bold border ${paymentType === 'credit' ? 'bg-amber-600 text-white border-amber-500' : 'bg-dark-800 text-gray-300 border-dark-700'}`}>
                          طلب آجل (على الحساب)
                        </button>
                      </div>
                    </div>

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">ملاحظات والتفاصيل</label>
                      <textarea rows="2" value={orderNotes} onChange={e => setOrderNotes(e.target.value)} placeholder="أي تعليمات خاصة بالتوصيل..." className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white outline-none"></textarea>
                    </div>
                  </div>

                  <div className="space-y-3 pt-3 border-t border-dark-700">
                    <div className="flex justify-between items-center text-sm font-bold">
                      <span className="text-gray-300">المبلغ الإجمالي:</span>
                      <span className="text-gold text-base">{totalOrderAmount.toLocaleString()} ج.م</span>
                    </div>

                    <button onClick={handleSubmitOrder} className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl text-xs flex items-center justify-center gap-2 hover:brightness-110 shadow-lg">
                      <i data-lucide="send" className="w-4 h-4"></i> إرسال الطلب رسمياً للإدارة
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: MY ORDERS */}
            {activeTab === 'myOrders' && (
              <div className="space-y-4">
                <h2 className="text-base font-bold text-gold flex items-center gap-2">
                  <i data-lucide="shopping-cart" className="w-5 h-5"></i> سجل طلباتك ومشترياتك السابقة
                </h2>

                <div className="glass-card rounded-2xl overflow-x-auto border border-dark-700">
                  <table className="w-full text-right text-xs min-w-[600px]">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-3">التاريخ</th>
                        <th className="p-3">نوع الطلب</th>
                        <th className="p-3">الحمولة والأصناف</th>
                        <th className="p-3">الكمية</th>
                        <th className="p-3">المبلغ الإجمالي</th>
                        <th className="p-3">الحالة لدى الإدارة</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {clientOrders.length === 0 ? (
                        <tr><td colSpan="6" className="p-6 text-center text-gray-400">لا توجد طلبات مسجلة باسمك حالياً</td></tr>
                      ) : (
                        clientOrders.map(o => (
                          <tr key={o.id} className="hover:bg-dark-800/40">
                            <td className="p-3 text-gray-300">{o.date}</td>
                            <td className="p-3 font-bold">{o.paymentType === 'credit' ? <span className="text-amber-400">آجل</span> : <span className="text-green-400">نقدي</span>}</td>
                            <td className="p-3 font-bold text-white">{o.cargoType || 'علف'}</td>
                            <td className="p-3 font-black">{o.quantity} طن</td>
                            <td className="p-3 font-bold text-gold">{Number(o.totalAmount || 0).toLocaleString()} ج.م</td>
                            <td className="p-3 font-bold">
                              <span className={`px-2.5 py-1 rounded-full text-[10px] ${o.status === 'مقبول' ? 'bg-green-500/10 text-green-400' : 'bg-yellow-500/10 text-yellow-400'}`}>
                                {o.status || 'قيد الانتظار'}
                              </span>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 3: STATEMENT & PDF PRINT */}
            {activeTab === 'statement' && (
              <div className="space-y-6">
                <div className="glass-card p-5 rounded-3xl space-y-4">
                  <h3 className="text-base font-bold text-gold flex items-center gap-2">
                    <i data-lucide="file-text" className="w-5 h-5"></i> تصفية كشف الحساب وتحديد المدى الزمني
                  </h3>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                      <label className="text-xs text-gray-400 block mb-1 font-bold">من تاريخ</label>
                      <input type="date" value={statementFilter.fromDate} onChange={e => setStatementFilter({ ...statementFilter, fromDate: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1 font-bold">إلى تاريخ</label>
                      <input type="date" value={statementFilter.toDate} onChange={e => setStatementFilter({ ...statementFilter, toDate: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
                    </div>
                    <div className="flex items-end">
                      <button onClick={() => setActiveModal('printStatement')} className="w-full gold-gradient text-dark-950 font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
                        <i data-lucide="printer" className="w-4 h-4"></i> طباعة أو تحميل كشف الحساب (PDF/A4)
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-3 border-t border-dark-700 text-xs">
                    <div className="bg-dark-950 p-3 rounded-xl border border-dark-700">
                      <span className="text-gray-400 block">إجمالي المسحوبات (الفواتير):</span>
                      <strong className="text-white text-base font-black">{clientBalanceInfo.totalDebits.toLocaleString()} ج.م</strong>
                    </div>
                    <div className="bg-dark-950 p-3 rounded-xl border border-dark-700">
                      <span className="text-gray-400 block">إجمالي المسدد والمورد:</span>
                      <strong className="text-green-400 text-base font-black">{clientBalanceInfo.totalCredits.toLocaleString()} ج.م</strong>
                    </div>
                    <div className="bg-dark-950 p-3 rounded-xl border border-red-500/30">
                      <span className="text-red-400 block font-bold">المديونية الحالية (الرصيد):</span>
                      <strong className="text-red-400 text-lg font-black">{clientBalanceInfo.currentDebt.toLocaleString()} ج.م</strong>
                    </div>
                  </div>
                </div>

                <div className="glass-card rounded-2xl p-4 overflow-x-auto border border-dark-700">
                  <table className="w-full text-right text-xs min-w-[650px]">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-3">التاريخ</th>
                        <th className="p-3">نوع الحركة</th>
                        <th className="p-3">البيان والتفاصيل</th>
                        <th className="p-3 text-red-400">مدين (+) مسحوبات</th>
                        <th className="p-3 text-green-400">دائن (-) سداد</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {combinedStatementLedger.length === 0 ? (
                        <tr><td colSpan="5" className="p-6 text-center text-gray-400">لا توجد حركات مسجلة خلال هذه الفترة</td></tr>
                      ) : (
                        combinedStatementLedger.map((item, idx) => (
                          <tr key={idx} className="hover:bg-dark-800/40">
                            <td className="p-3 text-gray-300">{item.date}</td>
                            <td className="p-3 font-bold"><span className={`px-2 py-0.5 rounded text-[10px] ${item.type === 'فاتورة مبيعات' ? 'bg-red-500/10 text-red-400' : 'bg-green-500/10 text-green-400'}`}>{item.type}</span></td>
                            <td className="p-3 text-white">{item.description}</td>
                            <td className="p-3 font-bold text-red-400">{item.debit > 0 ? item.debit.toLocaleString() + ' ج.م' : '-'}</td>
                            <td className="p-3 font-bold text-green-400">{item.credit > 0 ? item.credit.toLocaleString() + ' ج.م' : '-'}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* 🖨️ PRINT MODAL A4 */}
          {activeModal === 'printStatement' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold">معاينة كشف الحساب للطباعة أو الحفظ (PDF)</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i> طباعة / حفظ PDF
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                    <p className="text-sm font-bold text-black">كشف حساب تفصيلي للعميل</p>
                    <div className="flex justify-between text-xs mt-3 text-black font-semibold bg-gray-100 p-2 rounded border border-black">
                      <span>اسم العميل: <strong>{currentClient.name}</strong></span>
                      <span>رقم التليفون: <strong dir="ltr">{currentClient.phone}</strong></span>
                      <span>الفترة: <strong>{statementFilter.fromDate} إلى {statementFilter.toDate}</strong></span>
                    </div>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">نوع الحركة</th>
                        <th className="p-2 border border-black font-bold">البيان والتفاصيل</th>
                        <th className="p-2 border border-black font-bold">مدين (مسحوبات)</th>
                        <th className="p-2 border border-black font-bold">دائن (سداد)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {combinedStatementLedger.map((item, idx) => (
                        <tr key={idx} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{item.date}</td>
                          <td className="p-2 border border-black font-bold">{item.type}</td>
                          <td className="p-2 border border-black font-medium">{item.description}</td>
                          <td className="p-2 border border-black font-bold">{item.debit > 0 ? item.debit.toLocaleString() : '-'}</td>
                          <td className="p-2 border border-black font-bold">{item.credit > 0 ? item.credit.toLocaleString() : '-'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>إجمالي المسحوبات: {combinedStatementLedger.reduce((a, b) => a + b.debit, 0).toLocaleString()} ج.م</span>
                    <span>إجمالي المدفوعات: {combinedStatementLedger.reduce((a, b) => a + b.credit, 0).toLocaleString()} ج.م</span>
                    <span className="text-red-700">الرصيد المتبقي (المديونية): {(combinedStatementLedger.reduce((a, b) => a + b.debit, 0) - combinedStatementLedger.reduce((a, b) => a + b.credit, 0)).toLocaleString()} ج.م</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ClientApp />);
  </script>
</body>
</html>
