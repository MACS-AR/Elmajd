<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - المجد للأعلاف</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <nav class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b-2 border-[#10b981]">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://raw.githubusercontent.com/username/elmajd-erp/main/assets/images/logo.png" alt="المجد للأعلاف" class="h-10">
        <h1 class="font-bold text-[#047857]">إعدادات الحساب</h1>
      </div>
      <button onclick="window.history.back()" class="text-gray-500 hover:text-[#10b981] p-2 rounded transition">
        <i class="fa-solid fa-arrow-left text-xl"></i> رجوع
      </button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-4 md:p-6 space-y-6 mt-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- البيانات الأساسية -->
      <div class="card p-6 md:col-span-2">
        <h3 class="font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-user-pen text-[#10b981]"></i> البيانات الشخصية</h3>
        <form id="profileForm" class="space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">الاسم بالكامل</label>
              <input type="text" id="userName" class="w-full border p-2.5 rounded-lg outline-none focus:border-[#10b981]">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">رقم الهاتف</label>
              <input type="tel" id="userPhone" dir="ltr" class="w-full border p-2.5 rounded-lg outline-none focus:border-[#10b981]">
            </div>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">البريد الإلكتروني (غير قابل للتعديل)</label>
            <input type="email" id="userEmail" class="w-full border p-2.5 rounded-lg bg-gray-100 text-gray-500 outline-none" readonly>
          </div>
          <button type="submit" class="btn-primary w-full py-3 mt-2">تحديث البيانات</button>
        </form>
      </div>

      <!-- الأمان وتغيير كلمة المرور -->
      <div class="card p-6 border-t-4 border-[#d97706]">
        <h3 class="font-bold text-gray-800 mb-4 border-b pb-2"><i class="fa-solid fa-shield-halved text-[#d97706]"></i> الأمان</h3>
        <form id="passwordForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold mb-1">كلمة المرور الجديدة</label>
            <input type="password" id="newPassword" required class="w-full border p-2.5 rounded-lg outline-none focus:border-[#d97706]">
          </div>
          <button type="submit" class="btn-gold w-full py-3 rounded-lg font-bold text-white shadow-md">تغيير كلمة المرور</button>
        </form>
      </div>

    </div>
  </main>

  <script type="module">
    import { auth, db } from "./assets/js/firebase/config.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged, updatePassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { showToast } from "./assets/js/utils/ui.js";
    import { logActivity } from "./assets/js/services/audit.js";

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return window.location.href = "login.html";
      currentUser = user;
      
      const docRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(docRef);
      if (docSnap.exists()) {
        const data = docSnap.data();
        document.getElementById('userName').value = data.name || '';
        document.getElementById('userPhone').value = data.phone || user.phoneNumber || '';
        document.getElementById('userEmail').value = user.email || 'تسجيل برقم الهاتف';
      }
    });

    // تحديث البيانات الأساسية
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await updateDoc(doc(db, "users", currentUser.uid), {
          name: document.getElementById('userName').value,
          phone: document.getElementById('userPhone').value
        });
        await logActivity(currentUser.uid, "تحديث الملف الشخصي");
        showToast("تم تحديث البيانات بنجاح", "success");
      } catch (error) {
        showToast("حدث خطأ أثناء التحديث", "error");
      }
    });

    // تغيير كلمة المرور
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPass = document.getElementById('newPassword').value;
      if (newPass.length < 6) return showToast("كلمة المرور يجب أن تكون 6 أحرف على الأقل", "warning");

      try {
        await updatePassword(currentUser, newPass);
        await logActivity(currentUser.uid, "تغيير كلمة المرور");
        showToast("تم تغيير كلمة المرور بنجاح", "success");
        e.target.reset();
      } catch (error) {
        showToast("فشل التغيير. يرجى تسجيل الخروج والدخول مجدداً ثم المحاولة.", "error");
      }
    });
  </script>
</body>
</html>
