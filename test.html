<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة مناديب مبيعات المجد للأعلاف</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.5);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 10px !important;
      }
      th, td {
        border: 1.5px solid #000000 !important;
        color: #000000 !important;
        padding: 8px !important;
        font-size: 12px !important;
        text-align: right !important;
      }
      th {
        background-color: #e5e7eb !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, update, db: rtdb
    };
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    function RepApp() {
      // حالة بيانات المندوب المسجل من صفحة index.html
      const [currentRep, setCurrentRep] = useState(null);

      // Active Tab (يفتح تلقائياً على إنشاء الفواتير)
      const [activeTab, setActiveTab] = useState('newOrder'); // newOrder, myOrders, collections, clientStatement, repStatement

      // Database Collections
      const [salesReps, setSalesReps] = useState([]);
      const [clients, setClients] = useState([]);
      const [drivers, setDrivers] = useState([]); 
      const [products, setProducts] = useState([]);
      const [myOrders, setMyOrders] = useState([]);
      const [collectionsList, setCollectionsList] = useState([]);

      // UI States
      const [toast, setToast] = useState(null);
      const [clientSearch, setClientSearch] = useState('');
      const [productSearch, setProductSearch] = useState('');
      const [activeModal, setActiveModal] = useState(null); // printStatementModal, printRepSalesModal, printCollectionReceiptModal
      const [lastSavedCollection, setLastSavedCollection] = useState(null);

      // Form & Cart States للطلب جديد
      const [selectedClientId, setSelectedClientId] = useState('');
      const [selectedDriverId, setSelectedDriverId] = useState(''); 
      const [cartItems, setCartItems] = useState([]);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [unitType, setUnitType] = useState('ton');
      const [quantity, setQuantity] = useState('1');
      const [orderNotes, setOrderNotes] = useState('');

      // حالة قسم التحصيلات والتوريدات النقدية
      const [collectionClientId, setCollectionClientId] = useState('');
      const [collectionSearchText, setCollectionSearchText] = useState('');
      const [collectionAmount, setCollectionAmount] = useState('');
      const [collectionDate, setCollectionDate] = useState(new Date().toISOString().slice(0, 10));
      const [collectionMethod, setCollectionMethod] = useState('نقدي');
      const [collectionNotes, setCollectionNotes] = useState('');

      // كشف حساب العملاء والمندوبين
      const [statementFilter, setStatementFilter] = useState({
        clientId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // 1. استقبال تسجيل الدخول التلقائي من الرابط أو localStorage
      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const phoneParam = urlParams.get('phone') || localStorage.getItem('userPhone');
        const savedRepData = localStorage.getItem('repData');

        if (savedRepData) {
          try {
            setCurrentRep(JSON.parse(savedRepData));
          } catch(e) {
            console.error(e);
          }
        } else if (phoneParam) {
          setCurrentRep({
            id: 'rep_' + phoneParam,
            name: `مندوب (${phoneParam})`,
            phone: phoneParam,
            region: 'مبيعات عامة'
          });
        }
      }, []);

      // 2. مزامنة قاعدة البيانات لحظياً مع Firebase
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'salesReps'), snapshot => {
              const data = snapshot.val();
              const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : [];
              setSalesReps(list);
              
              // تحديث بيانات المندوب الحالي من القائمة إن وجدت
              const urlParams = new URLSearchParams(window.location.search);
              const phoneParam = urlParams.get('phone') || localStorage.getItem('userPhone');
              if (phoneParam && list.length > 0) {
                const matched = list.find(r => r.phone && r.phone.trim() === phoneParam.trim());
                if (matched) setCurrentRep(matched);
              }
            });

            onValue(ref(db, 'clients'), snapshot => {
              const data = snapshot.val();
              setClients(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'drivers'), snapshot => {
              const data = snapshot.val();
              setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'products'), snapshot => {
              const data = snapshot.val();
              setProducts(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'orders'), snapshot => {
              const data = snapshot.val();
              const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : [];
              setMyOrders(list);
            });

            onValue(ref(db, 'collections'), snapshot => {
              const data = snapshot.val();
              const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : [];
              setCollectionsList(list);
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, currentRep, cartItems, clientSearch, productSearch, collectionClientId, collectionSearchText]);

      // 🔍 بحث مباشر للعملاء والمنتجات
      const searchedClientsList = useMemo(() => {
        const q = clientSearch.trim().toLowerCase();
        if (!q) return [];
        return clients.filter(c => c.name && c.name.toLowerCase().includes(q));
      }, [clients, clientSearch]);

      const searchedCollectionClientsList = useMemo(() => {
        const q = collectionSearchText.trim().toLowerCase();
        if (!q) return [];
        return clients.filter(c => c.name && c.name.toLowerCase().includes(q));
      }, [clients, collectionSearchText]);

      // 💰 حساب مديونية العميل الحالية من الفواتير المقبولة رسمياً من المصنع ناقص التحصيلات
      const selectedClientAccountInfo = useMemo(() => {
        if (!collectionClientId) return { totalDebits: 0, totalCredits: 0, currentDebt: 0 };

        // الفواتير المقبولة فقط من المصنع تضاف كمديونيات آجل
        const approvedOrders = myOrders.filter(o => o.clientId === collectionClientId && o.status === 'مقبول');
        const totalDebits = approvedOrders.reduce((sum, o) => sum + (parseFloat(o.totalAmount) || 0), 0);

        // المبالغ المسددة والمحصلة
        const clientCollections = collectionsList.filter(c => c.clientId === collectionClientId);
        const totalCredits = clientCollections.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0);

        const currentDebt = totalDebits - totalCredits;

        return { totalDebits, totalCredits, currentDebt };
      }, [collectionClientId, myOrders, collectionsList]);

      // إضافة منتج لسلة الطلب
      const handleAddToCart = (productParam) => {
        const product = productParam || products.find(p => p.id === selectedProductId);
        if (!product) {
          showToast('يرجى اختيار صنف العلف أولاً', 'error');
          return;
        }

        const qty = parseFloat(quantity) || 1;
        let price = 0;
        let weightTons = 0;

        if (unitType === 'ton') {
          price = (parseFloat(product.pricePerTon) || 0) * qty;
          weightTons = qty;
        } else {
          price = (parseFloat(product.pricePerBag) || 0) * qty;
          weightTons = (qty * (parseFloat(product.bagWeightKg) || 25)) / 1000;
        }

        const newItem = {
          id: Date.now().toString(),
          productId: product.id,
          productName: product.name,
          unitType,
          unitLabel: unitType === 'ton' ? 'طن' : `شيكارة (${product.bagWeightKg || 25} كجم)`,
          quantity: qty,
          price,
          weightTons
        };

        setCartItems([...cartItems, newItem]);
        setSelectedProductId('');
        setQuantity('1');
        showToast(`تم إدراج (${product.name}) بالسلة بنجاح`);
      };

      const removeFromCart = (itemId) => {
        setCartItems(cartItems.filter(item => item.id !== itemId));
      };

      const totalOrderAmount = useMemo(() => cartItems.reduce((a, b) => a + b.price, 0), [cartItems]);
      const totalOrderWeightTons = useMemo(() => cartItems.reduce((a, b) => a + b.weightTons, 0), [cartItems]);

      // رفع الطلب للمصنع
      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (!selectedClientId) {
          showToast('يرجى اختيار العميل أولاً', 'error');
          return;
        }
        if (!selectedDriverId) {
          showToast('يرجى تحديد السائق المكلف بالتوصيل', 'error');
          return;
        }
        if (cartItems.length === 0) {
          showToast('السلة فارغة، اضف منتجاً واحداً على الأقل للطلب', 'error');
          return;
        }

        const { ref, push, set, db } = window.rtdbMethods;
        const client = clients.find(c => c.id === selectedClientId);
        const driver = drivers.find(d => d.id === selectedDriverId);

        const newOrder = {
          repId: currentRep ? currentRep.id : 'rep_direct',
          repName: currentRep ? currentRep.name : 'مندوب المبيعات',
          repPhone: currentRep ? currentRep.phone || '' : '',
          clientId: selectedClientId,
          clientName: client ? client.name : 'عميل',
          clientAddress: client ? client.address || '' : '',
          driverId: selectedDriverId,
          driverName: driver ? driver.name : 'سائق',
          driverTruck: driver ? driver.truckNumber || '' : '',
          region: client ? client.region || (currentRep ? currentRep.region : '') : '',
          items: cartItems,
          cargoType: cartItems.map(i => i.productName).join(' + '),
          quantity: totalOrderWeightTons.toFixed(2),
          totalAmount: totalOrderAmount.toFixed(2),
          tripsCount: 1,
          notes: orderNotes,
          status: 'قيد الانتظار', // عند قبول الإدارة تصبح 'مقبول' وتدخل تلقائياً في مديونية العميل الآجل
          date: new Date().toISOString().slice(0, 10),
          createdAt: new Date().toISOString()
        };

        const newRef = push(ref(db, 'orders'));
        set(newRef, newOrder).then(() => {
          showToast('تم رفع الطلب للمصنع بنجاح!');
          setCartItems([]);
          setSelectedClientId('');
          setSelectedDriverId('');
          setOrderNotes('');
          setClientSearch('');
          setActiveTab('myOrders');
        });
      };

      // 💵 تسجيل التوريد النقدي وتخفيض المديونية لتسمع في المصنع والمندوب فوراً
      const handleSaveCollection = (e) => {
        e.preventDefault();
        if (!collectionClientId) {
          showToast('يرجى اختيار العميل المطلوب التوريد لحسابه', 'error');
          return;
        }
        const amt = parseFloat(collectionAmount);
        if (!amt || amt <= 0) {
          showToast('يرجى إدخال مبلغ تحصيل صحيح أكبر من صفر', 'error');
          return;
        }

        const { ref, push, set, db } = window.rtdbMethods;
        const clientObj = clients.find(c => c.id === collectionClientId);
        const oldDebt = selectedClientAccountInfo.currentDebt;
        const remainingDebt = oldDebt - amt;

        const newCollection = {
          repId: currentRep ? currentRep.id : 'rep_direct',
          repName: currentRep ? currentRep.name : 'مندوب المبيعات',
          clientId: collectionClientId,
          clientName: clientObj ? clientObj.name : 'عميل',
          amount: amt,
          previousDebt: oldDebt,
          remainingDebt: remainingDebt,
          date: collectionDate,
          method: collectionMethod,
          notes: collectionNotes,
          createdAt: new Date().toISOString()
        };

        const colRef = push(ref(db, 'collections'));
        set(colRef, newCollection).then(() => {
          setLastSavedCollection(newCollection);
          showToast(`تم تنزيل ${amt.toLocaleString()} ج.م من حساب (${clientObj ? clientObj.name : ''}) بنجاح`);
          setCollectionAmount('');
          setCollectionNotes('');
          setActiveModal('printCollectionReceiptModal');
        });
      };

      // طلبات وتحصيلات المندوب الحالي
      const repOrders = useMemo(() => {
        if (!currentRep) return [];
        return myOrders.filter(o => o.repId === currentRep.id || o.repPhone === currentRep.phone);
      }, [myOrders, currentRep]);

      const repCollections = useMemo(() => {
        if (!currentRep) return [];
        return collectionsList.filter(c => c.repId === currentRep.id || c.repName === currentRep.name);
      }, [collectionsList, currentRep]);

      // تصفية كشف حساب العملاء
      const statementOrders = useMemo(() => {
        return myOrders.filter(o => {
          const matchClient = statementFilter.clientId ? o.clientId === statementFilter.clientId : true;
          const matchFrom = statementFilter.fromDate ? o.date >= statementFilter.fromDate : true;
          const matchTo = statementFilter.toDate ? o.date <= statementFilter.toDate : true;
          return matchClient && matchFrom && matchTo;
        });
      }, [myOrders, statementFilter]);

      const statementCollections = useMemo(() => {
        return collectionsList.filter(c => {
          const matchClient = statementFilter.clientId ? c.clientId === statementFilter.clientId : true;
          const matchFrom = statementFilter.fromDate ? c.date >= statementFilter.fromDate : true;
          const matchTo = statementFilter.toDate ? c.date <= statementFilter.toDate : true;
          return matchClient && matchFrom && matchTo;
        });
      }, [collectionsList, statementFilter]);

      // الحركة المركبة لكشف الحساب
      const clientLedgerCombined = useMemo(() => {
        const combined = [];
        statementOrders.forEach(o => {
          combined.push({
            id: o.id,
            date: o.date,
            type: 'مبيعات أعلاف',
            description: `فاتورة حمولة (${o.cargoType || 'علف'}) - سائق: ${o.driverName || 'سائق'}`,
            debit: parseFloat(o.totalAmount) || 0,
            credit: 0,
            status: o.status || 'قيد الانتظار'
          });
        });
        statementCollections.forEach(c => {
          combined.push({
            id: c.id,
            date: c.date,
            type: 'تحصيل نقدية',
            description: `توريد وسداد نقدي (${c.method || 'نقدي'}) - ${c.notes || 'سداد جزء'}`,
            debit: 0,
            credit: parseFloat(c.amount) || 0,
            status: 'مقبول'
          });
        });
        return combined.sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [statementOrders, statementCollections]);

      // إذا لم تتوفر بيانات الدخول تلقائياً
      if (!currentRep) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-dark-950 text-white">
            <div className="glass-card p-8 rounded-3xl text-center space-y-4 max-w-md w-full gold-glow">
              <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full mx-auto border border-gold p-1" />
              <h2 className="text-xl font-bold">جاري التعرف على حساب المندوب...</h2>
              <p className="text-xs text-gray-400">يرجى تسجيل الدخول من صفحة الدخول الموحدة الرئيسية</p>
              <a href="index.html" className="inline-block gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs">
                الانتقال لصفحة الدخول الرئيسية
              </a>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">
          
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header Bar */}
          <header className="glass-card sticky top-0 z-40 px-4 md:px-6 py-3 md:py-4 flex flex-col md:flex-row items-center justify-between border-b border-dark-700 gap-3">
            <div className="flex items-center justify-between w-full md:w-auto">
              <div className="flex items-center gap-3">
                <img src={LOGO_URL} alt="Logo" className="w-9 h-9 md:w-10 md:h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
                <div>
                  <h1 className="font-bold text-sm md:text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                  <p className="text-[10px] text-gold font-bold">حساب المندوب: {currentRep.name} ({currentRep.phone})</p>
                </div>
              </div>

              <a href="index.html" className="md:hidden text-xs text-red-400 bg-red-500/10 px-2.5 py-1 rounded-lg border border-red-500/20">
                خروج
              </a>
            </div>

            <nav className="flex flex-wrap items-center justify-center gap-1.5 md:gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700 w-full md:w-auto">
              {[
                { id: 'newOrder', label: 'إنشاء طلب', icon: 'plus-circle' },
                { id: 'myOrders', label: 'سجل مبيعاتي', icon: 'shopping-cart' },
                { id: 'collections', label: 'قسم التحصيلات', icon: 'dollar-sign' },
                { id: 'clientStatement', label: 'كشف حساب العملاء', icon: 'file-text' },
                { id: 'repStatement', label: 'سجل العمال والمندوبين', icon: 'user-check' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-3 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}
                >
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                </button>
              ))}
            </nav>

            <a href="index.html" className="hidden md:flex bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-2 rounded-xl text-xs items-center gap-1.5">
              <i data-lucide="log-out" className="w-4 h-4"></i> خروج
            </a>
          </header>

          {/* Main Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-3 md:px-4 py-4 md:py-8 space-y-6">

            {/* TAB 1: NEW ORDER FORM (فتح تلقائي وإنشاء الفواتير) */}
            {activeTab === 'newOrder' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div className="lg:col-span-7 space-y-6">
                  
                  {/* Step 1: Select Client & Driver */}
                  <div className="glass-card p-4 md:p-6 rounded-3xl space-y-4">
                    <h3 className="text-sm md:text-base font-bold text-gold flex items-center gap-2">
                      <i data-lucide="user-check" className="w-5 h-5"></i>
                      ١. تحديد العميل والسائق المكلف
                    </h3>
                    
                    <div className="space-y-2">

                                {item.type}
                              </span>
                            </td>
                            <td className="p-3 text-white">{item.description}</td>
                            <td className="p-3 font-bold text-red-400">{item.debit > 0 ? item.debit.toLocaleString() + ' ج.م' : '-'}</td>
                            <td className="p-3 font-bold text-green-400">{item.credit > 0 ? item.credit.toLocaleString() + ' ج.م' : '-'}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 5: REP STATEMENT */}
            {activeTab === 'repStatement' && (
              <div className="space-y-6">
                <div className="glass-card p-4 md:p-6 rounded-3xl space-y-4">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h3 className="text-base font-bold text-gold">سجل أداء ومبيعات المندوب والعمال</h3>
                    <button
                      onClick={() => setActiveModal('printRepSalesModal')}
                      className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow"
                    >
                      <i data-lucide="printer" className="w-4 h-4"></i> طباعة كشف السجل العام للمندوب
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-dark-950 p-4 rounded-2xl border border-dark-700 text-xs">
                    <div>
                      <span className="text-gray-400 block">إجمالي المبيعات بالجنيه:</span>
                      <p className="text-lg md:text-xl font-black text-gold mt-1">
                        {repOrders.reduce((sum, o) => sum + (parseFloat(o.totalAmount) || 0), 0).toLocaleString()} ج.م
                      </p>
                    </div>
                    <div>
                      <span className="text-gray-400 block">إجمالي الكمية (طن):</span>
                      <p className="text-lg md:text-xl font-black text-white mt-1">
                        {repOrders.reduce((sum, o) => sum + (parseFloat(o.quantity) || 0), 0).toFixed(2)} طن
                      </p>
                    </div>
                    <div>
                      <span className="text-gray-400 block">إجمالي المبالغ المحصلة:</span>
                      <p className="text-lg md:text-xl font-black text-green-400 mt-1">
                        {repCollections.reduce((sum, c) => sum + (parseFloat(c.amount) || 0), 0).toLocaleString()} ج.م
                      </p>
                    </div>
                  </div>
                </div>

                <div className="glass-card rounded-2xl p-4 overflow-x-auto border border-dark-700">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-3">التاريخ</th>
                        <th className="p-3">اسم العميل</th>
                        <th className="p-3">السائق</th>
                        <th className="p-3">الكمية (طن)</th>
                        <th className="p-3">المبلغ الإجمالي</th>
                        <th className="p-3">حالة الطلب بالمصنع</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {repOrders.map(o => (
                        <tr key={o.id} className="hover:bg-dark-800/50">
                          <td className="p-3 text-gray-300">{o.date}</td>
                          <td className="p-3 font-bold text-white">{o.clientName}</td>
                          <td className="p-3 text-gold">{o.driverName || 'سائق'}</td>
                          <td className="p-3 font-black text-white">{o.quantity} طن</td>
                          <td className="p-3 font-bold text-gold">{Number(o.totalAmount || 0).toLocaleString()} ج.م</td>
                          <td className="p-3 font-bold">{o.status || 'قيد الانتظار'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* 🖨️ MODAL 1: PRINT CLIENT STATEMENT */}
          {activeModal === 'printStatementModal' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold text-black">معاينة كشف حساب العميل للطباعة</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i> طباعة الكشف A4
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                    <p className="text-sm font-bold text-black">كشف حساب مبيعات وتوريدات عميل تفصيلي</p>
                    <div className="flex justify-between text-xs mt-3 text-black font-semibold">
                      <span>المندوب المسؤول: <strong>{currentRep.name}</strong></span>
                      <span>تاريخ الإصدار: <strong>{new Date().toLocaleDateString('ar-EG')}</strong></span>
                    </div>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">الحركة</th>
                        <th className="p-2 border border-black font-bold">التفاصيل والبيان</th>
                        <th className="p-2 border border-black font-bold">مدين (مبيعات)</th>
                        <th className="p-2 border border-black font-bold">دائن (تحصيل)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {clientLedgerCombined.map((o, idx) => (
                        <tr key={idx} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{o.date}</td>
                          <td className="p-2 border border-black font-bold">{o.type}</td>
                          <td className="p-2 border border-black font-medium">{o.description}</td>
                          <td className="p-2 border border-black font-bold">{o.debit > 0 ? o.debit.toLocaleString() : '-'}</td>
                          <td className="p-2 border border-black font-bold">{o.credit > 0 ? o.credit.toLocaleString() : '-'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>إجمالي المبيعات (مدين): {clientLedgerCombined.reduce((a, b) => a + b.debit, 0).toLocaleString()} ج.م</span>
                    <span>إجمالي التحصيلات (دائن): {clientLedgerCombined.reduce((a, b) => a + b.credit, 0).toLocaleString()} ج.م</span>
                    <span>الصافي المتبقي: {(clientLedgerCombined.reduce((a, b) => a + b.debit, 0) - clientLedgerCombined.reduce((a, b) => a + b.credit, 0)).toLocaleString()} ج.م</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* 🖨️ MODAL 2: PRINT REP SALES LOG */}
          {activeModal === 'printRepSalesModal' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold text-black">معاينة سجل مبيعات المندوب للطباعة</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i> طباعة السجل A4
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                    <p className="text-sm font-bold text-black">كشف سجل المبيعات والحمولات الشامل للمندوب</p>
                    <p className="text-xs font-bold text-gray-700 mt-1">اسم المندوب: {currentRep.name} ({currentRep.phone})</p>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">اسم العميل</th>
                        <th className="p-2 border border-black font-bold">السائق</th>
                        <th className="p-2 border border-black font-bold">الحمولة</th>
                        <th className="p-2 border border-black font-bold">الكمية (طن)</th>
                        <th className="p-2 border border-black font-bold">المبلغ</th>
                      </tr>
                    </thead>
                    <tbody>
                      {repOrders.map((o, idx) => (
                        <tr key={idx} className="border-b text-black">
                          <td className="p-2 border border-black">{o.date}</td>
                          <td className="p-2 border border-black font-bold">{o.clientName}</td>
                          <td className="p-2 border border-black">{o.driverName || 'سائق'}</td>
                          <td className="p-2 border border-black">{o.cargoType || 'علف'}</td>
                          <td className="p-2 border border-black font-bold">{o.quantity} طن</td>
                          <td className="p-2 border border-black font-bold">{Number(o.totalAmount || 0).toLocaleString()} ج.م</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>إجمالي الحمولات: {repOrders.reduce((sum, o) => sum + (parseFloat(o.quantity) || 0), 0).toFixed(2)} طن</span>
                    <span>إجمالي المبيعات بالجنيه: {repOrders.reduce((sum, o) => sum + (parseFloat(o.totalAmount) || 0), 0).toLocaleString()} ج.م</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* 🖨️ MODAL 3: PRINT COLLECTION RECEIPT */}
          {activeModal === 'printCollectionReceiptModal' && lastSavedCollection && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-lg space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-3 no-print">
                  <h3 className="text-base font-bold text-black">معاينة إيصال التوريد النقدي</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i> طباعة الإيصال
                  </button>
                </div>

                <div id="print-area" className="p-4 border-2 border-black rounded-2xl space-y-4">
                  <div className="flex justify-between items-center border-b-2 border-black pb-3">
                    <div>
                      <h1 className="text-lg font-black text-black">مصنع المجد للأعلاف</h1>
                      <p className="text-xs font-bold text-gray-800">إيصال توريد نقدية وتخصيم مديونية</p>
                      <p className="text-[10px] text-gray-600">التاريخ: {lastSavedCollection.date}</p>
                    </div>
                    <img src={LOGO_URL} alt="Logo" className="w-14 h-14 rounded-full border border-black object-contain" />
                  </div>

                  <div className="space-y-2 text-xs">
                    <div>وصلنا من السيد العميل: <strong className="text-sm font-black underline">{lastSavedCollection.clientName}</strong></div>
                    <div>مبلغ وقدره: <strong className="text-base font-black text-black underline">{Number(lastSavedCollection.amount).toLocaleString()} جنيه مصري فقط لا غير</strong></div>
                    <div>طريقة الدفع: <strong>{lastSavedCollection.method || 'نقدي'}</strong></div>
                    <div>ملاحظات: <strong>{lastSavedCollection.notes || 'سداد جزء من الحساب'}</strong></div>
                  </div>

                  <div className="bg-gray-100 p-3 rounded-xl border border-black text-xs space-y-1">
                    <div className="flex justify-between">
                      <span>المديونية المترتبة قبل التنزيل:</span>
                      <strong>{Number(lastSavedCollection.previousDebt || 0).toLocaleString()} ج.م</strong>
                    </div>
                    <div className="flex justify-between text-black font-black">
                      <span>المديونية المتبقية الحالية:</span>
                      <strong className="underline">{Number(lastSavedCollection.remainingDebt || 0).toLocaleString()} ج.م</strong>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-center text-xs pt-4 border-t border-gray-400 font-bold">
                    <div>توقيع المندوب المستلم: ..................</div>
                    <div>توقيع العميل: ..................</div>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RepApp />);
  </script>
</body>
</html>
