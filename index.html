<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تتبع السيارات والأسطول المباشر</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .nav-btn.active { background-color: #eab308; color: #000; font-weight: bold; }
        /* Custom Leaflet Marker Fix */
        .leaflet-div-icon { background: transparent; border: none; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- ⚠️ شريط الخطأ العام -->
    <div id="globalError" class="hidden fixed top-0 left-0 right-0 bg-red-600 text-white p-3 text-center z-50 font-bold shadow-lg"></div>

    <!-- ============================================= -->
    <!-- 🔐 شاشة تسجيل الدخول وإنشاء الحساب -->
    <!-- ============================================= -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
            <div class="text-center mb-6">
                <span class="text-4xl">📡</span>
                <h1 class="text-2xl font-extrabold text-yellow-500 mt-2">منصة تتبع المركبات</h1>
                <p class="text-xs text-gray-400 mt-1">نظام تتبع الأسطول المباشر للشركات والأفراد</p>
            </div>

            <!-- أزرار التنقل بين التسجيل والإنشاء -->
            <div class="flex border-b border-gray-700 mb-6">
                <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-bold text-yellow-500 border-b-2 border-yellow-500">تسجيل الدخول</button>
                <button id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 font-bold text-gray-400 hover:text-white">حساب شركة جديد</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div id="loginError" class="hidden bg-red-900/50 border border-red-500 text-red-300 text-xs p-2.5 rounded text-center"></div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">نوع الدخول</label>
                    <select id="loginType" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm">
                        <option value="firebase">بريد إلكتروني (Firebase)</option>
                        <option value="custom">اسم المستخدم (Custom DB)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني / اسم المستخدم</label>
                    <input type="text" id="loginEmail" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm" placeholder="البريد أو اسم المستخدم">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-extrabold py-3 rounded-lg transition text-sm">
                    دخول المنصة
                </button>
            </form>

            <!-- نموذج إنشاء شركة جديدة -->
            <form id="signupForm" onsubmit="handleSignup(event)" class="space-y-3 hidden">
                <div id="signupError" class="hidden bg-red-900/50 border border-red-500 text-red-300 text-xs p-2.5 rounded text-center"></div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">اسم المالك / المدير *</label>
                    <input type="text" id="signupFullName" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">اسم الشركة / النشاط *</label>
                    <input type="text" id="signupCompanyName" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">رقم الهاتف *</label>
                    <input type="tel" id="signupPhone" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">اسم المستخدم *</label>
                    <input type="text" id="signupUsername" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني *</label>
                    <input type="email" id="signupEmail" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">كلمة المرور *</label>
                    <input type="password" id="signupPassword" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">خطة الاشتراك</label>
                    <select id="signupSubscriptionPeriod" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-white text-sm">
                        <option value="month">تجربة 15 يوماً (ثم شهرياً)</option>
                        <option value="year">تجربة 15 يوماً (ثم سنوياً)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-sm mt-2">
                    إنشاء حساب للشركة (15 يوم مجاناً)
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-gray-700 text-center">
                <button onclick="createDemoAccount()" class="text-xs text-yellow-400 hover:underline">🎲 تجربة حساب تجريبي سريع</button>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- 💳 شاشة انتهاء الاشتراك -->
    <!-- ============================================= -->
    <div id="subscriptionExpiredScreen" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-red-500/50 text-center">
            <span class="text-5xl">⚠️</span>
            <h2 id="subscriptionStatus" class="text-2xl font-bold text-red-500 mt-2">انتهت الفترة التجريبية</h2>
            <p id="subscriptionCompanyName" class="text-lg font-semibold text-yellow-500 mt-1"></p>
            <p class="text-sm text-gray-300 mt-2">لتجديد الاشتراك وتفعيل خدمات التتبع والتطبيق، يرجى اختيار طريقة الدفع وتحويل رسوم الاشتراك:</p>

            <div id="paymentMethodsContainer" class="mt-4"></div>

            <button onclick="handleLogout()" class="mt-6 text-sm text-gray-400 hover:text-white underline block mx-auto">تسجيل الخروج</button>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- 🖥️ الشاشة الرئيسية / لوحة التحكم -->
    <!-- ============================================= -->
    <div id="dashboardScreen" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- القائمة الجانبية SideBar -->
        <aside class="w-full md:w-64 bg-gray-800 border-b md:border-b-0 md:border-l border-gray-700 p-4 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-6 px-2">
                    <span class="text-3xl">📡</span>
                    <div>
                        <h1 class="font-bold text-yellow-500 leading-tight">تتبع السيارات</h1>
                        <p id="userName" class="text-xs text-gray-400 mt-0.5">مرحباً</p>
                        <span id="userRole" class="text-[10px] bg-yellow-500/20 text-yellow-400 px-1.5 py-0.5 rounded mt-1 inline-block"></span>
                    </div>
                </div>

                <nav class="space-y-1">
                    <button onclick="showPage('dashboard')" data-page="dashboard" class="nav-btn active w-full text-right px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2">
                        <span>📊</span> لوحة التحكم
                    </button>
                    <button onclick="showPage('vehicles')" data-page="vehicles" class="nav-btn w-full text-right px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2">
                        <span>🚗</span> سائقين الشركة
                    </button>
                    <button onclick="showPage('map')" data-page="map" class="nav-btn w-full text-right px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2">
                        <span>🗺️</span> الخريطة المباشرة
                    </button>
                    <button onclick="showPage('tracking')" data-page="tracking" class="nav-btn w-full text-right px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center gap-2">
                        <span>📈</span> التقارير والسجل
                    </button>

                    <!-- خيارات الأدمن العام فقط -->
                    <div class="admin-only hidden pt-4 mt-4 border-t border-gray-700 space-y-1">
                        <span class="text-[10px] text-gray-500 font-bold px-3">إدارة المنصة (ADMIN)</span>
                        <button onclick="showPage('admin-companies')" data-page="admin-companies" class="nav-btn w-full text-right px-4 py-2 rounded-lg text-sm flex items-center gap-2 text-yellow-400">
                            <span>🏢</span> إدارة الشركات
                        </button>
                        <button onclick="showPage('admin-vehicles')" data-page="admin-vehicles" class="nav-btn w-full text-right px-4 py-2 rounded-lg text-sm flex items-center gap-2 text-yellow-400">
                            <span>👑</span> كل السيارات
                        </button>
                        <button onclick="showPage('admin-subscriptions')" data-page="admin-subscriptions" class="nav-btn w-full text-right px-4 py-2 rounded-lg text-sm flex items-center gap-2 text-yellow-400">
                            <span>💳</span> الاشتراكات
                        </button>
                    </div>
                </nav>
            </div>

            <button onclick="handleLogout()" class="mt-6 w-full bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 p-2.5 rounded-lg text-sm font-bold transition flex items-center justify-center gap-2">
                <span>🚪</span> تسجيل الخروج
            </button>
        </aside>

        <!-- المحتوى الرئيسي Main Page -->
        <main class="flex-1 p-4 md:p-6 overflow-y-auto">
            <div id="page-dashboard" class="page-content"></div>
            <div id="page-vehicles" class="page-content hidden"></div>
            <div id="page-map" class="page-content hidden"></div>
            <div id="page-tracking" class="page-content hidden"></div>
            <div id="page-admin-companies" class="page-content hidden"></div>
            <div id="page-admin-vehicles" class="page-content hidden"></div>
            <div id="page-admin-subscriptions" class="page-content hidden"></div>
        </main>
    </div>

    <!-- دالة التبديل بين التبويبات -->
    <script>
        function switchAuthTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('tabLoginBtn').className = 'flex-1 py-2 font-bold text-yellow-500 border-b-2 border-yellow-500';
                document.getElementById('tabSignupBtn').className = 'flex-1 py-2 font-bold text-gray-400 hover:text-white';
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('tabSignupBtn').className = 'flex-1 py-2 font-bold text-yellow-500 border-b-2 border-yellow-500';
                document.getElementById('tabLoginBtn').className = 'flex-1 py-2 font-bold text-gray-400 hover:text-white';
            }
        }
    </script>

    <!-- Firebase SDKs (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- ملف السكريبت الخاص بالنظام -->
    <script src="app.js"></script>
</body>
</html>
