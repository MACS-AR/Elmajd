<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>نظام تتبع المركبات</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-dark-bg text-gold-light">

<div id="app">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-dark-bg p-4">
        <div class="bg-dark-card rounded-2xl shadow-2xl w-full max-w-md p-8 border border-gold-border">
            <div class="text-center mb-8">
                <div class="text-6xl mb-3">🚗</div>
                <h1 class="text-3xl font-bold text-gold">نظام التتبع</h1>
                <p class="text-gold-light/70 text-sm mt-1">تسجيل الدخول إلى لوحة التحكم</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gold text-sm font-bold mb-2">البريد الإلكتروني</label>
                    <input id="loginEmail" type="email" class="w-full px-4 py-3 bg-dark-input border border-gold-border rounded-xl focus:outline-none focus:ring-2 focus:ring-gold text-gold-light placeholder-gray-500" placeholder="admin@system.com" required />
                </div>
                <div class="mb-6">
                    <label class="block text-gold text-sm font-bold mb-2">كلمة المرور</label>
                    <input id="loginPassword" type="password" class="w-full px-4 py-3 bg-dark-input border border-gold-border rounded-xl focus:outline-none focus:ring-2 focus:ring-gold text-gold-light placeholder-gray-500" placeholder="••••••••" required />
                </div>
                <div id="loginError" class="text-red-400 text-sm mb-4 hidden"></div>
                <button type="submit" class="w-full bg-gold text-dark-bg py-3 rounded-xl hover:bg-gold-hover transition font-bold text-lg">تسجيل الدخول</button>
            </form>
            <button onclick="quickLoginAdmin()" class="w-full bg-gold/20 text-gold py-3 rounded-xl hover:bg-gold/30 transition font-bold text-lg mt-3 border border-gold-border">
                ⚡ دخول سريع (أدمن)
            </button>
            <p class="text-xs text-gold-light/50 text-center mt-4">الحساب الافتراضي: admin@system.com / 123456</p>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardScreen" class="hidden min-h-screen bg-dark-bg">
        <!-- الشريط العلوي -->
        <nav class="bg-dark-card shadow-md px-4 md:px-8 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50 border-b border-gold-border/30">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🚗</span>
                <span class="font-bold text-xl text-gold">نظام التتبع</span>
            </div>
            <div class="flex items-center gap-3 flex-wrap">
                <span id="onlineStatus" class="text-xs px-2 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/30">🟢 متصل</span>
                <span id="userName" class="text-gold-light font-medium text-sm md:text-base">مرحباً، Admin</span>
                <span id="userRole" class="bg-gold/20 text-gold px-3 py-1 rounded-full text-xs font-bold border border-gold-border">مدير</span>
                <button onclick="handleLogout()" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-lg text-sm hover:bg-red-500/30 transition border border-red-500/30">خروج</button>
            </div>
        </nav>

        <!-- الشريط الجانبي + المحتوى -->
        <div class="flex flex-col md:flex-row">
            <!-- الشريط الجانبي (للشاشات الكبيرة) -->
            <aside class="w-full md:w-64 bg-dark-card shadow-md min-h-[calc(100vh-73px)] p-4 border-l border-gold-border/30 hidden md:block">
                <nav class="space-y-1">
                    <button onclick="showPage('dashboard')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="dashboard">
                        <span class="text-xl">📊</span> لوحة التحكم
                    </button>
                    <button onclick="showPage('vehicles')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="vehicles">
                        <span class="text-xl">🚗</span> سياراتي
                    </button>
                    <button onclick="showPage('map')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="map">
                        <span class="text-xl">🗺️</span> الخريطة المباشرة
                    </button>
                    <button onclick="showPage('tracking')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="tracking">
                        <span class="text-xl">📈</span> سجل الحركة
                    </button>
                    
                    <!-- قائمة الأدمن -->
                    <div id="adminMenu" class="hidden mt-4 pt-4 border-t border-gold-border/30">
                        <p class="text-xs text-gold-light/50 px-4 mb-2">🔒 إدارة النظام</p>
                        <button onclick="showPage('admin-companies')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="admin-companies">
                            <span class="text-xl">🏢</span> الشركات
                        </button>
                        <button onclick="showPage('admin-vehicles')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="admin-vehicles">
                            <span class="text-xl">🌍</span> جميع السيارات
                        </button>
                        <button onclick="showPage('admin-subscriptions')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="admin-subscriptions">
                            <span class="text-xl">📋</span> الاشتراكات
                        </button>
                    </div>
                </nav>
            </aside>

            <!-- الشريط الجانبي (للشاشات الصغيرة - أسفل الشاشة) -->
            <div class="fixed bottom-0 left-0 right-0 bg-dark-card border-t border-gold-border/30 flex md:hidden justify-around items-center py-2 px-2 z-50">
                <button onclick="showPage('dashboard')" class="nav-btn-mobile flex flex-col items-center text-gold-light/60 hover:text-gold transition p-1" data-page="dashboard">
                    <span class="text-xl">📊</span>
                    <span class="text-[10px]">الرئيسية</span>
                </button>
                <button onclick="showPage('vehicles')" class="nav-btn-mobile flex flex-col items-center text-gold-light/60 hover:text-gold transition p-1" data-page="vehicles">
                    <span class="text-xl">🚗</span>
                    <span class="text-[10px]">سياراتي</span>
                </button>
                <button onclick="showPage('map')" class="nav-btn-mobile flex flex-col items-center text-gold-light/60 hover:text-gold transition p-1" data-page="map">
                    <span class="text-xl">🗺️</span>
                    <span class="text-[10px]">الخريطة</span>
                </button>
                <button onclick="showPage('tracking')" class="nav-btn-mobile flex flex-col items-center text-gold-light/60 hover:text-gold transition p-1" data-page="tracking">
                    <span class="text-xl">📈</span>
                    <span class="text-[10px]">الحركة</span>
                </button>
                <button onclick="document.getElementById('mobileMenuDropdown').classList.toggle('hidden')" class="flex flex-col items-center text-gold-light/60 hover:text-gold transition p-1">
                    <span class="text-xl">⚙️</span>
                    <span class="text-[10px]">القائمة</span>
                </button>
            </div>

            <!-- القائمة المنسدلة للجوال -->
            <div id="mobileMenuDropdown" class="fixed bottom-16 left-2 right-2 bg-dark-card border border-gold-border/30 rounded-xl p-3 hidden md:hidden z-50 shadow-2xl">
                <button onclick="showPage('admin-companies')" class="nav-btn w-full text-right px-4 py-2 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="admin-companies">
                    <span class="text-xl">🏢</span> الشركات
                </button>
                <button onclick="showPage('admin-vehicles')" class="nav-btn w-full text-right px-4 py-2 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="admin-vehicles">
                    <span class="text-xl">🌍</span> جميع السيارات
                </button>
                <button onclick="showPage('admin-subscriptions')" class="nav-btn w-full text-right px-4 py-2 rounded-lg hover:bg-gold/10 text-gold-light font-medium flex items-center gap-3 transition" data-page="admin-subscriptions">
                    <span class="text-xl">📋</span> الاشتراكات
                </button>
            </div>

            <!-- المحتوى -->
            <main class="flex-1 p-4 md:p-6 pb-24 md:pb-6">
                <div id="page-dashboard" class="page-content">جاري التحميل...</div>
                <div id="page-vehicles" class="page-content hidden">جاري التحميل...</div>
                <div id="page-map" class="page-content hidden">جاري التحميل...</div>
                <div id="page-tracking" class="page-content hidden">جاري التحميل...</div>
                <div id="page-admin-companies" class="page-content hidden">جاري التحميل...</div>
                <div id="page-admin-vehicles" class="page-content hidden">جاري التحميل...</div>
                <div id="page-admin-subscriptions" class="page-content hidden">جاري التحميل...</div>
            </main>
        </div>
    </div>
</div>

<!-- المكتبات الخارجية -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
</body>
</html>
