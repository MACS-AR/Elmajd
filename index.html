<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تتبع السيارات والسائقين</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background-color: #1f2937 !important;
            color: #ffffff !important;
            border: 1px solid #374151;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col justify-between selection:bg-yellow-500 selection:text-black">

    <!-- ⚠️ شريط الخطأ العام -->
    <div id="globalError" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white px-6 py-3 rounded-xl shadow-2xl font-bold border border-red-400"></div>

    <!-- 🔐 شاشة تسجيل الدخول -->
    <div id="loginScreen" class="flex min-h-screen items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <span class="text-5xl inline-block mb-2">🚚</span>
                <h1 class="text-2xl font-extrabold text-yellow-500">منصة تتبع السيارات</h1>
                <p class="text-xs text-gray-400 mt-1">تسجيل الدخول إلى لوحة التحكم</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">نوع تسجيل الدخول</label>
                    <select id="loginType" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-yellow-500 transition">
                        <option value="firebase">حساب الشركة (Firebase Auth)</option>
                        <option value="custom">حساب مخصص (Custom DB)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">البريد الإلكتروني / اسم المستخدم</label>
                    <input type="text" id="loginEmail" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-yellow-500 transition" placeholder="admin@system.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="loginPassword" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-yellow-500 transition" placeholder="••••••••">
                </div>

                <div id="loginError" class="hidden text-xs text-red-500 font-bold text-center bg-red-950/50 p-2 rounded border border-red-800"></div>

                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-extrabold p-3 rounded-lg shadow-lg transition">
                    دخول المنصة 🚀
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-gray-800 text-center">
                <button onclick="createDemoAccount()" class="w-full bg-gray-800 hover:bg-gray-700 text-yellow-400 border border-yellow-500/30 text-xs font-bold p-2.5 rounded-lg transition">
                    ✨ تجربة المنصة (حساب تجريبي 15 يوم)
                </button>
            </div>
        </div>
    </div>

    <!-- 💳 شاشة انتهاء الاشتراك -->
    <div id="subscriptionExpiredScreen" class="hidden flex min-h-screen items-center justify-center p-4">
        <div class="bg-gray-900 border border-red-500/30 p-8 rounded-2xl shadow-2xl w-full max-w-lg text-center">
            <span class="text-5xl inline-block mb-3">⚠️</span>
            <h2 id="subscriptionCompanyName" class="text-2xl font-bold text-white mb-1">اسم الشركة</h2>
            <p id="subscriptionStatus" class="text-red-400 font-bold text-sm mb-6">انتهى اشتراك الحساب</p>

            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-right mb-6">
                <p class="text-xs text-gray-300 leading-relaxed">يرجى تجديد الاشتراك للاستمرار في استخدام خدمة التتبع الحي وإدارة أسطول السيارات.</p>
            </div>

            <div id="paymentMethodsContainer"></div>

            <button onclick="handleLogout()" class="mt-6 text-xs text-gray-400 hover:text-white underline">
                العودة لشاشة الدخول
            </button>
        </div>
    </div>

    <!-- 📊 لوحة التحكم الرئيسية -->
    <div id="dashboardScreen" class="hidden flex-1 flex flex-col">
        <!-- الشريط العلوي (يتم توليده ديناميكياً) -->
        <header id="topNavBar"></header>

        <!-- محتوى الصفحات الديناميكية -->
        <main class="flex-1 p-4 md:p-6 max-w-7xl w-full mx-auto">
            <div id="page-dashboard" class="page-content"></div>
            <div id="page-vehicles" class="page-content hidden"></div>
            <div id="page-map" class="page-content hidden"></div>
            <div id="page-tracking" class="page-content hidden"></div>
            <div id="page-admin-companies" class="page-content hidden"></div>
            <div id="page-admin-vehicles" class="page-content hidden"></div>
            <div id="page-admin-subscriptions" class="page-content hidden"></div>
        </main>
    </div>

    <!-- Firebase SDKs (v8 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- كود الجافاسكربت الخاص بك -->
    <script src="app.js"></script>
</body>
</html>
