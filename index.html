  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, remove, update, get, db: rtdb

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    // Error Boundary
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center space-y-4">
              <i data-lucide="alert-triangle" className="w-12 h-12 text-gold"></i>
              <h2 className="text-xl font-bold">تم تنشيط نظام استقرار اللوحة</h2>
              <button onClick={() => window.location.reload()} className="gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs">
                إعادة تشغيل اللوحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // إلغاء شاشة تسجيل الدخول: الدخول إداري مباشر ومطلق
      const [isAuthenticated, setIsAuthenticated] = useState(true);
      const [phoneInput, setPhoneInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [currentUserRole, setCurrentUserRole] = useState('admin');
      const [currentUserData, setCurrentUserData] = useState({ name: 'مدير النظام الرئيسي', phone: '01000000000', role: 'admin' });

      // Active View
      const [activeTab, setActiveTab] = useState('dashboard');
      const [orderStatusFilter, setOrderStatusFilter] = useState('قيد الانتظار');
      const [printFormatMode, setPrintFormatMode] = useState('a4'); // 'a4', 'a5', 'thermal'

      // Alert Dismiss
      const [dismissStockAlert, setDismissStockAlert] = useState(false);

      // Showroom Filters
      const [showroomMonthFilter, setShowroomMonthFilter] = useState(new Date().toISOString().slice(0, 7));
      const [showroomUnitFilter, setShowroomUnitFilter] = useState('all');

      // Database Collections
      const [salesReps, setSalesReps] = useState([]);
      const [orders, setOrders] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [clients, setClients] = useState([]);
      const [products, setProducts] = useState([]);
      const [trips, setTrips] = useState([]);
      const [collections, setCollections] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [logs, setLogs] = useState([]);

      // Showroom Collections
      const [showroomSales, setShowroomSales] = useState([]);
      const [showroomStock, setShowroomStock] = useState({});

      const prevOrdersCountRef = useRef(0);

      // UI States
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      // Modal Controls
      const [activeModal, setActiveModal] = useState(null); 
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);
      const [selectedShowroomInvoice, setSelectedShowroomInvoice] = useState(null);
      const [selectedDriver, setSelectedDriver] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      const [selectedSalesRep, setSelectedSalesRep] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [editingStockProduct, setEditingStockProduct] = useState(null);
      const [newStockBagsInput, setNewStockBagsInput] = useState('');

      // Form Data States
      const [salesRepData, setSalesRepData] = useState({ name: '', phone: '', password: '', role: 'rep', region: '', status: 'active' });
      const [driverData, setDriverData] = useState({ name: '', phone: '', password: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      const [clientData, setClientData] = useState({ name: '', address: '', phone: '', city: '', region: '', paymentType: 'cash', creditLimit: '0', debtBalance: '0', notes: '' });
      const [productData, setProductData] = useState({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      const [tripData, setTripData] = useState({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });
      
      // Collection & Expense Forms
      const [collectionData, setCollectionData] = useState({ clientId: '', amount: '', notes: '', repName: 'الإدارة' });
      const [expenseData, setExpenseData] = useState({ category: 'طعام وإعاشة', customCategory: '', amount: '', notes: '' });

      // Report Date Range Filters
      const [reportFilter, setReportFilter] = useState({
        driverId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // الصوت التنبيهي الذكي عند ورود طلب جديد
      const playNotificationSound = () => {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          const audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } catch (e) { console.error(e); }
      };

      // تصدير حقيقي إلى ملف Excel عبر SheetJS
      const exportToExcel = (dataList, fileName) => {
        if (!dataList || dataList.length === 0) {
          showToast('لا توجد بيانات متاحة للتصدير', 'error');
          return;
        }
        const worksheet = XLSX.utils.json_to_sheet(dataList);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "التقرير");
        XLSX.writeFile(workbook, `${fileName}_${new Date().toISOString().slice(0, 10)}.xlsx`);
        showToast('تم تصدير ملف Excel بنجاح');
      };

      // طباعة مخصصة بالحجم (A4 / A5 / الحراري)
      const handlePrintWithMode = (mode) => {
        setPrintFormatMode(mode);
        setTimeout(() => {
          window.print();
        }, 300);
      };

      // المزامنة الحية المباشرة مع Realtime Database
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'salesReps'), snapshot => {
              const data = snapshot.val();
              setSalesReps(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
            });

            onValue(ref(db, 'orders'), snapshot => {
              const data = snapshot.val();
              if (data && typeof data === 'object') {
                const fetchedOrders = Object.keys(data).map(k => ({
                  id: String(k),
                  ...(data[k] || {})
                })).reverse();

                if (prevOrdersCountRef.current > 0 && fetchedOrders.length > prevOrdersCountRef.current) {
                  playNotificationSound();
                  showToast('🔔 وصل طلب جديد من المندوب!', 'success');
                }
                setOrders(fetchedOrders);
                prevOrdersCountRef.current = fetchedOrders.length;
              } else {
                setOrders([]);
              }
            });

            onValue(ref(db, 'drivers'), snapshot => {
              const data = snapshot.val();
              setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
            });

            onValue(ref(db, 'clients'), snapshot => {
              const data = snapshot.val();
              setClients(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
            });

            onValue(ref(db, 'products'), snapshot => {
              const data = snapshot.val();
              setProducts(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
            });

            onValue(ref(db, 'trips'), snapshot => {
              const data = snapshot.val();
              setTrips(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
            });

            onValue(ref(db, 'collections'), snapshot => {
              const data = snapshot.val();
              setCollections(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
            });

            onValue(ref(db, 'expenses'), snapshot => {
              const data = snapshot.val();
              setExpenses(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
            });

            onValue(ref(db, 'logs'), snapshot => {
              const data = snapshot.val();
              setLogs(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
            });

            onValue(ref(db, 'showroomSales'), snapshot => {
              const data = snapshot.val();
              setShowroomSales(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
            });

            onValue(ref(db, 'showroomStock'), snapshot => {
              const data = snapshot.val();
              setShowroomStock(data || {});
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, orderStatusFilter, orders, products, drivers, showroomSales, collections, expenses]);

      const addLog = (action, description) => {
        if (!window.rtdbMethods) return;
        const { ref, push, db } = window.rtdbMethods;
        push(ref(db, 'logs'), { action, description, timestamp: new Date().toISOString() });
      };

      const openClientLocation = (address) => {
        if (!address) {
          showToast('العنوان غير مسجل بشكل دقيق', 'error');
          return;
        }
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`, '_blank');
      };

      // إضافة تحصيل وتنزيل المديونية تلقائياً
      const handleSaveCollection = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;
        const client = clients.find(c => c.id === collectionData.clientId);
        if (!client) {
          showToast('يرجى اختيار العميل أولاً', 'error');
          return;
        }

        const amt = parseFloat(collectionData.amount) || 0;
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const colRef = push(ref(db, 'collections'));
        set(colRef, {
          clientId: client.id,
          clientName: client.name,
          amount: amt,
          repName: collectionData.repName || 'الإدارة',
          notes: collectionData.notes || '',
          date: today,
          time: timeNow,
          createdAt: new Date().toISOString()
        }).then(() => {
          const newDebt = Math.max(0, (parseFloat(client.debtBalance) || 0) - amt);
          update(ref(db, `clients/${client.id}`), { debtBalance: newDebt });
          showToast(`تم إضافة تحصيل بقيمة ${amt} ج.م وتخصيمه من العميل ${client.name}`);
          addLog('ADD_COLLECTION', `تحصيل ${amt} ج.م من العميل ${client.name}`);
          setActiveModal(null);
          setCollectionData({ clientId: '', amount: '', notes: '', repName: 'الإدارة' });
        });
      };

      // إضافة مصروف جديد
      const handleSaveExpense = (e) => {
        e.preventDefault();
        const { ref, push, set, db } = window.rtdbMethods;
        const amt = parseFloat(expenseData.amount) || 0;
        const categoryName = expenseData.category === 'أخرى' ? expenseData.customCategory : expenseData.category;

        const expRef = push(ref(db, 'expenses'));
        set(expRef, {
          category: categoryName || 'مصروف عام',
          amount: amt,
          notes: expenseData.notes || '',
          date: new Date().toISOString().slice(0, 10),
          time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
          createdAt: new Date().toISOString()
        }).then(() => {
          showToast('تم تسجيل المصروف بنجاح');
          addLog('ADD_EXPENSE', `إضافة مصروف بند: ${categoryName} بقيمة ${amt} ج.م`);
          setActiveModal(null);
          setExpenseData({ category: 'طعام وإعاشة', customCategory: '', amount: '', notes: '' });
        });
      };

      // حفظ بيانات المنتج
      const handleSaveProduct = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;
        const tonPrice = parseFloat(productData.pricePerTon) || 0;
        const bagKg = parseFloat(productData.bagWeightKg) || 25;
        const bagPrice = ((tonPrice * bagKg) / 1000).toFixed(2);

        const payload = {
          name: productData.name,
          pricePerTon: tonPrice,
          bagWeightKg: bagKg,
          pricePerBag: parseFloat(bagPrice),
          notes: productData.notes || '',
          updatedAt: new Date().toISOString()
        };

        if (selectedProduct) {
          update(ref(db, `products/${selectedProduct.id}`), payload);
        } else {
          push(ref(db, 'products'), { ...payload, createdAt: new Date().toISOString() });
        }
        setActiveModal(null);
        setSelectedProduct(null);
        setProductData({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      };

      // حفظ بيانات الموظف
      const handleSaveSalesRep = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;
        if (selectedSalesRep) {
          update(ref(db, `salesReps/${selectedSalesRep.id}`), salesRepData);
        } else {
          push(ref(db, 'salesReps'), { ...salesRepData, createdAt: new Date().toISOString() });
        }
        setActiveModal(null);
        setSelectedSalesRep(null);
        setSalesRepData({ name: '', phone: '', password: '', role: 'rep', region: '', status: 'active' });
      };

      // حفظ بيانات السائق
      const handleSaveDriver = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;
        if (selectedDriver) {
          update(ref(db, `drivers/${selectedDriver.id}`), driverData);
        } else {
          push(ref(db, 'drivers'), { ...driverData, totalTripsCount: 0, createdAt: new Date().toISOString() });
        }
        setActiveModal(null);
        setSelectedDriver(null);
        setDriverData({ name: '', phone: '', password: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      };

      // حفظ بيانات العميل
      const handleSaveClient = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;
        const payload = {
          name: clientData.name,
          address: clientData.address,
          phone: clientData.phone,
          city: clientData.city || '',
          region: clientData.region || '',
          paymentType: clientData.paymentType || 'cash',
          creditLimit: parseFloat(clientData.creditLimit) || 0,
          debtBalance: parseFloat(clientData.debtBalance) || 0,
          notes: clientData.notes || ''
        };

        if (selectedClient) {
          update(ref(db, `clients/${selectedClient.id}`), payload);
        } else {
          push(ref(db, 'clients'), { ...payload, createdAt: new Date().toISOString() });
        }
        setActiveModal(null);
        setSelectedClient(null);
        setClientData({ name: '', address: '', phone: '', city: '', region: '', paymentType: 'cash', creditLimit: '0', debtBalance: '0', notes: '' });
      };

      // حفظ بيانات النقلة
      const handleSaveTrip = (e) => {
        e.preventDefault();
        if (!selectedDriver) return;
        const { ref, push, set, update, db } = window.rtdbMethods;
        const client = clients.find(c => c.id === tripData.clientId);
        const today = new Date().toISOString().slice(0, 10);

        const tripsToAdd = parseInt(tripData.tripsCount) || 1;
        const tripRef = push(ref(db, 'trips'));
        set(tripRef, {
          driverId: selectedDriver.id,
          driverName: selectedDriver.name,
          clientId: tripData.clientId,
          clientName: client ? client.name : 'غير محدد',
          clientAddress: client ? client.address : '',
          date: today,
          tripsCount: tripsToAdd,
          cargoType: tripData.cargoType,
          weightTons: parseFloat(tripData.weightTons) || 0,
          truckNumber: tripData.truckNumber || selectedDriver.truckNumber,
          notes: tripData.notes || '',
          createdAt: new Date().toISOString()
        }).then(() => {
          update(ref(db, `drivers/${selectedDriver.id}`), {
            totalTripsCount: (selectedDriver.totalTripsCount || 0) + tripsToAdd,
            lastTripDate: today
          });
          showToast('تم إضافة النقلة بنجاح');
        });
        setActiveModal(null);
        setTripData({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });
      };

      // تحديث حالة الطلب والموافقات
      const updateOrderStatus = (order, newStatus) => {
        if (!order || !order.id) return;
        const { ref, update, db } = window.rtdbMethods;
        update(ref(db, `orders/${order.id}`), { status: newStatus }).then(() => {
          showToast(`تم تغيير حالة الطلب إلى: ${newStatus}`);
          addLog('UPDATE_ORDER', `تعديل حالة طلب العميل ${order.clientName || ''} إلى ${newStatus}`);
        });
      };

      // تأكيد الحذف
      const confirmDelete = () => {
        if (!deleteTarget) return;
        const { ref, remove, db } = window.rtdbMethods;
        remove(ref(db, `${deleteTarget.path}/${deleteTarget.id}`)).then(() => {
          showToast('تم الحذف بنجاح');
          addLog('DELETE', `حذف عنصر من ${deleteTarget.path}`);
        });
        setActiveModal(null);
        setDeleteTarget(null);
      };

      const filteredOrders = useMemo(() => {
        if (!Array.isArray(orders)) return [];
        return orders.filter(o => {
          if (!o) return false;
          const matchSearch = (o.clientName || '').includes(searchQuery) || (o.repName || '').includes(searchQuery);
          if (orderStatusFilter === 'الكل') return matchSearch;
          return matchSearch && (o.status || 'قيد الانتظار') === orderStatusFilter;
        });
      }, [orders, searchQuery, orderStatusFilter]);

      const filteredReportTrips = useMemo(() => {
        if (!Array.isArray(trips)) return [];
        return trips.filter(t => {
          if (!t) return false;
          const matchDriver = reportFilter.driverId ? t.driverId === reportFilter.driverId : true;

                <div className="grid grid-cols-2 gap-3">
                  <input type="text" placeholder="رقم الهاتف" required value={clientData.phone} onChange={e => setClientData({ ...clientData, phone: e.target.value })} className="bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white" />
                  <input type="text" placeholder="العنوان بالتفصيل" required value={clientData.address} onChange={e => setClientData({ ...clientData, address: e.target.value })} className="bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <select value={clientData.paymentType} onChange={e => setClientData({ ...clientData, paymentType: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white">
                    <option value="cash">نقدي</option>
                    <option value="credit">آجل</option>
                  </select>
                  <input type="number" min="0" value={clientData.debtBalance} onChange={e => setClientData({ ...clientData, debtBalance: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white" placeholder="المديونية" />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button type="submit" className="px-5 py-2 rounded-xl gold-gradient text-dark-950 font-bold text-xs">حفظ العميل</button>
                </div>
              </form>
            </div>
          )}

          {/* MODAL: TRIP FORM */}
          {activeModal === 'tripForm' && selectedDriver && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <form onSubmit={handleSaveTrip} className="glass-card p-6 rounded-3xl w-full max-w-md space-y-4">
                <h3 className="text-lg font-bold text-gold">إضافة نقلة للسائق: {selectedDriver.name}</h3>
                <select required value={tripData.clientId} onChange={e => setTripData({ ...tripData, clientId: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                  <option value="">-- اختر العميل --</option>
                  {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
                <div className="grid grid-cols-2 gap-3">
                  <input type="number" min="1" required value={tripData.tripsCount} onChange={e => setTripData({ ...tripData, tripsCount: e.target.value })} className="bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white" placeholder="عدد النقلات" />
                  <input type="number" step="0.01" min="0.1" required value={tripData.weightTons} onChange={e => setTripData({ ...tripData, weightTons: e.target.value })} className="bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white" placeholder="الوزن بالطن" />
                </div>
                <input type="text" required value={tripData.cargoType} onChange={e => setTripData({ ...tripData, cargoType: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white" placeholder="نوع الحمولة" />
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button type="submit" className="px-5 py-2 rounded-xl gold-gradient text-dark-950 font-bold text-xs">تأكيد وحفظ</button>
                </div>
              </form>
            </div>
          )}

          {/* DELETE CONFIRM MODAL */}
          {activeModal === 'deleteConfirm' && deleteTarget && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-3xl w-full max-w-sm text-center space-y-4">
                <i data-lucide="alert-triangle" className="w-12 h-12 text-red-400 mx-auto"></i>
                <h3 className="font-bold text-base text-white">تأكيد عملية الحذف</h3>
                <p className="text-xs text-gray-400">هل أنت متأكد من حذف <strong>{deleteTarget.name}</strong>؟</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs">حذف الآن</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
