  <!-- Firebase Integration Script -->
  <script type="module">

    const firebaseConfig = {

      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    const DEFAULT_LOGO = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    // Error Boundary لحماية اللوحة من الشاشات البيضاء
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center space-y-4">
              <i data-lucide="alert-triangle" className="w-12 h-12 text-gold"></i>
              <h2 className="text-xl font-bold">حدث تحديث في البيانات</h2>
              <p className="text-xs text-gray-400">جاري إعادة تنظيم البيانات للحفاظ على استقرار اللوحة...</p>
              <button onClick={() => window.location.reload()} className="gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs shadow-lg">
                إعادة تنشيط اللوحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // Active View
      const [activeTab, setActiveTab] = useState('dashboard');
      const [orderStatusFilter, setOrderStatusFilter] = useState('قيد الانتظار');

      // Factory Settings State (تم إضافة customPages للتنقل الديناميكي)
      const [settings, setSettings] = useState({
        factoryName: 'مصنع المجد للأعلاف',
        logoUrl: DEFAULT_LOGO,
        phone: '01000000000',
        address: 'المنطقة الصناعية - مصنع المجد للأعلاف',
        commissionPerTon: 50,
        printPaperSize: 'A4',
        customPages: []
      });

      // New Custom Page Form Input
      const [newCustomPage, setNewCustomPage] = useState({ name: '', path: '' });

      // Dismiss Stock Alert State
      const [dismissStockAlert, setDismissStockAlert] = useState(false);

      // Showroom Filters
      const [showroomMonthFilter, setShowroomMonthFilter] = useState(new Date().toISOString().slice(0, 7)); // YYYY-MM
      const [showroomUnitFilter, setShowroomUnitFilter] = useState('all'); 

      // Database Collections
      const [salesReps, setSalesReps] = useState([]);
      const [orders, setOrders] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [clients, setClients] = useState([]);
      const [products, setProducts] = useState([]);
      const [trips, setTrips] = useState([]);
      const [logs, setLogs] = useState([]);

      // Showroom Collections
      const [showroomSales, setShowroomSales] = useState([]);
      const [showroomStock, setShowroomStock] = useState({});

      // Collections, Expenses, Production & Returns
      const [collections, setCollections] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [rawMaterials, setRawMaterials] = useState([]);
      const [productionOrders, setProductionOrders] = useState([]);
      const [returns, setReturns] = useState([]);

      const prevOrdersCountRef = useRef(0);

      // UI States
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);
      const [selectedPaperSize, setSelectedPaperSize] = useState('A4');

      // Modal Controls
      const [activeModal, setActiveModal] = useState(null); 
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);
      const [selectedShowroomInvoice, setSelectedShowroomInvoice] = useState(null);
      const [selectedDriver, setSelectedDriver] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      const [selectedSalesRep, setSelectedSalesRep] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [editingStockProduct, setEditingStockProduct] = useState(null);
      const [newStockBagsInput, setNewStockBagsInput] = useState('');

      // Form Data States
      const [collectionData, setCollectionData] = useState({ clientId: '', amount: '', collectorName: '', notes: '', date: new Date().toISOString().slice(0, 10) });
      const [expenseData, setExpenseData] = useState({ category: 'طعام وإعاشة عمال', amount: '', beneficiary: '', notes: '', date: new Date().toISOString().slice(0, 10) });
      const [rawMaterialData, setRawMaterialData] = useState({ name: 'ذرة صفراء', stockTons: '', pricePerTon: '' });
      const [productionOrderData, setProductionOrderData] = useState({ productId: '', tonsProduced: '', notes: '' });
      const [returnData, setReturnData] = useState({ clientId: '', productId: '', type: 'مرتجع مبيعات', quantityTons: '', refundAmount: '', reason: '', date: new Date().toISOString().slice(0, 10) });

      // Report Date Range Filters
      const [reportFilter, setReportFilter] = useState({
        driverId: '',
        clientId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      // Form Data States
      const [salesRepData, setSalesRepData] = useState({ name: '', phone: '', password: '', role: 'rep', region: '', commissionRate: '50', status: 'active' });
      const [driverData, setDriverData] = useState({ name: '', phone: '', password: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      const [clientData, setClientData] = useState({ name: '', address: '', phone: '', city: '', region: '', paymentType: 'cash', creditLimit: '0', debtBalance: '0', notes: '' });
      const [productData, setProductData] = useState({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      const [tripData, setTripData] = useState({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Notification Sound
      const playNotificationSound = () => {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          const audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') audioCtx.resume();

          const duration = 5;
          const startTime = audioCtx.currentTime;

          for (let i = 0; i < duration; i++) {
            const time = startTime + i;
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(587.33, time);
            gain1.gain.setValueAtTime(0.3, time);
            gain1.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(time);
            osc1.stop(time + 0.15);
          }
        } catch (e) {
          console.error("Audio Playback Error:", e);
        }
      };

      // Helper function for Excel Export
      const exportToExcel = (dataArray, fileName) => {
        if (!dataArray || dataArray.length === 0) {
          showToast('لا توجد بيانات متاحة للتصدير', 'error');
          return;
        }
        try {
          const worksheet = XLSX.utils.json_to_sheet(dataArray);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "البيانات");
          XLSX.writeFile(workbook, `${fileName}_${new Date().toISOString().slice(0, 10)}.xlsx`);
          showToast('تم تصدير ملف Excel بنجاح');
        } catch (err) {
          console.error("Excel Export Error:", err);
          showToast('حدث خطأ أثناء تصدير الملف', 'error');
        }
      };

      // Realtime Database Sync
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'settings'), snapshot => {
              try {
                const data = snapshot.val();
                if (data) setSettings(prev => ({ ...prev, ...data }));
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'salesReps'), snapshot => {
              try {
                const data = snapshot.val();
                setSalesReps(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'orders'), snapshot => {
              try {
                const data = snapshot.val();
                if (data && typeof data === 'object') {
                  const fetchedOrders = Object.keys(data).map(k => {
                    const raw = data[k] || {};
                    let safeQty = typeof raw.quantity === 'number' ? raw.quantity : (parseFloat(raw.quantity) || 0);
                    let safeAmount = typeof raw.totalAmount === 'number' ? raw.totalAmount : (parseFloat(raw.totalAmount) || 0);

                    let safeItems = [];
                    if (Array.isArray(raw.items)) {
                      safeItems = raw.items.map(it => ({
                        productName: it?.productName || 'علف',
                        quantity: parseFloat(it?.quantity) || 0,
                        unitLabel: it?.unitLabel || 'طن',
                        price: parseFloat(it?.price) || 0,
                        weightTons: parseFloat(it?.weightTons) || 0
                      }));
                    }

                    return {
                      id: String(k),
                      clientName: raw.clientName ? String(raw.clientName) : 'عميل غير محدد',
                      repName: raw.repName ? String(raw.repName) : 'مندوب',
                      repId: raw.repId ? String(raw.repId) : '',
                      driverName: raw.driverName ? String(raw.driverName) : 'غير محدد',
                      quantity: safeQty,
                      totalAmount: safeAmount,
                      status: raw.status ? String(raw.status) : 'قيد الانتظار',
                      paymentType: raw.paymentType || 'cash',
                      date: raw.date ? String(raw.date) : new Date().toISOString().slice(0, 10),
                      notes: raw.notes ? String(raw.notes) : '',
                      items: safeItems,
                      cargoType: raw.cargoType ? String(raw.cargoType) : 'علف',
                      driverTruck: raw.driverTruck ? String(raw.driverTruck) : '',
                      driverId: raw.driverId ? String(raw.driverId) : '',
                      clientId: raw.clientId ? String(raw.clientId) : ''
                    };
                  }).reverse();

                  if (prevOrdersCountRef.current > 0 && fetchedOrders.length > prevOrdersCountRef.current) {
                    playNotificationSound();
                    showToast('🔔 وصل طلب جديد من المندوب!', 'success');
                  }

                  setOrders(fetchedOrders);
                  prevOrdersCountRef.current = fetchedOrders.length;
                } else {
                  setOrders([]);
                }
              } catch (err) {
                console.error("Error processing orders sync:", err);
              }
            });

            onValue(ref(db, 'drivers'), snapshot => {
              try {
                const data = snapshot.val();
                setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'clients'), snapshot => {
              try {
                const data = snapshot.val();
                setClients(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'products'), snapshot => {
              try {
                const data = snapshot.val();
                setProducts(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'trips'), snapshot => {
              try {
                const data = snapshot.val();
                setTrips(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'logs'), snapshot => {
              try {
                const data = snapshot.val();
                setLogs(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'showroomSales'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomSales(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'showroomStock'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomStock(data || {});
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'collections'), snapshot => {
              try {
                const data = snapshot.val();
                setCollections(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'expenses'), snapshot => {
              try {
                const data = snapshot.val();
                setExpenses(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'rawMaterials'), snapshot => {
              try {
                const data = snapshot.val();
                setRawMaterials(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'productionOrders'), snapshot => {
              try {
                const data = snapshot.val();
                setProductionOrders(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'returns'), snapshot => {
              try {
                const data = snapshot.val();
                setReturns(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, orderStatusFilter, orders, products, drivers, showroomSales, collections, expenses, returns, settings]);

      const addLog = (action, description) => {
        if (!window.rtdbMethods) return;
        const { ref, push, db } = window.rtdbMethods;
        push(ref(db, 'logs'), { action, description, timestamp: new Date().toISOString() });
      };

      // Save Factory Settings
      const handleSaveSettings = (e) => {
        e.preventDefault();
        const { ref, set, db } = window.rtdbMethods;
        set(ref(db, 'settings'), settings).then(() => {
          showToast('تم حفظ إعدادات المصنع والتصميم بنجاح');
          addLog('UPDATE_SETTINGS', 'تحديث إعدادات المصنع الأساسية والتصميم');
        });
      };

      // Add Dynamic Custom Page Link
      const handleAddCustomPage = (e) => {
        e.preventDefault();
        if (!newCustomPage.name.trim() || !newCustomPage.path.trim()) {
          showToast('يرجى ملء اسم الصفحة ومسار الملف بشكل صحيح', 'error');
          return;
        }
        const updatedCustomPages = [...(settings.customPages || []), {
          id: Date.now().toString(),
          name: newCustomPage.name.trim(),
          path: newCustomPage.path.trim()
        }];
        const updatedSettings = { ...settings, customPages: updatedCustomPages };
        setSettings(updatedSettings);
        setNewCustomPage({ name: '', path: '' });

        if (window.rtdbMethods) {
          const { ref, set, db } = window.rtdbMethods;
          set(ref(db, 'settings'), updatedSettings).then(() => {
            showToast(`تم إضافة صفحة (${newCustomPage.name}) إلى القائمة الرئيسية بنجاح`);
            addLog('ADD_CUSTOM_PAGE', `إضافة زر صفحة جديدة: ${newCustomPage.name} -> ${newCustomPage.path}`);
          });
        }
      };

      // Delete Custom Page
      const handleDeleteCustomPage = (pageId) => {
        const updatedPages = (settings.customPages || []).filter(p => p.id !== pageId);
        const updatedSettings = { ...settings, customPages: updatedPages };
        setSettings(updatedSettings);

        if (window.rtdbMethods) {
          const { ref, set, db } = window.rtdbMethods;
          set(ref(db, 'settings'), updatedSettings).then(() => {
            showToast('تم حذف الصفحة من القائمة الرئيسية');
            addLog('DELETE_CUSTOM_PAGE', `حذف زر صفحة إضافية ID: ${pageId}`);
          });
        }
      };

      // Export JSON Backup
      const handleExportBackup = () => {
        const fullData = {
          settings,
          orders,
          clients,
          products,
          drivers,
          trips,
          collections,
          expenses,
          rawMaterials,
          productionOrders,
          showroomSales,
          showroomStock,
          returns,
          salesReps,
          exportDate: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Elmajd_Factory_Backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('تم تنزيل النسخة الاحتياطية للبيانات بنجاح');
      };

      // Import JSON Backup
      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            if (!importedData || typeof importedData !== 'object') {
              showToast('ملف النسخة الاحتياطية غير صالحة', 'error');
              return;
            }

            const { ref, set, db } = window.rtdbMethods;
            
            if (importedData.settings) set(ref(db, 'settings'), importedData.settings);
            if (importedData.orders) set(ref(db, 'orders'), importedData.orders);
            if (importedData.clients) set(ref(db, 'clients'), importedData.clients);
            if (importedData.products) set(ref(db, 'products'), importedData.products);
            if (importedData.drivers) set(ref(db, 'drivers'), importedData.drivers);
            if (importedData.trips) set(ref(db, 'trips'), importedData.trips);

        return orders.filter(o => {

          const cName = o.clientName ? String(o.clientName) : '';

          const dName = o.driverName ? String(o.driverName) : '';

          return matchDriver && matchFrom && matchTo;

        if (!selectedClient) return { transactions: [], totalOrders: 0, totalCollections: 0, totalReturns: 0, finalDebt: 0 };

        const cOrders = orders.filter(o => o.clientId === selectedClient.id && o.status === 'مقبول').map(o => ({
          id: o.id,
          date: o.date,
          type: 'فاتورة توريد (مسحوبات)',
          debit: parseFloat(o.totalAmount) || 0,
          credit: 0,
          notes: `طلب رقم #${String(o.id).slice(-5)} - ${o.cargoType || 'علف'}`
        }));

        const cCollections = collections.filter(c => c.clientId === selectedClient.id).map(c => ({
          id: c.id,
          date: c.date,
          type: 'سداد / تحصيل مالي',
          debit: 0,
          credit: parseFloat(c.amount) || 0,
          notes: c.notes || `إذن تحصيل (${c.collectorName || 'الإدارة'})`
        }));

        const cReturns = returns.filter(r => r.clientId === selectedClient.id).map(r => ({
          id: r.id,
          date: r.date,
          type: r.type || 'مرتجع مبيعات',
          debit: 0,
          credit: parseFloat(r.refundAmount) || 0,
          notes: `خصم مرتجع: ${r.productName || 'علف'} (${r.reason || ''})`
        }));

        const combined = [...cOrders, ...cCollections, ...cReturns].sort((a, b) => new Date(a.date) - new Date(b.date));

        let runningDebt = 0;
        let totOrders = 0;
        let totCollections = 0;
        let totReturns = 0;

        const transactions = combined.map(tx => {
          totOrders += tx.debit;
          totCollections += (tx.type === 'سداد / تحصيل مالي' ? tx.credit : 0);
          totReturns += (tx.type !== 'سداد / تحصيل مالي' ? tx.credit : 0);
          runningDebt += (tx.debit - tx.credit);
          return { ...tx, balanceAfter: runningDebt };
        });

        return {
          transactions,
          totalOrders: totOrders,
          totalCollections: totCollections,
          totalReturns: totReturns,
          finalDebt: parseFloat(selectedClient.debtBalance) || runningDebt
        };
      }, [selectedClient, orders, collections, returns]);

      // Showroom Sales Filtered
      const filteredShowroomSales = useMemo(() => {
        if (!Array.isArray(showroomSales)) return [];
        return showroomSales.filter(sale => {
          if (!sale) return false;
          const saleMonth = sale.date ? sale.date.slice(0, 7) : '';
          const matchMonth = showroomMonthFilter ? saleMonth === showroomMonthFilter : true;
          if (!matchMonth) return false;

          if (showroomUnitFilter === 'bag') {
            return sale.items && sale.items.some(it => it.unitLabel === 'شيكارة');
          } else if (showroomUnitFilter === 'ton') {
            return sale.items && sale.items.some(it => it.unitLabel === 'طن');

                    <span>طباعة التقرير</span>
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={settings.logoUrl || DEFAULT_LOGO} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">{settings.factoryName || 'مصنع المجد للأعلاف'}</h1>
                    <p className="text-sm font-bold text-black">كشف نقلات ومستحقات توصيل سائق تفصيلي</p>
                    <div className="flex justify-between text-xs mt-3 text-black font-semibold">
                      <span>السائق: <strong>{selectedDriver.name}</strong></span>
                      <span>السيارة: <strong>{selectedDriver.truckNumber}</strong></span>
                      <span>التاريخ: <strong>{new Date().toLocaleDateString('ar-EG')}</strong></span>
                    </div>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">العميل</th>
                        <th className="p-2 border border-black font-bold">النقلات</th>
                        <th className="p-2 border border-black font-bold">حساب التوصيل (25ج/نقلة)</th>
                        <th className="p-2 border border-black font-bold">الحمولة</th>
                        <th className="p-2 border border-black font-bold">الوزن (طن)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {trips.filter(t => t && t.driverId === selectedDriver.id && (reportFilter.fromDate ? t.date >= reportFilter.fromDate : true) && (reportFilter.toDate ? t.date <= reportFilter.toDate : true)).map(t => (
                        <tr key={t.id} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{t.date}</td>
                          <td className="p-2 border border-black font-medium">{t.clientName}</td>
                          <td className="p-2 border border-black font-bold">{t.tripsCount}</td>
                          <td className="p-2 border border-black font-bold text-green-700">{((parseInt(t.tripsCount) || 1) * 25).toLocaleString()} ج.م</td>
                          <td className="p-2 border border-black font-medium">{t.cargoType}</td>
                          <td className="p-2 border border-black font-medium">{t.weightTons}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black gap-2">
                    <span>إجمالي النقلات: {trips.filter(t => t && t.driverId === selectedDriver.id).reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</span>
                    <span>إجمالي أجر التوصيل: {trips.filter(t => t && t.driverId === selectedDriver.id).reduce((a, b) => a + ((parseFloat(b.tripsCount) || 0) * 25), 0).toLocaleString()} جنيه</span>
                    <span>إجمالي الوزن: {trips.filter(t => t && t.driverId === selectedDriver.id).reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)} طن</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: FULL REPORT */}
          {activeModal === 'fullReportModal' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold text-black">التقرير الشامل للطباعة</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i>
                    <span>طباعة التقرير</span>
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={settings.logoUrl || DEFAULT_LOGO} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">{settings.factoryName || 'مصنع المجد للأعلاف'}</h1>
                    <p className="text-sm font-bold text-black">تقرير حركة النقل والتوريدات الشامل</p>
                    <p className="text-xs text-black mt-1 font-semibold">الفترة من: {reportFilter.fromDate || 'البداية'} إلى: {reportFilter.toDate || 'اليوم'}</p>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">السائق</th>
                        <th className="p-2 border border-black font-bold">العميل</th>
                        <th className="p-2 border border-black font-bold">النقلات</th>
                        <th className="p-2 border border-black font-bold">التوصيل (25ج/نقلة)</th>
                        <th className="p-2 border border-black font-bold">الحمولة</th>
                        <th className="p-2 border border-black font-bold">الوزن (طن)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredReportTrips.map(t => (
                        <tr key={t.id} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{t.date}</td>
                          <td className="p-2 border border-black font-bold">{t.driverName}</td>
                          <td className="p-2 border border-black font-medium">{t.clientName}</td>
                          <td className="p-2 border border-black font-bold">{t.tripsCount}</td>
                          <td className="p-2 border border-black font-bold text-green-700">{((parseInt(t.tripsCount) || 1) * 25).toLocaleString()} ج.م</td>
                          <td className="p-2 border border-black font-medium">{t.cargoType}</td>
                          <td className="p-2 border border-black font-medium">{t.weightTons}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black gap-2">
                    <span>مجموع النقلات: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</span>
                    <span>إجمالي التوصيل: {filteredReportTrips.reduce((a, b) => a + ((parseFloat(b.tripsCount) || 0) * 25), 0).toLocaleString()} ج.م</span>
                    <span>إجمالي الوزن: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)} طن</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DELETE CONFIRM */}
          {activeModal === 'deleteConfirm' && deleteTarget && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-3xl w-full max-w-sm text-center space-y-4">
                <i data-lucide="alert-triangle" className="w-12 h-12 text-red-400 mx-auto"></i>
                <h3 className="font-bold text-base text-white">تأكيد عملية الحذف</h3>
                <p className="text-xs text-gray-400">هل أنت متأكد من حذف <strong>{deleteTarget.name}</strong>؟</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs">حذف الآن</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
