  <!-- Firebase Integration Script -->
  <script type="module">

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",

      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"

    const app = initializeApp(firebaseConfig);

    window.rtdbMethods = {

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, Component } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    // Error Boundary
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React Error Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center bg-dark-900 text-white min-h-screen flex flex-col items-center justify-center space-y-4">
              <i data-lucide="alert-triangle" className="w-12 h-12 text-gold"></i>
              <h2 className="text-xl font-bold">تم استلام طلب بتنسيق خاص</h2>
              <p className="text-xs text-gray-400">جاري إعادة تنظيم البيانات للحفاظ على استقرار اللوحة...</p>
              <button onClick={() => window.location.reload()} className="gold-gradient text-dark-950 font-bold px-6 py-2.5 rounded-xl text-xs">
                إعادة تنشيط اللوحة
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // Auth State المحدث للدخول برقم الهاتف والدور
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [phoneInput, setPhoneInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [currentUserRole, setCurrentUserRole] = useState('admin'); // admin, sales, rep, client
      const [currentUserData, setCurrentUserData] = useState(null);

      // Active View
      const [activeTab, setActiveTab] = useState('dashboard');
      const [orderStatusFilter, setOrderStatusFilter] = useState('قيد الانتظار');

      // Dismiss Stock Alert State
      const [dismissStockAlert, setDismissStockAlert] = useState(false);

      // Showroom Filters
      const [showroomMonthFilter, setShowroomMonthFilter] = useState(new Date().toISOString().slice(0, 7)); // YYYY-MM
      const [showroomUnitFilter, setShowroomUnitFilter] = useState('all'); // all, bag, ton

      // Database Collections
      const [salesReps, setSalesReps] = useState([]);
      const [orders, setOrders] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [clients, setClients] = useState([]);
      const [products, setProducts] = useState([]);
      const [trips, setTrips] = useState([]);
      const [logs, setLogs] = useState([]);

      // Showroom Collections
      const [showroomSales, setShowroomSales] = useState([]);
      const [showroomStock, setShowroomStock] = useState({});

      const prevOrdersCountRef = useRef(0);

      // UI States
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      // Modal Controls
      const [activeModal, setActiveModal] = useState(null); 
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);
      const [selectedShowroomInvoice, setSelectedShowroomInvoice] = useState(null);
      const [selectedDriver, setSelectedDriver] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      const [selectedSalesRep, setSelectedSalesRep] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [editingStockProduct, setEditingStockProduct] = useState(null);
      const [newStockBagsInput, setNewStockBagsInput] = useState('');

      // Report Date Range Filters
      const [reportFilter, setReportFilter] = useState({
        driverId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      // Form Data States
      const [salesRepData, setSalesRepData] = useState({ name: '', phone: '', password: '', role: 'rep', region: '', status: 'active' });
      const [driverData, setDriverData] = useState({ name: '', phone: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      const [clientData, setClientData] = useState({ name: '', address: '', phone: '', city: '', region: '', paymentType: 'cash', creditLimit: '0', debtBalance: '0', notes: '' });
      const [productData, setProductData] = useState({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      const [tripData, setTripData] = useState({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Notification Sound
      const playNotificationSound = () => {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          const audioCtx = new AudioContextClass();
          
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }

          const duration = 5;
          const startTime = audioCtx.currentTime;

          for (let i = 0; i < duration; i++) {
            const time = startTime + i;
            
            const osc1 = audioCtx.createOscillator();
            const gain1 = audioCtx.createGain();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(587.33, time);
            gain1.gain.setValueAtTime(0.3, time);
            gain1.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);
            osc1.connect(gain1);
            gain1.connect(audioCtx.destination);
            osc1.start(time);
            osc1.stop(time + 0.15);

            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(880, time + 0.15);
            gain2.gain.setValueAtTime(0.4, time + 0.15);
            gain2.gain.exponentialRampToValueAtTime(0.0001, time + 0.35);
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.start(time + 0.15);
            osc2.stop(time + 0.35);
          }
        } catch (e) {
          console.error("Audio Playback Error:", e);
        }
      };

      // Realtime Database Sync
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'salesReps'), snapshot => {
              try {
                const data = snapshot.val();
                setSalesReps(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'orders'), snapshot => {
              try {
                const data = snapshot.val();
                if (data && typeof data === 'object') {
                  const fetchedOrders = Object.keys(data).map(k => {
                    const raw = data[k] || {};
                    let safeQty = typeof raw.quantity === 'number' ? raw.quantity : (parseFloat(raw.quantity) || 0);
                    let safeAmount = typeof raw.totalAmount === 'number' ? raw.totalAmount : (parseFloat(raw.totalAmount) || 0);

                    let safeItems = [];
                    if (Array.isArray(raw.items)) {
                      safeItems = raw.items.map(it => ({
                        productName: it?.productName || 'علف',
                        quantity: parseFloat(it?.quantity) || 0,
                        unitLabel: it?.unitLabel || 'طن',
                        price: parseFloat(it?.price) || 0,
                        weightTons: parseFloat(it?.weightTons) || 0
                      }));
                    }

                    return {
                      id: String(k),
                      clientName: raw.clientName ? String(raw.clientName) : 'عميل غير محدد',
                      repName: raw.repName ? String(raw.repName) : 'مندوب',
                      driverName: raw.driverName ? String(raw.driverName) : 'غير محدد',
                      quantity: safeQty,
                      totalAmount: safeAmount,
                      status: raw.status ? String(raw.status) : 'قيد الانتظار',
                      paymentType: raw.paymentType || 'cash',
                      date: raw.date ? String(raw.date) : new Date().toISOString().slice(0, 10),
                      notes: raw.notes ? String(raw.notes) : '',
                      items: safeItems,
                      cargoType: raw.cargoType ? String(raw.cargoType) : 'علف',
                      driverTruck: raw.driverTruck ? String(raw.driverTruck) : '',
                      driverId: raw.driverId ? String(raw.driverId) : '',
                      clientId: raw.clientId ? String(raw.clientId) : ''
                    };
                  }).reverse();

                  if (prevOrdersCountRef.current > 0 && fetchedOrders.length > prevOrdersCountRef.current) {
                    playNotificationSound();
                    showToast('🔔 وصل طلب جديد من المندوب!', 'success');
                  }

                  setOrders(fetchedOrders);
                  prevOrdersCountRef.current = fetchedOrders.length;
                } else {
                  setOrders([]);
                }
              } catch (err) {
                console.error("Error processing orders sync:", err);
              }
            });

            onValue(ref(db, 'drivers'), snapshot => {
              try {
                const data = snapshot.val();
                setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'clients'), snapshot => {
              try {
                const data = snapshot.val();
                setClients(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'products'), snapshot => {
              try {
                const data = snapshot.val();
                setProducts(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })) : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'trips'), snapshot => {
              try {
                const data = snapshot.val();
                setTrips(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            onValue(ref(db, 'logs'), snapshot => {
              try {
                const data = snapshot.val();
                setLogs(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            // Sync Showroom Sales
            onValue(ref(db, 'showroomSales'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomSales(data ? Object.keys(data).map(k => ({ id: k, ...(data[k] || {}) })).reverse() : []);
              } catch (e) { console.error(e); }
            });

            // Sync Showroom Stock
            onValue(ref(db, 'showroomStock'), snapshot => {
              try {
                const data = snapshot.val();
                setShowroomStock(data || {});
              } catch (e) { console.error(e); }
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, orderStatusFilter, orders, products, drivers, showroomSales, showroomStock, isAuthenticated]);

      const addLog = (action, description) => {
        if (!window.rtdbMethods) return;
        const { ref, push, db } = window.rtdbMethods;
        push(ref(db, 'logs'), { action, description, timestamp: new Date().toISOString() });
      };

      // Phone-Based Login Handler
      const handleLogin = (e) => {
        e.preventDefault();
        const inputP = phoneInput.trim();
        const inputPass = passwordInput.trim();

        // 1. Admin Fallback Default
        if ((inputP === 'admin' || inputP === '01000000000' || inputP === 'admin@elmajd.com') && inputPass === 'admin') {
          setIsAuthenticated(true);
          setCurrentUserRole('admin');
          setCurrentUserData({ name: 'مدير النظام', phone: inputP, role: 'admin' });
          setActiveTab('dashboard');
          showToast('تم تسجيل الدخول بنجاح كـ إداري النظام');
          addLog('LOGIN', 'تسجيل دخول الأدمن الرئيسي');
          return;
        }

        // 2. Check Employee / Rep / Sales Database
        const matchedUser = salesReps.find(u => u.phone === inputP && u.password === inputPass);
        if (matchedUser) {
          setIsAuthenticated(true);
          const role = matchedUser.role || 'rep';
          setCurrentUserRole(role);
          setCurrentUserData(matchedUser);

          if (role === 'admin') setActiveTab('dashboard');
          else if (role === 'sales') setActiveTab('showroom');
          else if (role === 'rep') setActiveTab('dashboard');
          else setActiveTab('dashboard');

          showToast(`أهلاً بك ${matchedUser.name}`);
          addLog('LOGIN', `تسجيل دخول موظف: ${matchedUser.name} (${role})`);
          return;
        }

        // 3. Check Client Database
        const matchedClient = clients.find(c => c.phone === inputP);
        if (matchedClient) {
          setIsAuthenticated(true);
          setCurrentUserRole('client');
          setCurrentUserData(matchedClient);
          setActiveTab('dashboard');
          showToast(`أهلاً بك العميل: ${matchedClient.name}`);
          addLog('LOGIN', `تسجيل دخول عميل: ${matchedClient.name}`);
          return;
        }

        showToast('رقم الهاتف أو كلمة المرور غير صحيحة', 'error');
      };

      // Save Product
      const handleSaveProduct = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        const tonPrice = parseFloat(productData.pricePerTon) || 0;
        const bagKg = parseFloat(productData.bagWeightKg) || 25;
        const bagPrice = ((tonPrice * bagKg) / 1000).toFixed(2);

        const payload = {
          name: productData.name,
          pricePerTon: tonPrice,
          bagWeightKg: bagKg,
          pricePerBag: parseFloat(bagPrice),
          notes: productData.notes || '',
          updatedAt: new Date().toISOString()
        };

        if (selectedProduct) {
          update(ref(db, `products/${selectedProduct.id}`), payload)
            .then(() => {
              showToast('تم تعديل بيانات المنتج وحساب سعر الشيكارة');
              addLog('UPDATE_PRODUCT', `تعديل المنتج: ${productData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'products'));
          set(newRef, {
            ...payload,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تم إضافة المنتج بنجاح');
            addLog('ADD_PRODUCT', `إضافة منتج جديد: ${productData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedProduct(null);
        setProductData({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      };

      // Save Sales Rep / Employee
      const handleSaveSalesRep = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedSalesRep) {
          update(ref(db, `salesReps/${selectedSalesRep.id}`), salesRepData)
            .then(() => {
              showToast('تم تعديل بيانات الموظف بنجاح');
              addLog('UPDATE_SALES_REP', `تعديل موظف: ${salesRepData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'salesReps'));
          set(newRef, {
            ...salesRepData,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تمت إضافة الموظف بنجاح');
            addLog('ADD_SALES_REP', `إضافة موظف جديد: ${salesRepData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedSalesRep(null);
        setSalesRepData({ name: '', phone: '', password: '', role: 'rep', region: '', status: 'active' });
      };

      // Save Driver
      const handleSaveDriver = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedDriver) {
          update(ref(db, `drivers/${selectedDriver.id}`), driverData)
            .then(() => {
              showToast('تم تحديث بيانات السائق');
              addLog('UPDATE_DRIVER', `تعديل السائق ${driverData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'drivers'));
          set(newRef, {
            ...driverData,
            totalTripsCount: 0,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تمت إضافة السائق بنجاح');
            addLog('ADD_DRIVER', `إضافة سائق: ${driverData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedDriver(null);
        setDriverData({ name: '', phone: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      };

      // Save Client
      const handleSaveClient = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        const payload = {
          name: clientData.name,
          address: clientData.address,
          phone: clientData.phone,
          city: clientData.city || '',
          region: clientData.region || '',
          paymentType: clientData.paymentType || 'cash',
          creditLimit: parseFloat(clientData.creditLimit) || 0,
          debtBalance: parseFloat(clientData.debtBalance) || 0,
          notes: clientData.notes || ''
        };

        if (selectedClient) {
          update(ref(db, `clients/${selectedClient.id}`), payload)
            .then(() => {
              showToast('تم تعديل بيانات العميل بنجاح');
              addLog('UPDATE_CLIENT', `تعديل العميل ${clientData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'clients'));
          set(newRef, {
            ...payload,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تم إضافة العميل بنجاح');
            addLog('ADD_CLIENT', `إضافة عميل: ${clientData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedClient(null);
        setClientData({ name: '', address: '', phone: '', city: '', region: '', paymentType: 'cash', creditLimit: '0', debtBalance: '0', notes: '' });
      };

      // Save Trip
      const handleSaveTrip = (e) => {
        e.preventDefault();
        if (!selectedDriver) return;
        const { ref, push, set, update, db } = window.rtdbMethods;

        const client = clients.find(c => c && c.id === tripData.clientId);
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const parsedWeight = parseFloat(tripData.weightTons) || 0;
        const parsedTripsCount = parseInt(tripData.tripsCount) || 1;

        const newTripRef = push(ref(db, 'trips'));
        set(newTripRef, {
          driverId: selectedDriver.id,
          driverName: selectedDriver.name,
          clientId: tripData.clientId,
          clientName: client ? client.name : 'غير محدد',
          clientAddress: client ? client.address : '',
          date: today,
          time: timeNow,
          tripsCount: parsedTripsCount,
          cargoType: tripData.cargoType,
          weightTons: parsedWeight,
          truckNumber: tripData.truckNumber || selectedDriver.truckNumber,
          notes: tripData.notes || '',
          createdAt: new Date().toISOString()
        }).then(() => {
          const newTotalTrips = (selectedDriver.totalTripsCount || 0) + parsedTripsCount;
          update(ref(db, `drivers/${selectedDriver.id}`), {
            totalTripsCount: newTotalTrips,
            lastTripDate: today
          });
          showToast(`تمت إضافة ${parsedTripsCount} نقلة بنجاح`);
          addLog('ADD_TRIP', `إضافة نقلة للسائق ${selectedDriver.name}`);
        });

        setActiveModal(null);
        setTripData({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });
      };

      // Update Showroom Stock Quantity
      const handleUpdateShowroomStock = (e) => {
        e.preventDefault();
        if (!editingStockProduct || !window.rtdbMethods) return;
        const { ref, update, db } = window.rtdbMethods;
        const bags = parseInt(newStockBagsInput) || 0;

        update(ref(db, `showroomStock/${editingStockProduct.id}`), {
          bagsCount: bags,
          productName: editingStockProduct.name,
          updatedAt: new Date().toISOString()
        }).then(() => {
          showToast(`تم تعديل رصيد مخزن المعرض للمنتج: ${editingStockProduct.name}`);
          addLog('UPDATE_SHOWROOM_STOCK', `تعديل مخزون المعرض للمنتج ${editingStockProduct.name} إلى ${bags} شكاير`);
          setActiveModal(null);
          setEditingStockProduct(null);
          setNewStockBagsInput('');
        });
      };

      // Delete Handler
      const confirmDelete = () => {
        if (!deleteTarget) return;
        const { ref, remove, update, db } = window.rtdbMethods;

        if (deleteTarget.path === 'trips' && deleteTarget.trip) {
          const driver = drivers.find(d => d && d.id === deleteTarget.trip.driverId);
          if (driver) {
            const updatedTotal = Math.max(0, (driver.totalTripsCount || 0) - (parseInt(deleteTarget.trip.tripsCount) || 1));
            update(ref(db, `drivers/${driver.id}`), { totalTripsCount: updatedTotal });
          }
        }

        remove(ref(db, `${deleteTarget.path}/${deleteTarget.id}`))
          .then(() => {
            showToast('تم الحذف بنجاح');
            addLog('DELETE', `حذف عنصر من ${deleteTarget.path}`);
          });
        setActiveModal(null);
        setDeleteTarget(null);
      };

      // updateOrderStatus مع احتساب المديونية للعميل الآجل
      const updateOrderStatus = (order, newStatus) => {
        if (!order || !order.id) return;
        const { ref, update, push, set, db } = window.rtdbMethods;

        update(ref(db, `orders/${order.id}`), { status: newStatus })
          .then(() => {
            showToast(`تم تغيير حالة الطلب إلى: ${newStatus}`);
            addLog('UPDATE_ORDER', `تعديل حالة طلب العميل ${order.clientName || ''} إلى ${newStatus}`);

            if (newStatus === 'مقبول') {
              // احتساب المديونية إذا كان العميل آجل
              if (order.clientId) {
                const targetClient = clients.find(c => c.id === order.clientId);
                if (targetClient && targetClient.paymentType === 'credit') {
                  const newDebt = (parseFloat(targetClient.debtBalance) || 0) + (parseFloat(order.totalAmount) || 0);
                  update(ref(db, `clients/${targetClient.id}`), { debtBalance: newDebt });
                  showToast(`تم تحديث مديونية العميل الآجل ${targetClient.name}`);
                }
              }

              if (order.driverId) {
                const driver = drivers.find(d => d && d.id === order.driverId);
                const today = order.date || new Date().toISOString().slice(0, 10);
                const tripsToAdd = parseInt(order.tripsCount) || 1;

                const newTripRef = push(ref(db, 'trips'));
                set(newTripRef, {
                  orderId: order.id,
                  driverId: order.driverId,
                  driverName: order.driverName || (driver ? driver.name : 'سائق'),
                  clientId: order.clientId || '',
                  clientName: order.clientName || 'عميل',
                  clientAddress: order.clientAddress || '',
                  date: today,
                  time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                  tripsCount: tripsToAdd,
                  cargoType: order.cargoType || 'علف',
                  weightTons: parseFloat(order.quantity) || 0,
                  truckNumber: order.driverTruck || (driver ? driver.truckNumber : ''),
                  notes: `من طلب المندوب: ${order.repName || ''}`,
                  createdAt: new Date().toISOString()
                });

                if (driver) {
                  const updatedTrips = (driver.totalTripsCount || 0) + tripsToAdd;
                  update(ref(db, `drivers/${driver.id}`), {
                    totalTripsCount: updatedTrips,
                    lastTripDate: today
                  });
                }
              }

              setSelectedOrderDetails(order);
              setActiveModal('orderDetailsModal');
              setTimeout(() => {
                window.print();
              }, 500);
            } else if (activeModal === 'orderDetailsModal') {
              setActiveModal(null);
            }
          });
      };

      // Filtered Orders
      const filteredOrders = useMemo(() => {
        if (!Array.isArray(orders)) return [];
        return orders.filter(o => {
          if (!o) return false;
          const cName = o.clientName ? String(o.clientName) : '';
          const rName = o.repName ? String(o.repName) : '';
          const dName = o.driverName ? String(o.driverName) : '';
          
          const matchSearch = cName.includes(searchQuery) || rName.includes(searchQuery) || dName.includes(searchQuery);
          
          if (orderStatusFilter === 'الكل') return matchSearch;
          return matchSearch && (o.status || 'قيد الانتظار') === orderStatusFilter;
        });
      }, [orders, searchQuery, orderStatusFilter]);

      const pendingOrdersCount = useMemo(() => Array.isArray(orders) ? orders.filter(o => o && (o.status || 'قيد الانتظار') === 'قيد الانتظار').length : 0, [orders]);
      const approvedOrdersCount = useMemo(() => Array.isArray(orders) ? orders.filter(o => o && o.status === 'مقبول').length : 0, [orders]);
      const rejectedOrdersCount = useMemo(() => Array.isArray(orders) ? orders.filter(o => o && o.status === 'ملغي').length : 0, [orders]);

      // Filtered Trips for Reports
      const filteredReportTrips = useMemo(() => {
        if (!Array.isArray(trips)) return [];
        return trips.filter(t => {
          if (!t) return false;
          const matchDriver = reportFilter.driverId ? t.driverId === reportFilter.driverId : true;
          const matchFrom = reportFilter.fromDate ? (t.date && t.date >= reportFilter.fromDate) : true;
          const matchTo = reportFilter.toDate ? (t.date && t.date <= reportFilter.toDate) : true;
          return matchDriver && matchFrom && matchTo;
        });
      }, [trips, reportFilter]);

      // Showroom Sales Filtered by Month & Unit
      const filteredShowroomSales = useMemo(() => {
        if (!Array.isArray(showroomSales)) return [];
        return showroomSales.filter(sale => {
          if (!sale) return false;
          const saleMonth = sale.date ? sale.date.slice(0, 7) : '';
          const matchMonth = showroomMonthFilter ? saleMonth === showroomMonthFilter : true;
          
          if (!matchMonth) return false;

          if (showroomUnitFilter === 'bag') {
            return sale.items && sale.items.some(it => it.unitLabel === 'شيكارة');
          } else if (showroomUnitFilter === 'ton') {
            return sale.items && sale.items.some(it => it.unitLabel === 'طن');
          }
          return true;
        });
      }, [showroomSales, showroomMonthFilter, showroomUnitFilter]);

      const lowStockShowroomItems = useMemo(() => {
        if (!Array.isArray(products)) return [];
        return products.filter(p => {

                </div>

                  <label className="text-xs text-gray-300 block mb-1">كلمة المرور</label>

                </div>
                <button type="submit" className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl hover:brightness-110 transition-all text-sm shadow-lg">

                </button>
              </div>
            </form>

                <div className="flex items-center gap-3">
                  <i data-lucide="alert-triangle" className="w-6 h-6 text-red-400"></i>
                  <div>
                    <h4 className="font-bold text-sm text-red-200">تنبيه حرج: نقص في مخزون المعرض!</h4>
                    <p className="text-xs text-red-300">يوجد عدد ({lowStockShowroomItems.length}) منتجات وُصل رصيد الشكاير فيها إلى 5 أو أقل.</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => setActiveTab('showroom')} className="bg-red-600 hover:bg-red-700 text-white font-bold px-3.5 py-2 rounded-xl text-xs">
                    معاينة المعرض

                  <button onClick={() => setDismissStockAlert(true)} className="bg-dark-800 hover:bg-dark-700 text-gray-300 px-3 py-2 rounded-xl text-xs border border-red-500/30 font-bold" title="إخفاء التنبيه">

                    <p className="text-3xl font-black text-green-400">{approvedOrdersCount}</p>

                    <p className="text-3xl font-black gold-text">{Array.isArray(trips) ? trips.reduce((a, b) => a + (parseFloat(b?.tripsCount) || 0), 0) : 0}</p>
                  </div>
                  <div className="glass-card p-5 rounded-2xl">
                    <span className="text-gray-400 text-xs block mb-1">إجمالي كميات الأعلاف (طن)</span>
                    <p className="text-3xl font-black text-white">{Array.isArray(orders) ? orders.reduce((a, b) => a + (parseFloat(b?.quantity) || 0), 0).toFixed(2) : '0.00'}</p>

                        { id: 'مقبول', label: `مقبولة (${approvedOrdersCount})`, color: 'text-green-400' },

                      ].map(filter => (
                        <button

                        >

                    <div className="flex items-center gap-3 w-full md:w-auto">

                      <input

                        >
                          <div className="flex justify-between items-start">

                            </button>

                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">العميل</th>
                        <th className="p-2 border border-black font-bold">النقلات</th>
                        <th className="p-2 border border-black font-bold">حساب التوصيل (25ج/نقلة)</th>
                        <th className="p-2 border border-black font-bold">الحمولة</th>
                        <th className="p-2 border border-black font-bold">الوزن (طن)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {trips.filter(t => t && t.driverId === selectedDriver.id && (reportFilter.fromDate ? t.date >= reportFilter.fromDate : true) && (reportFilter.toDate ? t.date <= reportFilter.toDate : true)).map(t => (
                        <tr key={t.id} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{t.date}</td>
                          <td className="p-2 border border-black font-medium">{t.clientName}</td>
                          <td className="p-2 border border-black font-bold">{t.tripsCount}</td>
                          <td className="p-2 border border-black font-bold text-green-700">{((parseInt(t.tripsCount) || 1) * 25).toLocaleString()} ج.م</td>
                          <td className="p-2 border border-black font-medium">{t.cargoType}</td>
                          <td className="p-2 border border-black font-medium">{t.weightTons}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>إجمالي النقلات: {trips.filter(t => t && t.driverId === selectedDriver.id).reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</span>
                    <span>إجمالي أجر التوصيل: {trips.filter(t => t && t.driverId === selectedDriver.id).reduce((a, b) => a + ((parseFloat(b.tripsCount) || 0) * 25), 0).toLocaleString()} جنيه</span>
                    <span>إجمالي الوزن: {trips.filter(t => t && t.driverId === selectedDriver.id).reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)} طن</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: FULL REPORT */}
          {activeModal === 'fullReportModal' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold text-black">التقرير الشامل للطباعة</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i> طباعة التقرير
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                    <p className="text-sm font-bold text-black">تقرير حركة النقل والتوريدات الشامل</p>
                    <p className="text-xs text-black mt-1 font-semibold">الفترة من: {reportFilter.fromDate || 'البداية'} إلى: {reportFilter.toDate || 'اليوم'}</p>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">السائق</th>
                        <th className="p-2 border border-black font-bold">العميل</th>
                        <th className="p-2 border border-black font-bold">النقلات</th>
                        <th className="p-2 border border-black font-bold">التوصيل (25ج/نقلة)</th>
                        <th className="p-2 border border-black font-bold">الحمولة</th>
                        <th className="p-2 border border-black font-bold">الوزن (طن)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredReportTrips.map(t => (
                        <tr key={t.id} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{t.date}</td>
                          <td className="p-2 border border-black font-bold">{t.driverName}</td>
                          <td className="p-2 border border-black font-medium">{t.clientName}</td>
                          <td className="p-2 border border-black font-bold">{t.tripsCount}</td>
                          <td className="p-2 border border-black font-bold text-green-700">{((parseInt(t.tripsCount) || 1) * 25).toLocaleString()} ج.م</td>
                          <td className="p-2 border border-black font-medium">{t.cargoType}</td>
                          <td className="p-2 border border-black font-medium">{t.weightTons}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>مجموع النقلات: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</span>
                    <span>إجمالي التوصيل: {filteredReportTrips.reduce((a, b) => a + ((parseFloat(b.tripsCount) || 0) * 25), 0).toLocaleString()} ج.م</span>
                    <span>إجمالي الوزن: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)} طن</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DELETE CONFIRM */}
          {activeModal === 'deleteConfirm' && deleteTarget && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-3xl w-full max-w-sm text-center space-y-4">
                <i data-lucide="alert-triangle" className="w-12 h-12 text-red-400 mx-auto"></i>
                <h3 className="font-bold text-base text-white">تأكيد عملية الحذف</h3>
                <p className="text-xs text-gray-400">هل أنت متأكد من حذف <strong>{deleteTarget.name}</strong>؟</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs">حذف الآن</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
