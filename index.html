<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تتبع المركبات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
        .leaflet-container { z-index: 0; }
        .map-popup { font-family: 'Cairo', sans-serif; }
        .custom-leaflet-marker { background: transparent; border: none; }
        .page-content { display: block; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <!-- ==================== شاشة تسجيل الدخول / إنشاء حساب ==================== -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-md w-full border border-gray-700">
            <div class="text-center mb-8">
                <div class="text-5xl mb-3">🚗</div>
                <h1 class="text-3xl font-bold text-yellow-500">منصة التتبع</h1>
                <p class="text-gray-400 mt-2">نظام تتبع المركبات وإدارة الأساطيل</p>
            </div>

            <!-- التبويبات -->
            <div class="flex mb-6 bg-gray-700 rounded-lg p-1">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2 px-4 rounded-lg font-bold bg-yellow-500 text-black transition">تسجيل الدخول</button>
                <button id="tabSignup" onclick="switchAuthTab('signup')" class="flex-1 py-2 px-4 rounded-lg font-bold text-gray-300 hover:text-white transition">إنشاء حساب</button>
            </div>

            <!-- نموذج تسجيل الدخول -->
            <div id="loginForm">
                <div class="mb-4">
                    <label class="block text-sm mb-1 text-gray-400">نوع الدخول</label>
                    <select id="loginType" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white">
                        <option value="firebase">بريد إلكتروني وكلمة مرور</option>
                        <option value="custom">اسم مستخدم وكلمة مرور</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm mb-1 text-gray-400">البريد الإلكتروني / اسم المستخدم</label>
                    <input type="text" id="loginEmail" placeholder="أدخل البريد أو اسم المستخدم" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white placeholder-gray-500">
                </div>
                <div class="mb-6">
                    <label class="block text-sm mb-1 text-gray-400">كلمة المرور</label>
                    <input type="password" id="loginPassword" placeholder="********" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white placeholder-gray-500">
                </div>
                <div id="loginError" class="hidden bg-red-900/50 text-red-300 p-3 rounded-lg mb-4 text-sm"></div>
                <button onclick="handleLogin(event)" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 rounded-lg transition">دخول</button>
                <button onclick="quickLoginAdmin()" class="w-full mt-3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg text-sm transition">دخول سريع كأدمن</button>
            </div>

            <!-- نموذج إنشاء حساب -->
            <div id="signupForm" class="hidden">
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">اسم العميل *</label>
                        <input type="text" id="signupFullName" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">اسم الشركة *</label>
                        <input type="text" id="signupCompanyName" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">رقم الهاتف *</label>
                        <input type="tel" id="signupPhone" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">اليوزر نيم (يمكن أن يكون بريد أو اسم مستخدم) *</label>
                        <input type="text" id="signupUsername" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">البريد الإلكتروني *</label>
                        <input type="email" id="signupEmail" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">كلمة المرور *</label>
                        <input type="password" id="signupPassword" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white">
                    </div>
                    <div>
                        <label class="block text-sm mb-1 text-gray-400">مدة الاشتراك</label>
                        <select id="signupSubscriptionPeriod" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2 text-white">
                            <option value="month">شهر</option>
                            <option value="year">سنة</option>
                        </select>
                    </div>
                    <div id="signupError" class="hidden bg-red-900/50 text-red-300 p-3 rounded-lg text-sm"></div>
                    <button onclick="handleSignup(event)" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">إنشاء الحساب</button>
                    <p class="text-xs text-gray-500 text-center">سيتم منحك فترة تجريبية مجانية لمدة 15 يوم</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== شاشة انتهاء الاشتراك ==================== -->
    <div id="subscriptionExpiredScreen" class="hidden min-h-screen bg-gray-900 flex items-center justify-center p-4">
        <div class="bg-gray-800 rounded-xl shadow-lg p-8 max-w-md w-full border border-gray-700">
            <div class="text-center mb-6">
                <div class="text-6xl mb-4">⏰</div>
                <h2 class="text-2xl font-bold text-yellow-500 mb-2">انتهاء الاشتراك</h2>
                <p class="text-gray-400">عذراً، انتهت فترة الاشتراك الخاصة بكم</p>
            </div>
            
            <div class="bg-gray-900 rounded-lg p-4 mb-6">
                <h3 class="font-bold text-yellow-500 mb-2">بيانات الاشتراك:</h3>
                <p class="text-gray-300">الشركة: <span id="subscriptionCompanyName"></span></p>
                <p class="text-gray-300">الحالة: <span id="subscriptionStatus" class="text-red-500"></span></p>
            </div>
            
            <div class="mb-6">
                <h3 class="font-bold text-yellow-500 mb-3">اختر طريقة الدفع للتجديد:</h3>
                <div id="paymentMethodsContainer"></div>
            </div>
            
            <button onclick="handleLogout()" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg">
                تسجيل الخروج
            </button>
        </div>
    </div>

    <!-- ==================== شاشة لوحة التحكم ==================== -->
    <div id="dashboardScreen" class="hidden min-h-screen bg-gray-900">
        <!-- الشريط العلوي -->
        <nav class="bg-gray-800 shadow-md border-b border-gray-700 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🚗</span>
                    <div>
                        <h1 class="font-bold text-yellow-500">منصة التتبع</h1>
                        <p class="text-xs text-gray-400" id="userName">مرحباً</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <span id="userRole" class="text-xs bg-gray-700 px-3 py-1 rounded-full"></span>
                    <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition">تسجيل الخروج</button>
                </div>
            </div>
            <!-- أزرار التنقل -->
            <div class="bg-gray-800 border-t border-gray-700 overflow-x-auto">
                <div class="max-w-7xl mx-auto flex gap-1 px-2 py-2">
                    <button class="nav-btn active bg-gray-700 text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="dashboard" onclick="showPage('dashboard')">📊 لوحة التحكم</button>
                    <button class="nav-btn text-gray-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="vehicles" onclick="showPage('vehicles')">🚗 سياراتي</button>
                    <button class="nav-btn text-gray-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="map" onclick="showPage('map')">🗺️ الخريطة</button>
                    <button class="nav-btn text-gray-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="tracking" onclick="showPage('tracking')">📈 التقارير</button>
                    <div class="admin-only hidden">
                        <button class="nav-btn text-gray-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="admin-companies" onclick="showPage('admin-companies')">🏢 الشركات</button>
                        <button class="nav-btn text-gray-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="admin-vehicles" onclick="showPage('admin-vehicles')">👑 المركبات</button>
                        <button class="nav-btn text-gray-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg text-sm whitespace-nowrap" data-page="admin-subscriptions" onclick="showPage('admin-subscriptions')">💳 الاشتراكات</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- محتوى الصفحات -->
        <main class="max-w-7xl mx-auto p-6">
            <div id="page-dashboard" class="page-content"></div>
            <div id="page-vehicles" class="page-content hidden"></div>
            <div id="page-map" class="page-content hidden"></div>
            <div id="page-tracking" class="page-content hidden"></div>
            <div id="page-admin-companies" class="page-content hidden"></div>
            <div id="page-admin-vehicles" class="page-content hidden"></div>
            <div id="page-admin-subscriptions" class="page-content hidden"></div>
        </main>
    </div>

    <!-- ==================== رسالة خطأ عامة ==================== -->
    <div id="globalError" class="hidden fixed bottom-4 left-4 right-4 md:left-auto bg-red-600 text-white p-4 rounded-lg shadow-lg z-[100] max-w-md mx-auto"></div>

    <!-- ==================== المودالات ==================== -->
    <!-- مودال سجل الرحلة سيتم إنشاؤه ديناميكياً -->

    <!-- ==================== السكربتات ==================== -->
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- ملف الجافاسكربت الرئيسي -->
    <script src="app.js"></script>

    <script>
        // دالة التبديل بين تبويبات تسجيل الدخول وإنشاء حساب
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const tabLogin = document.getElementById('tabLogin');
            const tabSignup = document.getElementById('tabSignup');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.className = 'flex-1 py-2 px-4 rounded-lg font-bold bg-yellow-500 text-black transition';
                tabSignup.className = 'flex-1 py-2 px-4 rounded-lg font-bold text-gray-300 hover:text-white transition';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                tabLogin.className = 'flex-1 py-2 px-4 rounded-lg font-bold text-gray-300 hover:text-white transition';
                tabSignup.className = 'flex-1 py-2 px-4 rounded-lg font-bold bg-yellow-500 text-black transition';
            }
        }
    </script>
</body>
</html>
