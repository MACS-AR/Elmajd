<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام تتبع المركبات</title>
    
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    
    <!-- مكتبة Leaflet المجانية (بديلة Mapbox) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- ملف التنسيقات الخاص بك -->
    <link rel="stylesheet" href="style.css" />

    <!-- تنسيقات إضافية لتحسين شكل النوافذ المنبثقة على الخريطة -->
    <style>
        .leaflet-popup-content-wrapper {
            background-color: #ffffff; /* خلفية النافذة */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 2px;
        }
        .leaflet-popup-tip {
            background-color: #ffffff;
        }
        /* إخفاء خلفية أيقونة الخريطة الافتراضية للسيارات */
        .custom-leaflet-marker {
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

<div id="app">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 to-gray-800 p-4">
        <div class="bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-8 border border-yellow-600">
            <div class="text-center mb-8">
                <div class="text-5xl mb-3">🚗</div>
                <h1 class="text-3xl font-bold text-yellow-500">نظام التتبع</h1>
                <p class="text-gray-400 text-sm mt-1">تسجيل الدخول إلى لوحة التحكم</p>
            </div>

            <!-- رسائل الخطأ العامة -->
            <div id="globalError" class="hidden bg-red-900/50 border border-red-600 text-red-300 p-3 rounded-lg text-sm mb-4"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm font-bold mb-2">البريد الإلكتروني</label>
                    <input id="loginEmail" type="email" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-500 text-white placeholder-gray-400" placeholder="admin@system.com" required />
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 text-sm font-bold mb-2">كلمة المرور</label>
                    <input id="loginPassword" type="password" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-yellow-500 text-white placeholder-gray-400" placeholder="••••••••" required />
                </div>
                <div id="loginError" class="text-red-400 text-sm mb-4 hidden"></div>
                <button type="submit" class="w-full bg-yellow-600 text-gray-900 py-3 rounded-xl hover:bg-yellow-500 transition font-bold text-lg">تسجيل الدخول</button>
            </form>

            <button onclick="quickLoginAdmin()" class="w-full bg-yellow-500 text-gray-900 py-3 rounded-xl hover:bg-yellow-400 transition font-bold text-lg mt-3">
                ⚡ دخول سريع (أدمن)
            </button>

            <button onclick="createDemoAccount()" class="w-full bg-green-600 text-white py-3 rounded-xl hover:bg-green-500 transition font-bold text-lg mt-3">
                🆕 إنشاء حساب تجريبي
            </button>

            <p class="text-xs text-gray-500 text-center mt-4">الحساب الافتراضي: admin@system.com / 123456</p>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="dashboardScreen" class="hidden min-h-screen bg-gray-900">
        <!-- الشريط العلوي -->
        <nav class="bg-gray-800 shadow-lg px-4 md:px-8 py-4 flex flex-wrap justify-between items-center sticky top-0 z-50 border-b border-yellow-600">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🚗</span>
                <span class="font-bold text-xl text-yellow-500">نظام التتبع</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="userName" class="text-gray-300 font-medium text-sm md:text-base">مرحباً، Admin</span>
                <span id="userRole" class="bg-yellow-600 text-gray-900 px-3 py-1 rounded-full text-xs font-bold">مدير</span>
                <button onclick="handleLogout()" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-700 transition">خروج</button>
            </div>
        </nav>

        <!-- الشريط الجانبي + المحتوى -->
        <div class="flex">
            <!-- الشريط الجانبي -->
            <aside class="w-64 bg-gray-800 shadow-lg min-h-[calc(100vh-73px)] p-4 hidden md:block border-l border-gray-700">
                <nav class="space-y-1">
                    <button onclick="showPage('dashboard')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="dashboard">
                        <span class="text-xl">📊</span> لوحة التحكم
                    </button>
                    <button onclick="showPage('vehicles')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="vehicles">
                        <span class="text-xl">🚗</span> سياراتي
                    </button>
                    <button onclick="showPage('map')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="map">
                        <span class="text-xl">🗺️</span> الخريطة المباشرة
                    </button>
                    <button onclick="showPage('tracking')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="tracking">
                        <span class="text-xl">📈</span> سجل الحركة
                    </button>
                    
                    <!-- قائمة الأدمن (تظهر فقط للمشرفين) -->
                    <div id="adminMenu" class="hidden mt-4 pt-4 border-t border-gray-700">
                        <p class="text-xs text-gray-500 px-4 mb-2">🔒 إدارة النظام</p>
                        <button onclick="showPage('admin-companies')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="admin-companies">
                            <span class="text-xl">🏢</span> الشركات
                        </button>
                        <button onclick="showPage('admin-vehicles')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="admin-vehicles">
                            <span class="text-xl">🌍</span> جميع السيارات
                        </button>
                        <button onclick="showPage('admin-subscriptions')" class="nav-btn w-full text-right px-4 py-3 rounded-lg hover:bg-gray-700 text-gray-300 font-medium flex items-center gap-3 transition" data-page="admin-subscriptions">
                            <span class="text-xl">📋</span> الاشتراكات
                        </button>
                    </div>
                </nav>
            </aside>

            <!-- المحتوى -->
            <main class="flex-1 p-4 md:p-6">
                <div id="page-dashboard" class="page-content">جاري التحميل...</div>
                <div id="page-vehicles" class="page-content hidden">جاري التحميل...</div>
                <div id="page-map" class="page-content hidden">جاري التحميل...</div>
                <div id="page-tracking" class="page-content hidden">جاري التحميل...</div>
                <div id="page-admin-companies" class="page-content hidden">جاري التحميل...</div>
                <div id="page-admin-vehicles" class="page-content hidden">جاري التحميل...</div>
                <div id="page-admin-subscriptions" class="page-content hidden">جاري التحميل...</div>
            </main>
        </div>
    </div>
</div>

<!-- المكتبات الخارجية -->
<!-- مكتبة Leaflet للخرائط بدلاً من Mapbox -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- مكتبات Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<!-- ملف الجافاسكريبت الخاص بك -->
<script src="app.js"></script>
</body>
</html>
