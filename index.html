<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مصنع المجد للأعلاف - بوابة الدخول الموحدة</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }

    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: rgba(18, 20, 29, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .gold-glow {
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.22);
    }

    /* 🐓 أنيميشن الديك فوق خانة الرقم */
    @keyframes roosterTrack {
      0% { transform: translateX(120%) scaleX(-1); }
      48% { transform: translateX(-120%) scaleX(-1); }
      50% { transform: translateX(-120%) scaleX(1); }
      98% { transform: translateX(120%) scaleX(1); }
      100% { transform: translateX(120%) scaleX(-1); }
    }

    @keyframes roosterHop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .rooster-runner {
      animation: roosterTrack 7s infinite ease-in-out;
    }

    .rooster-hop {
      animation: roosterHop 0.3s infinite ease-in-out;
    }

    /* 🐥 أنيميشن الكتاكيت في الخلفية */
    .bg-animation-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    @keyframes chickFloatLeft {
      0% { transform: translateX(100vw) translateY(0) scaleX(1); opacity: 0.15; }
      50% { transform: translateX(50vw) translateY(-20px) scaleX(1); opacity: 0.35; }
      100% { transform: translateX(-15vw) translateY(10px) scaleX(1); opacity: 0.05; }
    }

    @keyframes chickFloatRight {
      0% { transform: translateX(-15vw) translateY(0) scaleX(-1); opacity: 0.15; }
      50% { transform: translateX(45vw) translateY(-25px) scaleX(-1); opacity: 0.35; }
      100% { transform: translateX(115vw) translateY(15px) scaleX(-1); opacity: 0.05; }
    }

    .chick-bg-1 {
      position: absolute;
      top: 18%;
      animation: chickFloatLeft 16s infinite linear;
    }

    .chick-bg-2 {
      position: absolute;
      top: 62%;
      animation: chickFloatRight 20s infinite linear;
      animation-delay: 4s;
    }

    .chick-bg-3 {
      position: absolute;
      top: 82%;
      animation: chickFloatLeft 24s infinite linear;
      animation-delay: 9s;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

  <!-- 🐥 خلفية الكتاكيت المتحركة -->
  <div class="bg-animation-container">
    <div class="chick-bg-1 text-gold/30 flex gap-4 items-center">
      <svg class="w-12 h-12" viewBox="0 0 64 64" fill="currentColor">
        <path d="M32 12c-6.6 0-12 5.4-12 12 0 3 1.1 5.7 3 7.8L18 36c-2 2-3 4.5-3 7.2 0 5.4 4.3 9.8 9.7 9.8h14.6c5.4 0 9.7-4.4 9.7-9.8 0-2.7-1-5.2-3-7.2l-5-4.2c1.9-2.1 3-4.8 3-7.8 0-6.6-5.4-12-12-12zM42 24c0 1-.8 2-2 2s-2-1-2-2 .8-2 2-2 2 1 2 2z"/>
      </svg>
      <svg class="w-8 h-8" viewBox="0 0 64 64" fill="currentColor">
        <path d="M32 12c-6.6 0-12 5.4-12 12 0 3 1.1 5.7 3 7.8L18 36c-2 2-3 4.5-3 7.2 0 5.4 4.3 9.8 9.7 9.8h14.6c5.4 0 9.7-4.4 9.7-9.8 0-2.7-1-5.2-3-7.2l-5-4.2c1.9-2.1 3-4.8 3-7.8 0-6.6-5.4-12-12-12z"/>
      </svg>
    </div>

    <div class="chick-bg-2 text-gold/25 flex gap-6 items-center">
      <svg class="w-14 h-14" viewBox="0 0 64 64" fill="currentColor">
        <path d="M32 12c-6.6 0-12 5.4-12 12 0 3 1.1 5.7 3 7.8L18 36c-2 2-3 4.5-3 7.2 0 5.4 4.3 9.8 9.7 9.8h14.6c5.4 0 9.7-4.4 9.7-9.8 0-2.7-1-5.2-3-7.2l-5-4.2c1.9-2.1 3-4.8 3-7.8 0-6.6-5.4-12-12-12z"/>
      </svg>
    </div>

    <div class="chick-bg-3 text-gold/30 flex gap-3 items-center">
      <svg class="w-10 h-10" viewBox="0 0 64 64" fill="currentColor">
        <path d="M32 12c-6.6 0-12 5.4-12 12 0 3 1.1 5.7 3 7.8L18 36c-2 2-3 4.5-3 7.2 0 5.4 4.3 9.8 9.7 9.8h14.6c5.4 0 9.7-4.4 9.7-9.8 0-2.7-1-5.2-3-7.2l-5-4.2c1.9-2.1 3-4.8 3-7.8 0-6.6-5.4-12-12-12z"/>
      </svg>
    </div>
  </div>

  <!-- الكارت الرئيسي -->
  <div class="w-full max-w-md relative z-10">

    <!-- شريط التنبيهات Toast -->
    <div id="toast" class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold border transition-all flex items-center gap-2">
      <i id="toast-icon" data-lucide="info" class="w-4 h-4"></i>
      <span id="toast-msg"></span>
    </div>

    <div class="glass-card p-6 sm:p-8 rounded-3xl space-y-6 gold-glow relative border border-gold/40">
      
      <!-- اللوجو واسم المصنع -->
      <div class="text-center space-y-2">
        <div class="relative inline-block">
          <img 
            src="https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png" 
            alt="شعار مصنع المجد" 
            class="w-20 h-20 rounded-full mx-auto border-2 border-gold p-1 bg-dark-900 object-contain shadow-xl" 
          />
        </div>
        <h1 class="text-2xl font-black text-white tracking-wide">
          مصنع <span class="gold-text">المجد للأعلاف</span>
        </h1>
        <p class="text-xs text-gray-300 font-semibold">بوابة الدخول الذكية الموحدة للنظام</p>
      </div>

      <!-- 🐓 مضمار الديك يجري فوق خانة الرقم -->
      <div class="relative w-full h-14 overflow-hidden rounded-2xl bg-dark-950/90 border border-gold/30 flex items-center justify-center shadow-inner">
        <div class="absolute inset-0 flex items-center justify-between px-4 text-[10px] text-gold/50 font-bold select-none">
          <span>🌾 جودة تميزنا</span>
          <span>🐔 مصنع المجد للأعلاف</span>
        </div>

        <div class="rooster-runner absolute">
          <div class="rooster-hop flex items-center">
            <svg class="w-10 h-10 text-gold drop-shadow-[0_0_10px_rgba(212,175,55,0.9)]" viewBox="0 0 64 64" fill="currentColor">
              <path d="M28 8c-2 0-3 2-2 4 1 1 3 1 3 0 1 2 3 2 4 0 1 2 3 2 4 0 0-3-2-4-5-2z" fill="#EF4444"/>
              <path d="M36 18c-4 0-8 3-9 7l-5-2c-3 0-5 3-4 6 2 4 6 6 10 6 1 0 2 0 3-1l1 4c-3 2-6 5-6 9 0 5 4 9 9 9h6c4 0 7-3 7-7 0-4-3-8-7-9l-1-4c3-1 5-4 5-8 0-5-4-10-9-10z"/>
              <polygon points="23,22 17,25 23,28" fill="#F59E0B"/>
              <path d="M44 26c3-3 7-3 10 0 1-4 0-8-3-10-3 2-5 6-7 10z" fill="#D4AF37"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- نموذج أدخل رقم الهاتف -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        
        <div class="space-y-2">
          <label class="text-xs text-gray-200 font-bold flex items-center justify-between">
            <span class="flex items-center gap-1.5">
              <i data-lucide="phone" class="w-4 h-4 text-gold"></i>
              أدخل رقم الهاتف المسجل:
            </span>
            <span class="text-[10px] text-gold font-normal">01xxxxxxxx</span>
          </label>

          <div class="relative">
            <input
              type="tel"
              id="phoneInput"
              required
              placeholder="أدخل رقم التليفون..."
              class="w-full bg-dark-800 border-2 border-dark-700 rounded-2xl py-4 px-12 text-center font-mono text-base font-bold text-white outline-none focus:border-gold focus:ring-2 focus:ring-gold/30 transition-all shadow-inner tracking-wider"
              dir="ltr"
              autocomplete="tel"
            />
            <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gold">
              <i data-lucide="smartphone" class="w-5 h-5"></i>
            </div>
          </div>
        </div>

        <!-- زر تسجيل الدخول -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full gold-gradient text-dark-950 font-black py-4 rounded-2xl text-sm transition-all hover:brightness-110 shadow-xl flex items-center justify-center gap-2 group cursor-pointer"
        >
          <span id="btnText">تسجيل الدخول والتوجيه التلقائي</span>
          <i id="btnIcon" data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
        </button>

      </form>

      <div class="text-center pt-2 border-t border-dark-700/60">
        <p class="text-[11px] text-gray-400">
          مصنع المجد للأعلاف &copy; 2026 - جميع الحقوق محفوظة
        </p>
      </div>

    </div>
  </div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.db = rtdb;
    window.dbRef = ref;
    window.dbGet = get;

    if (window.lucide) window.lucide.createIcons();
  </script>

  <!-- كود التوجيه المحدث والمضمون 100% -->
  <script>
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');

      msg.innerText = message;
      toast.className = `fixed top-5 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold border transition-all flex items-center gap-2 ${
        type === 'error' ? 'bg-red-950 text-red-300 border-red-800' :
        type === 'success' ? 'bg-green-950 text-green-300 border-green-800' :
        'bg-dark-800 text-gold border-gold/40'
      }`;

      toast.classList.remove('hidden');
      setTimeout(() => {
        if (toast) toast.classList.add('hidden');
      }, 4000);
    }

    // دالة تنظيف وتوحيد الأرقام (تضمن تحويل الأرقام العربية إلى إنجليزية وإزالة المسافات)
    function normalizePhone(phone) {
      if (!phone) return '';
      return String(phone)
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
        .replace(/\D/g, '');
    }

    async function handleLogin(e) {
      e.preventDefault();

      const phoneInput = document.getElementById('phoneInput');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const rawPhone = phoneInput.value.trim();

      const cleanPhone = normalizePhone(rawPhone);

      if (!cleanPhone) {
        showToast('يرجى إدخال رقم هاتف صحيح', 'error');
        return;
      }

      submitBtn.disabled = true;
      btnText.innerText = 'جاري التحقق والتوجيه...';
      showToast('جاري الفحص ومطابقة بيانات الحساب...', 'info');

      try {
        if (!window.db) {
          await new Promise(resolve => setTimeout(resolve, 600));
        }

        const { db, dbRef, dbGet } = window;
        let matchedUser = null;
        let redirectTarget = '';

        // 1. فحص جدول الموظفين والإدارة والمناديب (salesReps)
        const repsSnapshot = await dbGet(dbRef(db, 'salesReps'));
        if (repsSnapshot.exists()) {
          const repsData = repsSnapshot.val();
          const repsList = Object.keys(repsData).map(k => ({ id: k, ...repsData[k] }));

          matchedUser = repsList.find(r => normalizePhone(r.phone) === cleanPhone);

          if (matchedUser) {
            localStorage.setItem('userPhone', cleanPhone);
            localStorage.setItem('repData', JSON.stringify(matchedUser));

            const role = String(matchedUser.role || '').toLowerCase();

            if (role === 'admin') {
              redirectTarget = `admin.html?phone=${encodeURIComponent(cleanPhone)}`;
              showToast(`أهلاً بك الإداري (${matchedUser.name}).. جاري الفتح`, 'success');
            } else if (role === 'sales') {
              redirectTarget = `pay.html?phone=${encodeURIComponent(cleanPhone)}`;
              showToast(`أهلاً بك موظف المعرض (${matchedUser.name}).. جاري الفتح`, 'success');
            } else {
              redirectTarget = `rep.html?phone=${encodeURIComponent(cleanPhone)}`;
              showToast(`أهلاً بك المندوب (${matchedUser.name}).. جاري الفتح`, 'success');
            }
          }
        }

        // 2. فحص جدول السائقين (drivers) -> car.html
        if (!matchedUser) {
          const driversSnapshot = await dbGet(dbRef(db, 'drivers'));
          if (driversSnapshot.exists()) {
            const driversData = driversSnapshot.val();
            const driversList = Object.keys(driversData).map(k => ({ id: k, ...driversData[k] }));

            const matchedDriver = driversList.find(d => normalizePhone(d.phone) === cleanPhone);

            if (matchedDriver) {
              matchedUser = matchedDriver;
              localStorage.setItem('userPhone', cleanPhone);
              localStorage.setItem('driverData', JSON.stringify(matchedDriver));

              redirectTarget = `car.html?phone=${encodeURIComponent(cleanPhone)}`;
              showToast(`أهلاً بك السائق (${matchedDriver.name}).. جاري الفتح`, 'success');
            }
          }
        }

        // 3. فحص جدول العملاء (clients) -> wow.html
        if (!matchedUser) {
          const clientsSnapshot = await dbGet(dbRef(db, 'clients'));

          if (clientsSnapshot.exists()) {
            const clientsData = clientsSnapshot.val();
            const clientsList = Object.keys(clientsData).map(k => ({ id: k, ...clientsData[k] }));

            const matchedClient = clientsList.find(c => normalizePhone(c.phone) === cleanPhone);

            if (matchedClient) {
              matchedUser = matchedClient;
              localStorage.setItem('userPhone', cleanPhone);
              localStorage.setItem('clientData', JSON.stringify(matchedClient));

              redirectTarget = `wow.html?phone=${encodeURIComponent(cleanPhone)}`;
              showToast(`أهلاً بك العميل العزيز (${matchedClient.name}).. جاري الفتح`, 'success');
            }
          }
        }

        // 4. تنفيذ التوجيه الفعلي
        if (redirectTarget) {
          setTimeout(() => {
            window.location.href = redirectTarget;
          }, 800);
        } else {
          showToast('رقم الهاتف غير مسجل، جاري التحويل لبوابة العملاء...', 'info');
          localStorage.setItem('userPhone', cleanPhone);
          
          setTimeout(() => {
            window.location.href = `wow.html?phone=${encodeURIComponent(cleanPhone)}`;
          }, 1200);
        }

      } catch (error) {
        console.error("Login Error:", error);
        showToast('جاري التوجيه التلقائي...', 'info');
        
        setTimeout(() => {
          localStorage.setItem('userPhone', cleanPhone);
          window.location.href = `rep.html?phone=${encodeURIComponent(cleanPhone)}`;
        }, 1000);
      } finally {
        submitBtn.disabled = false;
        btnText.innerText = 'تسجيل الدخول والتوجيه التلقائي';
      }
    }
  </script>
</body>
</html>
