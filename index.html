<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تتبع المركبات والسائقين - Multi-Tenant Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <!-- Auth & Subscription Check Overlay -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-gray-900 flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl border border-gray-700 w-full max-w-md">
            <h2 class="text-2xl font-bold text-center mb-6 text-blue-400">تطبيق تتبع المركبات</h2>
            
            <div id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-300">البريد الإلكتروني</label>
                    <input type="email" id="emailInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">كلمة المرور</label>
                    <input type="password" id="passInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-lg transition">تسجيل الدخول</button>
                <button onclick="toggleAuthMode('register')" class="w-full bg-transparent hover:bg-gray-700 text-sm py-2 rounded-lg text-gray-400">إنشاء حساب شركة/فرد جديد (15 يوم مجاناً)</button>
            </div>

            <div id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm mb-1 text-gray-300">اسم الشركة / الفرد</label>
                    <input type="text" id="regCompanyInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">البريد الإلكتروني</label>
                    <input type="email" id="regEmailInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">كلمة المرور</label>
                    <input type="password" id="regPassInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white">
                </div>
                <button onclick="handleRegister()" class="w-full bg-green-600 hover:bg-green-500 font-bold py-3 rounded-lg transition">بدء الفترة التجريبية (15 يوم)</button>
                <button onclick="toggleAuthMode('login')" class="w-full bg-transparent hover:bg-gray-700 text-sm py-2 rounded-lg text-gray-400">لديك حساب بالفعل؟ تسجيل الدخول</button>
            </div>
        </div>
    </div>

    <!-- Subscription Expired Modal -->
    <div id="subscriptionModal" class="fixed inset-0 z-50 bg-black/90 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-2xl border border-red-500 text-center max-w-lg w-full space-y-4">
            <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500"></i>
            <h2 class="text-2xl font-bold">انتهت الفترة التجريبية / الاشتراك</h2>
            <p class="text-gray-300 text-sm">تواصل مع إدارة المنصة لتجديد الاشتراك وتفعيل الحساب لاستمرار التتبع اللحظي.</p>
            
            <div class="grid grid-cols-2 gap-4 mt-6">
                <div class="bg-gray-700 p-4 rounded-xl border border-gray-600">
                    <div class="text-sm text-gray-400">الاشتراك الشهري</div>
                    <div id="displayMonthlyPrice" class="text-xl font-bold text-blue-400">-- ج.م</div>
                </div>
                <div class="bg-gray-700 p-4 rounded-xl border border-gray-600">
                    <div class="text-sm text-gray-400">الاشتراك السنوي</div>
                    <div id="displayAnnualPrice" class="text-xl font-bold text-green-400">-- ج.م</div>
                </div>
            </div>
            
            <div id="paymentInstructions" class="text-xs text-gray-400 mt-4 bg-gray-900 p-3 rounded-lg"></div>
            <button onclick="auth.signOut()" class="w-full bg-gray-700 hover:bg-gray-600 py-2 rounded-lg text-sm mt-4">تسجيل الخروج</button>
        </div>
    </div>

    <!-- Main Application UI -->
    <div id="mainApp" class="flex h-screen overflow-hidden hidden">
        <!-- Sidebar -->
        <aside class="w-80 bg-gray-800 border-l border-gray-700 flex flex-col z-10">
            <!-- Header -->
            <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                <div>
                    <h1 id="companyTitle" class="font-bold text-lg text-blue-400">جاري التحميل...</h1>
                    <span id="tenantStatusBadge" class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full">نشط</span>
                </div>
                <button onclick="auth.signOut()" title="تسجيل الخروج" class="text-gray-400 hover:text-red-400">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>

            <!-- Driver Management Controls -->
            <div class="p-4 border-b border-gray-700 space-y-2">
                <button onclick="openAddDriverModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-sm py-2 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i> إضافة سائق جديد
                </button>
                <button id="superAdminBtn" onclick="toggleSuperAdminPanel()" class="w-full bg-purple-600 hover:bg-purple-500 text-sm py-2 rounded-lg font-semibold hidden">
                    <i class="fa-solid fa-user-shield"></i> لوحة Super Admin
                </button>
            </div>

            <!-- Driver List -->
            <div class="flex-1 overflow-y-auto p-4 space-y-3" id="driversList">
                <!-- Drivers dynamically populated -->
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative">
            <div id="map" class="w-full h-full"></div>
            
            <!-- Map Layer Switcher -->
            <div class="absolute top-4 left-4 z-[400] bg-gray-800/90 backdrop-blur p-2 rounded-lg border border-gray-700 flex gap-2">
                <button onclick="switchTileLayer('streets')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs">شوارع</button>
                <button onclick="switchTileLayer('satellite')" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs">قمر صناعي</button>
            </div>
        </main>
    </div>

    <!-- Super Admin Drawer/Modal -->
    <div id="superAdminPanel" class="fixed inset-0 z-50 bg-black/80 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 p-6 rounded-xl border border-purple-500 max-w-2xl w-full space-y-4">
            <div class="flex justify-between items-center border-b border-gray-700 pb-3">
                <h3 class="text-xl font-bold text-purple-400">لوحة تحكم المنصة (Super Admin)</h3>
                <button onclick="toggleSuperAdminPanel()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">سعر الاشتراك الشهري (ج.م)</label>
                    <input type="number" id="adminMonthlyPrice" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">سعر الاشتراك السنوي (ج.م)</label>
                    <input type="number" id="adminAnnualPrice" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1">تعليمات وتفاصيل الدفع (فودافون كاش / انستا باي)</label>
                <textarea id="adminPaymentDetails" class="w-full bg-gray-700 p-2 rounded border border-gray-600 text-sm h-20"></textarea>
            </div>
            <button onclick="savePlatformSettings()" class="bg-purple-600 hover:bg-purple-500 w-full py-2 rounded font-bold text-sm">حفظ إعدادات الأسعار</button>

            <div class="mt-6">
                <h4 class="font-bold text-sm mb-2 text-gray-300">الشركات والاشتراكات المسجلة</h4>
                <div class="max-h-48 overflow-y-auto space-y-2 text-xs" id="tenantsAdminList">
                    <!-- Dynamic Tenants -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Modular Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, where, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration (تستخدم قيم المشروع الخاصة بك)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);

        window.auth = auth; // Expose for signout

        // State Management
        let currentUser = null;
        let currentTenant = null;
        let map = null;
        let activeTileLayer = null;
        let driverMarkers = {};
        let driverPaths = {};

        // Leaflet Tiles Setup
        const tileLayers = {
            streets: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
        };

        // Initialize Map
        function initMap() {
            if (map) return;
            map = L.map('map').setView([30.0444, 31.2357], 11);
            activeTileLayer = L.tileLayer(tileLayers.streets, { maxZoom: 19 }).addTo(map);
        }

        window.switchTileLayer = (type) => {
            if (activeTileLayer) map.removeLayer(activeTileLayer);
            activeTileLayer = L.tileLayer(tileLayers[type], { maxZoom: 19 }).addTo(map);
        };

        // Authentication Handlers
        window.toggleAuthMode = (mode) => {
            document.getElementById('loginForm').classList.toggle('hidden', mode === 'register');
            document.getElementById('registerForm').classList.toggle('hidden', mode === 'login');
        };

        window.handleLogin = async () => {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passInput').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                alert("خطأ في تسجيل الدخول: " + e.message);
            }
        };

        window.handleRegister = async () => {
            const companyName = document.getElementById('regCompanyInput').value;
            const email = document.getElementById('regEmailInput').value;
            const pass = document.getElementById('regPassInput').value;

            if (!companyName || !email || !pass) return alert("رجاءً ملء جميع الحقول");

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                const tenantId = cred.user.uid;
                
                // Set Trial Expiration Date (15 Days)
                const now = new Date();
                const trialEndsAt = new Date(now.setDate(now.getDate() + 15)).toISOString();

                // Create Tenant Record
                await setDoc(doc(db, "tenants", tenantId), {
                    name: companyName,
                    email: email,
                    planType: 'trial',
                    status: 'active',
                    trialEndsAt: trialEndsAt,
                    createdAt: new Date().toISOString()
                });

                // Create User Record
                await setDoc(doc(doc(db, "users", cred.user.uid)), {
                    name: companyName,
                    email: email,
                    role: 'company_admin',
                    tenantId: tenantId
                });

            } catch (e) {
                alert("خطأ في إنشاء الحساب: " + e.message);
            }
        };

        // Haversine Distance Calculation (كيلومترات)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // Auth State & Subscription Engine
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists()) return;
                currentUser = userDoc.data();

                // Fetch System Settings (Prices)
                const sysDoc = await getDoc(doc(db, "system_settings", "config"));
                if (sysDoc.exists()) {
                    const sys = sysDoc.data();
                    document.getElementById('displayMonthlyPrice').innerText = `${sys.monthlyPrice || 0} ج.م`;
                    document.getElementById('displayAnnualPrice').innerText = `${sys.annualPrice || 0} ج.م`;
                    document.getElementById('paymentInstructions').innerText = sys.paymentInfo || 'تواصل مع الإدارة للدفع';
                }

                // Check Super Admin
                if (currentUser.role === 'super_admin') {
                    document.getElementById('superAdminBtn').classList.remove('hidden');
                }

                // Verify Tenant Subscription Status
                const tenantDoc = await getDoc(doc(db, "tenants", currentUser.tenantId));
                if (tenantDoc.exists()) {
                    currentTenant = tenantDoc.data();
                    const now = new Date();
                    const trialEnd = new Date(currentTenant.trialEndsAt);
                    const isExpired = currentTenant.status === 'expired' || (currentTenant.planType === 'trial' && now > trialEnd);

                    if (isExpired && currentUser.role !== 'super_admin') {
                        document.getElementById('authScreen').classList.add('hidden');
                        document.getElementById('subscriptionModal').classList.remove('hidden');
                        return;
                    }

                    // Activate Main UI
                    document.getElementById('companyTitle').innerText = currentTenant.name;
                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('subscriptionModal').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');

                    initMap();
                    startTrackingEngine(currentUser.tenantId);
                }
            } else {
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('subscriptionModal').classList.add('hidden');
                document.getElementById('authScreen').classList.remove('hidden');
            }
        });

        // Driver Realtime Tracking Subscriptions (Strict Tenant Isolation)
        function startTrackingEngine(tenantId) {
            // Listen to Drivers Firestore Collection for Metadata
            const q = query(collection(db, "drivers"), where("tenantId", "==", tenantId));
            onSnapshot(q, (snapshot) => {
                const driversListEl = document.getElementById('driversList');
                driversListEl.innerHTML = '';

                snapshot.forEach(docSnap => {
                    const driver = docSnap.data();
                    const driverId = docSnap.id;

                    // UI Card Construction
                    const card = document.createElement('div');
                    card.className = "bg-gray-700/50 p-3 rounded-xl border border-gray-600 space-y-2";
                    card.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-sm">${driver.name}</span>
                            <span id="status-${driverId}" class="text-xs px-2 py-0.5 rounded bg-gray-600">منفصل</span>
                        </div>
                        <div class="text-xs text-gray-400">رقم المركبة: ${driver.vehiclePlate || 'غير مخصص'}</div>
                        <div class="text-xs text-gray-400">الكود (App ID): <code class="bg-gray-800 px-1 rounded text-blue-300">${driverId}</code></div>
                        <div class="flex justify-between text-[10px] text-gray-400 pt-1 border-t border-gray-600">
                            <span>السرعة: <b id="speed-${driverId}">0</b> كم/س</span>
                            <span>البطارية: <b id="batt-${driverId}">0%</b></span>
                        </div>
                    `;
                    driversListEl.appendChild(card);

                    // Connect to Realtime Database (RTDB) for Live Coordinates
                    const liveRef = ref(rtdb, `tracking/${tenantId}/${driverId}/live`);
                    onValue(liveRef, (rtSnap) => {
                        const data = rtSnap.val();
                        if (data && data.latitude && data.longitude) {
                            updateDriverMapLocation(driverId, driver.name, data);
                        }
                    });
                });
            });
        }

        // Render Driver Position & Route History on Leaflet
        function updateDriverMapLocation(driverId, name, data) {
            const { latitude, longitude, speed, battery, timestamp } = data;
            const latLng = [latitude, longitude];

            // Update UI Counters
            document.getElementById(`speed-${driverId}`).innerText = speed || 0;
            document.getElementById(`batt-${driverId}`).innerText = battery || 0;
            
            const statusEl = document.getElementById(`status-${driverId}`);
            statusEl.innerText = "متصل";
            statusEl.className = "text-xs px-2 py-0.5 rounded bg-green-500/20 text-green-400";

            // Update Map Marker
            if (!driverMarkers[driverId]) {
                driverMarkers[driverId] = L.marker(latLng).addTo(map).bindPopup(`<b>${name}</b>`);
                driverPaths[driverId] = L.polyline([latLng], { color: '#3b82f6', weight: 4 }).addTo(map);
            } else {
                driverMarkers[driverId].setLatLng(latLng);
                driverPaths[driverId].addLatLng(latLng);
            }
        }

        // Super Admin Management Actions
        window.toggleSuperAdminPanel = () => {
            const panel = document.getElementById('superAdminPanel');
            panel.classList.toggle('hidden');
            if (!panel.classList.contains('hidden')) loadTenantsForAdmin();
        };

        window.savePlatformSettings = async () => {
            const monthlyPrice = Number(document.getElementById('adminMonthlyPrice').value);
            const annualPrice = Number(document.getElementById('adminAnnualPrice').value);
            const paymentInfo = document.getElementById('adminPaymentDetails').value;

            await setDoc(doc(db, "system_settings", "config"), {
                monthlyPrice, annualPrice, paymentInfo
            }, { merge: true });

            alert("تم حفظ إعدادات الاشتراكات بنجاح!");
        };

        async function loadTenantsForAdmin() {
            const snap = await getDoc(doc(db, "system_settings", "config"));
            if (snap.exists()) {
                document.getElementById('adminMonthlyPrice').value = snap.data().monthlyPrice || 0;
                document.getElementById('adminAnnualPrice').value = snap.data().annualPrice || 0;
                document.getElementById('adminPaymentDetails').value = snap.data().paymentInfo || '';
            }
        }
    </script>
</body>
</html>
