<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تتبع المركبات الذكي | المنصة</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS للخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 للتنبيهات -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS لتنسيق الواجهة -->
    <style>
        .page-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .nav-btn.active { background-color: #374151; border-right: 4px solid #fbbf24; color: #fbbf24; }
        .vehicle-card { transition: all 0.2s; border: 1px solid #374151; background: #1f2937; }
        .vehicle-card:hover { transform: translateY(-2px); border-color: #fbbf24; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.moving { background-color: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
        .status-dot.offline { background-color: #ef4444; }
        .btn-primary { background-color: #fbbf24; color: #111827; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: bold; transition: all 0.2s; }
        .btn-primary:hover { background-color: #f59e0b; }
        .btn-outline { border: 1px solid #4b5563; padding: 0.5rem 1rem; border-radius: 0.5rem; transition: all 0.2s; }
        .btn-outline:hover { border-color: #fbbf24; color: #fbbf24; }
        .btn-edit { background-color: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; transition: all 0.2s; }
        .btn-danger { background-color: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 0.5rem; transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 overflow-hidden h-screen flex flex-col">

    <!-- رسائل الخطأ العامة -->
    <div id="globalError" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 transition-all"></div>

    <!-- ==================== شاشة تسجيل الدخول ==================== -->
    <div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-yellow-400"><i class="fas fa-satellite-dish mr-2"></i> تتبع مسار</h1>
                <p class="text-gray-400 text-sm mt-2">نظام إدارة الأسطول الذكي</p>
            </div>
            
            <div id="loginError" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-3 rounded-lg mb-4 text-sm text-center"></div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-400 mb-2 text-sm">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-400" placeholder="admin@system.com">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 text-sm">كلمة المرور</label>
                    <input type="password" id="loginPassword" class="w-full bg-gray-900 border border-gray-600 text-white rounded-lg px-4 py-3 focus:outline-none focus:border-yellow-400" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full btn-primary py-3 mt-4 text-lg">تسجيل الدخول</button>
            </form>

            <div class="mt-6 flex flex-col gap-3 border-t border-gray-700 pt-6">
                <button onclick="quickLoginAdmin()" class="btn-outline w-full text-sm"><i class="fas fa-user-shield ml-2"></i>دخول سريع كمدير النظام</button>
                <button onclick="createDemoAccount()" class="btn-outline w-full text-sm text-blue-400 hover:border-blue-400 hover:text-blue-400"><i class="fas fa-user-plus ml-2"></i>إنشاء حساب شركة تجريبي</button>
            </div>
        </div>
    </div>

    <!-- ==================== لوحة التحكم الأساسية ==================== -->
    <div id="dashboardScreen" class="hidden flex-1 flex overflow-hidden">
        
        <!-- الشريط الجانبي -->
        <aside class="w-64 bg-gray-800 border-l border-gray-700 flex flex-col hidden md:flex z-20">
            <div class="h-16 flex items-center justify-center border-b border-gray-700 shadow-sm">
                <h1 class="text-xl font-bold text-yellow-400"><i class="fas fa-satellite-dish ml-2"></i>تتبع مسار</h1>
            </div>
            
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <button class="nav-btn active w-full flex items-center p-3 rounded-lg transition-colors text-gray-400" data-page="dashboard" onclick="showPage('dashboard')">
                    <span class="w-6"><i class="fas fa-home"></i></span><span class="mr-3">الرئيسية</span>
                </button>
                <button class="nav-btn w-full flex items-center p-3 rounded-lg transition-colors text-gray-400" data-page="vehicles" onclick="showPage('vehicles')">
                    <span class="w-6"><i class="fas fa-truck"></i></span><span class="mr-3">سياراتي</span>
                </button>
                <button class="nav-btn w-full flex items-center p-3 rounded-lg transition-colors text-gray-400" data-page="map" onclick="showPage('map')">
                    <span class="w-6"><i class="fas fa-map-marked-alt"></i></span><span class="mr-3">الخريطة المباشرة</span>
                </button>
                
                <!-- قائمة الإدارة تظهر فقط للأدمن -->
                <div id="adminMenu" class="hidden">
                    <div class="mt-6 mb-2 px-3 text-xs font-bold text-gray-500 uppercase">إدارة النظام</div>
                    <button class="nav-btn w-full flex items-center p-3 rounded-lg transition-colors text-gray-400" data-page="admin-companies" onclick="showPage('admin-companies')">
                        <span class="w-6"><i class="fas fa-building"></i></span><span class="mr-3">الشركات المشتركة</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="flex-1 flex flex-col h-full bg-gray-900 relative">
            <!-- الشريط العلوي -->
            <header class="h-16 bg-gray-800 border-b border-gray-700 flex items-center justify-between px-6 z-10 shadow-md">
                <div class="flex items-center">
                    <!-- زر القائمة للموبايل -->
                    <button class="md:hidden text-gray-400 hover:text-yellow-400 ml-4"><i class="fas fa-bars text-xl"></i></button>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3 border-r border-gray-700 pr-4">
                        <div class="text-left">
                            <div id="userName" class="text-sm font-bold text-white">جاري التحميل...</div>
                            <div id="userRole" class="text-xs text-yellow-400">---</div>
                        </div>
                        <button onclick="handleLogout()" class="h-10 w-10 rounded-full bg-gray-700 hover:bg-red-500/20 flex items-center justify-center text-yellow-400 hover:text-red-500 cursor-pointer transition" title="تسجيل الخروج">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- حاويات الصفحات (سيتم ملؤها من خلال app.js) -->
            <div id="main-content" class="flex-1 overflow-y-auto p-6">
                <div id="page-dashboard" class="page-content h-full"></div>
                <div id="page-vehicles" class="page-content hidden h-full"></div>
                <div id="page-map" class="page-content hidden h-full"></div>
                <div id="page-tracking" class="page-content hidden h-full"></div>
                <div id="page-admin-companies" class="page-content hidden h-full"></div>
                <div id="page-admin-vehicles" class="page-content hidden h-full"></div>
                <div id="page-admin-subscriptions" class="page-content hidden h-full"></div>
            </div>
        </main>
    </div>

    <!-- ==================== استدعاء المكتبات والسكربتات ==================== -->
    
    <!-- مكتبة Leaflet للخريطة -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- مكتبات Firebase (الإصدار Compat 9 ليتوافق مع app.js) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- ملف الجافاسكريبت الخاص بك (app.js) -->
    <script src="app.js"></script>

</body>
</html>
