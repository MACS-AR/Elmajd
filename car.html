<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة نقل مصنع المجد للأعلاف</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (Excel Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.4);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.18);
    }

    /* إصلاح شامل للطباعة الجداول والألوان لضمان الوضوح التام */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        page-break-inside: auto;
      }
      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
      th, td {
        border: 1px solid #000000 !important;
        color: #000000 !important;
        padding: 6px 8px !important;
        font-size: 11px !important;
        text-align: right !important;
      }
      th {
        background-color: #f0f0f0 !important;
        font-weight: bold !important;
      }
      .print-a5 {
        max-width: 148mm !important;
        margin: 0 auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, remove, update, db: rtdb
    };
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [emailInput, setEmailInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');

      // Active View
      const [activeTab, setActiveTab] = useState('dashboard');

      // Database Collections
      const [drivers, setDrivers] = useState([]);
      const [clients, setClients] = useState([]);
      const [trips, setTrips] = useState([]);
      const [logs, setLogs] = useState([]);

      // UI States
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);
      const [printSize, setPrintSize] = useState('A4');

      // Modal Controls
      const [activeModal, setActiveModal] = useState(null); // 'driverForm', 'clientForm', 'tripForm', 'editTripForm', 'driverReportModal', 'fullReportModal', 'deleteConfirm'
      const [selectedDriver, setSelectedDriver] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      const [selectedTrip, setSelectedTrip] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);

      // Report Date Range Filters
      const [reportFilter, setReportFilter] = useState({
        driverId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      // Form Data States
      const [driverData, setDriverData] = useState({ name: '', phone: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      const [clientData, setClientData] = useState({ name: '', address: '', phone: '', city: '', region: '', notes: '' });
      const [tripData, setTripData] = useState({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Realtime Database Sync
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'drivers'), snapshot => {
              const data = snapshot.val();
              setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'clients'), snapshot => {
              const data = snapshot.val();
              setClients(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'trips'), snapshot => {
              const data = snapshot.val();
              setTrips(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : []);
            });

            onValue(ref(db, 'logs'), snapshot => {
              const data = snapshot.val();
              setLogs(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : []);
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const addLog = (action, description) => {
        if (!window.rtdbMethods) return;
        const { ref, push, db } = window.rtdbMethods;
        push(ref(db, 'logs'), {
          action, description, timestamp: new Date().toISOString()
        });
      };

      // Auth Handler (admin / admin)
      const handleLogin = (e) => {
        e.preventDefault();
        if ((emailInput.trim() === 'admin' || emailInput.trim() === 'admin@elmajd.com') && passwordInput.trim() === 'admin') {
          setIsAuthenticated(true);
          showToast('تم تسجيل الدخول بنجاح كـ Admin');
          addLog('LOGIN', 'تم تسجيل الدخول إلى النظام');
        } else {
          showToast('خطأ: اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
        }
      };

      // Save Driver
      const handleSaveDriver = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedDriver) {
          update(ref(db, `drivers/${selectedDriver.id}`), driverData)
            .then(() => {
              showToast('تم تحديث بيانات السائق');
              addLog('UPDATE_DRIVER', `تعديل السائق ${driverData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'drivers'));
          set(newRef, {
            ...driverData,
            totalTripsCount: 0,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تمت إضافة السائق بنجاح');
            addLog('ADD_DRIVER', `إضافة سائق جديد: ${driverData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedDriver(null);
        setDriverData({ name: '', phone: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      };

      // Save Client
      const handleSaveClient = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedClient) {
          update(ref(db, `clients/${selectedClient.id}`), clientData)
            .then(() => {
              showToast('تم تعديل بيانات العميل');
              addLog('UPDATE_CLIENT', `تعديل العميل ${clientData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'clients'));
          set(newRef, {
            ...clientData,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تم إضافة العميل بنجاح');
            addLog('ADD_CLIENT', `إضافة عميل جديد: ${clientData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedClient(null);
        setClientData({ name: '', address: '', phone: '', city: '', region: '', notes: '' });
      };

      // Save Trip
      const handleSaveTrip = (e) => {
        e.preventDefault();
        if (!selectedDriver) return;
        const { ref, push, set, update, db } = window.rtdbMethods;

        const client = clients.find(c => c.id === tripData.clientId);
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const parsedWeight = parseFloat(tripData.weightTons) || 0;
        const parsedTripsCount = parseInt(tripData.tripsCount) || 1;

        const newTripRef = push(ref(db, 'trips'));
        set(newTripRef, {
          driverId: selectedDriver.id,
          driverName: selectedDriver.name,
          clientId: tripData.clientId,
          clientName: client ? client.name : 'غير محدد',
          clientAddress: client ? client.address : '',
          date: today,
          time: timeNow,
          tripsCount: parsedTripsCount,
          cargoType: tripData.cargoType,
          weightTons: parsedWeight,
          truckNumber: tripData.truckNumber || selectedDriver.truckNumber,
          notes: tripData.notes || '',
          createdAt: new Date().toISOString()
        }).then(() => {
          const newTotalTrips = (selectedDriver.totalTripsCount || 0) + parsedTripsCount;
          update(ref(db, `drivers/${selectedDriver.id}`), {
            totalTripsCount: newTotalTrips,
            lastTripDate: today
          });
          showToast(`تمت إضافة ${parsedTripsCount} نقلة بوزن ${parsedWeight} طن`);
          addLog('ADD_TRIP', `إضافة نقلة للسائق ${selectedDriver.name}`);
        });

        setActiveModal(null);
        setTripData({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });
      };

      // Update Existing Trip (تعديل النقلة وعدد النقلات)
      const handleUpdateTrip = (e) => {
        e.preventDefault();
        if (!selectedTrip) return;
        const { ref, update, db } = window.rtdbMethods;

        const client = clients.find(c => c.id === tripData.clientId);
        const oldTripsCount = parseInt(selectedTrip.tripsCount) || 0;
        const newTripsCount = parseInt(tripData.tripsCount) || 1;
        const parsedWeight = parseFloat(tripData.weightTons) || 0;

        update(ref(db, `trips/${selectedTrip.id}`), {
          clientId: tripData.clientId,
          clientName: client ? client.name : selectedTrip.clientName,
          clientAddress: client ? client.address : selectedTrip.clientAddress,
          tripsCount: newTripsCount,
          cargoType: tripData.cargoType,
          weightTons: parsedWeight,
          notes: tripData.notes || ''
        }).then(() => {
          // التعديل الفعلي لعداد نقلات السائق
          const driver = drivers.find(d => d.id === selectedTrip.driverId);
          if (driver) {
            const diff = newTripsCount - oldTripsCount;
            const updatedTotal = Math.max(0, (driver.totalTripsCount || 0) + diff);
            update(ref(db, `drivers/${driver.id}`), {
              totalTripsCount: updatedTotal
            });
          }
          showToast('تم تعديل بيانات النقلة بنجاح');
          addLog('UPDATE_TRIP', `تعديل نقلة للسائق ${selectedTrip.driverName}`);
        });

        setActiveModal(null);
        setSelectedTrip(null);
      };

      // Delete Handler
      const confirmDelete = () => {
        if (!deleteTarget) return;
        const { ref, remove, update, db } = window.rtdbMethods;

        if (deleteTarget.path === 'trips' && deleteTarget.trip) {
          // تقليل عدد نقلات السائق عند حذف النقلة
          const driver = drivers.find(d => d.id === deleteTarget.trip.driverId);
          if (driver) {
            const updatedTotal = Math.max(0, (driver.totalTripsCount || 0) - (parseInt(deleteTarget.trip.tripsCount) || 1));
            update(ref(db, `drivers/${driver.id}`), { totalTripsCount: updatedTotal });
          }
        }

        remove(ref(db, `${deleteTarget.path}/${deleteTarget.id}`))
          .then(() => {
            showToast('تم الحذف بنجاح');
            addLog('DELETE', `حذف من ${deleteTarget.path}`);
          });
        setActiveModal(null);
        setDeleteTarget(null);
      };

      // Excel Export
      const exportExcel = (dataList, filename) => {
        const wsData = dataList.map(t => ({
          'التاريخ': t.date,
          'الوقت': t.time || '',
          'اسم السائق': t.driverName,
          'اسم العميل': t.clientName,
          'عنوان العميل': t.clientAddress || '',
          'عدد النقلات': t.tripsCount,
          'الوزن (طن)': t.weightTons,
          'نوع الحمولة': t.cargoType,
          'ملاحظات': t.notes || ''
        }));
        const ws = XLSX.utils.json_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "التقرير");
        XLSX.writeFile(wb, `${filename}_${new Date().toISOString().slice(0,10)}.xlsx`);
      };

      // Filtered Trips for Reports
      const filteredReportTrips = useMemo(() => {
        return trips.filter(t => {
          const matchDriver = reportFilter.driverId ? t.driverId === reportFilter.driverId : true;
          const matchFrom = reportFilter.fromDate ? t.date >= reportFilter.fromDate : true;
          const matchTo = reportFilter.toDate ? t.date <= reportFilter.toDate : true;
          return matchDriver && matchFrom && matchTo;
        });
      }, [trips, reportFilter]);

      // Login View
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-dark-950">
            <form onSubmit={handleLogin} className="glass-card p-8 rounded-3xl w-full max-w-md gold-glow space-y-6">
              <div className="text-center">
                <div className="w-16 h-16 gold-gradient rounded-2xl mx-auto flex items-center justify-center text-dark-950 font-black text-2xl mb-3 shadow-xl">م</div>
                <h1 className="text-2xl font-black text-white">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-xs text-gray-400 mt-1">تسجيل الدخول للنظام (admin / admin)</p>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="text-xs text-gray-300 block mb-1">اسم المستخدم</label>
                  <input type="text" required value={emailInput} onChange={e => setEmailInput(e.target.value)} placeholder="admin" className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm focus:border-gold outline-none" />
                </div>
                <div>
                  <label className="text-xs text-gray-300 block mb-1">كلمة المرور</label>
                  <input type="password" required value={passwordInput} onChange={e => setPasswordInput(e.target.value)} placeholder="admin" className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm focus:border-gold outline-none" />
                </div>
                <button type="submit" className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl hover:brightness-110 transition-all text-sm shadow-lg">
                  تسجيل الدخول
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">
          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header */}
          <header className="glass-card sticky top-0 z-40 px-6 py-4 flex items-center justify-between border-b border-dark-700">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center text-dark-950 font-black text-lg">م</div>
              <div>
                <h1 className="font-bold text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-[10px] text-gray-400">لوحة تحكم إدارة النقلات والتوريدات</p>
              </div>
            </div>

            <nav className="hidden md:flex items-center gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700">
              {[
                { id: 'dashboard', label: 'الرئيسية (البطاقات)', icon: 'layout-dashboard' },
                { id: 'trips', label: 'إدارة النقلات', icon: 'package-check' },
                { id: 'drivers', label: 'إدارة السائقين', icon: 'truck' },
                { id: 'clients', label: 'إدارة العملاء', icon: 'users' },
                { id: 'reports', label: 'التقارير والطباعة', icon: 'bar-chart-3' },
                { id: 'logs', label: 'السجلات', icon: 'shield-alert' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}>
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                </button>
              ))}
            </nav>

            <button onClick={() => setIsAuthenticated(false)} className="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5">
              <i data-lucide="log-out" className="w-4 h-4"></i> خروج
            </button>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">

            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                {/* Statistics Overview */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="glass-card p-5 rounded-2xl">
                    <span className="text-gray-400 text-xs block mb-1">إجمالي السائقين</span>
                    <p className="text-3xl font-black text-white">{drivers.length}</p>
                  </div>
                  <div className="glass-card p-5 rounded-2xl">
                    <span className="text-gray-400 text-xs block mb-1">إجمالي العملاء</span>
                    <p className="text-3xl font-black text-white">{clients.length}</p>
                  </div>
                  <div className="glass-card p-5 rounded-2xl">
                    <span className="text-gray-400 text-xs block mb-1">إجمالي النقلات</span>
                    <p className="text-3xl font-black gold-text">{trips.reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</p>
                  </div>
                  <div className="glass-card p-5 rounded-2xl">
                    <span className="text-gray-400 text-xs block mb-1">إجمالي الوزن (طناً)</span>
                    <p className="text-3xl font-black text-white">{trips.reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)}</p>
                  </div>
                </div>

                {/* Driver Cards Main Section */}
                <div>
                  <div className="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="truck" className="w-5 h-5 text-gold"></i>
                      بطاقات السائقين بالنظام
                    </h2>
                    <input type="text" placeholder="بحث باسم السائق أو الهاتف..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="bg-dark-800 border border-dark-700 px-4 py-2 rounded-xl text-xs w-full md:w-72 focus:border-gold outline-none" />
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {drivers.filter(d => d.name.includes(searchQuery) || d.phone.includes(searchQuery)).map(driver => (
                      <div key={driver.id} className="glass-card p-6 rounded-3xl relative overflow-hidden flex flex-col justify-between space-y-4">
                        <div className="flex items-center gap-4">
                          <div className="w-14 h-14 rounded-2xl bg-dark-800 border border-gold/30 flex items-center justify-center text-gold shadow-md">
                            <i data-lucide="truck" className="w-7 h-7"></i>
                          </div>
                          <div>
                            <h4 className="font-bold text-lg text-white">{driver.name}</h4>
                            <p className="text-xs text-gray-400">السيارة / اللوحة: <span className="text-gold font-semibold">{driver.truckNumber}</span></p>
                          </div>
                        </div>

                        <div className="bg-dark-950/60 p-3 rounded-2xl border border-dark-700/50 flex justify-between items-center text-xs">
                          <div>
                            <span className="text-gray-400 block">عدد النقلات</span>
                            <span className="text-base font-black text-white">{driver.totalTripsCount || 0}</span>
                          </div>
                          <div className="text-left">
                            <span className="text-gray-400 block">آخر نقلة</span>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: FULL REPORT */}
          {activeModal === 'fullReportModal' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto space-y-6">
                <div className="flex justify-between items-center border-b border-dark-700 pb-4 no-print">
                  <h3 className="text-lg font-bold text-gold">التقرير الشامل للطباعة</h3>
                  <div className="flex items-center gap-3">
                    <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5">
                      <i data-lucide="printer" className="w-4 h-4"></i> طباعة A4 / PDF
                    </button>
                  </div>
                </div>

                <div id="print-area">
                  <div className="text-center border-b border-gray-400 pb-3 mb-4">
                    <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                    <p className="text-sm text-black">تقرير حركة النقل والتوريدات الشامل</p>
                    <p className="text-xs text-black mt-1">الفترة من: {reportFilter.fromDate || 'البداية'} إلى: {reportFilter.toDate || 'اليوم'}</p>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-100 text-black border-b">
                        <th className="p-2 border">التاريخ</th>
                        <th className="p-2 border">السائق</th>
                        <th className="p-2 border">العميل</th>
                        <th className="p-2 border">النقلات</th>
                        <th className="p-2 border">الحمولة</th>
                        <th className="p-2 border">الوزن (طن)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredReportTrips.map(t => (
                        <tr key={t.id} className="border-b text-black">
                          <td className="p-2 border">{t.date}</td>
                          <td className="p-2 border font-bold">{t.driverName}</td>
                          <td className="p-2 border">{t.clientName}</td>
                          <td className="p-2 border">{t.tripsCount}</td>
                          <td className="p-2 border">{t.cargoType}</td>
                          <td className="p-2 border">{t.weightTons}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border">
                    <span>مجموع النقلات: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</span>
                    <span>إجمالي الوزن: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)} طن</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-dark-800 text-gray-300 text-xs">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: DELETE CONFIRMATION */}
          {activeModal === 'deleteConfirm' && deleteTarget && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-3xl w-full max-w-sm text-center space-y-4">
                <i data-lucide="alert-triangle" className="w-12 h-12 text-red-400 mx-auto"></i>
                <h3 className="font-bold text-base text-white">تأكيد عملية الحذف</h3>
                <p className="text-xs text-gray-400">هل أنت متأكد من حذف <strong>{deleteTarget.name}</strong>؟</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs">حذف الآن</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
