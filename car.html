<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة نقل ومبيعات مصنع المجد للأعلاف</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (Excel Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.5);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

        @media print {
      @page {
        size: A4 portrait;
        margin: 5mm; /* تقليل الهوامش لمنع الخروج لورقة ثانية */
      }
      html, body {
        height: max-content !important;
        overflow: hidden !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 8px !important;
        page-break-inside: avoid !important; /* يمنع تكرار الجدول في ورقة ثانية */
      }
      th, td {
        border: 1.5px solid #000000 !important;
        color: #000000 !important;
        padding: 5px 8px !important;
        font-size: 11px !important;
        text-align: right !important;
      }
      th {
        background-color: #f3f4f6 !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, remove, update, get, db: rtdb
    };
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    function App() {
      // Auth State
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [emailInput, setEmailInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');

      // Active View
      const [activeTab, setActiveTab] = useState('dashboard');
      const [orderStatusFilter, setOrderStatusFilter] = useState('قيد الانتظار');

      // Database Collections
      const [salesReps, setSalesReps] = useState([]);
      const [orders, setOrders] = useState([]);
      const [drivers, setDrivers] = useState([]);
      const [clients, setClients] = useState([]);
      const [products, setProducts] = useState([]);
      const [trips, setTrips] = useState([]);
      const [logs, setLogs] = useState([]);

      // UI States
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      // Modal Controls
      const [activeModal, setActiveModal] = useState(null); 
      const [selectedOrderDetails, setSelectedOrderDetails] = useState(null);
      const [selectedDriver, setSelectedDriver] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      const [selectedSalesRep, setSelectedSalesRep] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);

      // Report Date Range Filters
      const [reportFilter, setReportFilter] = useState({
        driverId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      // Form Data States
      const [salesRepData, setSalesRepData] = useState({ name: '', phone: '', password: '', region: '', status: 'active' });
      const [driverData, setDriverData] = useState({ name: '', phone: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      const [clientData, setClientData] = useState({ name: '', address: '', phone: '', city: '', region: '', notes: '' });
      const [productData, setProductData] = useState({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      const [tripData, setTripData] = useState({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Realtime Database Sync الإبتدائي
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'salesReps'), snapshot => {
              const data = snapshot.val();
              setSalesReps(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'orders'), snapshot => {
              const data = snapshot.val();
              setOrders(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : []);
            });

            onValue(ref(db, 'drivers'), snapshot => {
              const data = snapshot.val();
              setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'clients'), snapshot => {
              const data = snapshot.val();
              setClients(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'products'), snapshot => {
              const data = snapshot.val();
              setProducts(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'trips'), snapshot => {
              const data = snapshot.val();
              setTrips(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : []);
            });

            onValue(ref(db, 'logs'), snapshot => {
              const data = snapshot.val();
              setLogs(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : []);
            });
          }
        }, 100);
      }, []);

      // 🔄 تحديث أوتوماتيكي لجدول الطلبات فقط كل 5 ثوانٍ
      useEffect(() => {
        const ordersInterval = setInterval(() => {
          if (window.rtdbMethods && isAuthenticated) {
            const { ref, get, db } = window.rtdbMethods;
            get(ref(db, 'orders')).then(snapshot => {
              if (snapshot.exists()) {
                const data = snapshot.val();
                const updatedList = Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse();
                setOrders(updatedList);
              }
            }).catch(err => console.error("Error updating orders:", err));
          }
        }, 5000);

        return () => clearInterval(ordersInterval);
      }, [isAuthenticated]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, orderStatusFilter, orders, products, drivers]);

      const addLog = (action, description) => {
        if (!window.rtdbMethods) return;
        const { ref, push, db } = window.rtdbMethods;
        push(ref(db, 'logs'), { action, description, timestamp: new Date().toISOString() });
      };

      // Auth Handler
      const handleLogin = (e) => {
        e.preventDefault();
        if ((emailInput.trim() === 'admin' || emailInput.trim() === 'admin@elmajd.com') && passwordInput.trim() === 'admin') {
          setIsAuthenticated(true);
          showToast('تم تسجيل الدخول بنجاح كـ Admin');
          addLog('LOGIN', 'تم تسجيل الدخول إلى اللوحة الرئيسية');
        } else {
          showToast('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
        }
      };

      // Save Product
      const handleSaveProduct = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        const tonPrice = parseFloat(productData.pricePerTon) || 0;
        const bagKg = parseFloat(productData.bagWeightKg) || 25;
        const bagPrice = ((tonPrice * bagKg) / 1000).toFixed(2);

        const payload = {
          name: productData.name,
          pricePerTon: tonPrice,
          bagWeightKg: bagKg,
          pricePerBag: parseFloat(bagPrice),
          notes: productData.notes || '',
          updatedAt: new Date().toISOString()
        };

        if (selectedProduct) {
          update(ref(db, `products/${selectedProduct.id}`), payload)
            .then(() => {
              showToast('تم تعديل بيانات المنتج وحساب سعر الشيكارة');
              addLog('UPDATE_PRODUCT', `تعديل المنتج: ${productData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'products'));
          set(newRef, {
            ...payload,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تم إضافة المنتج بنجاح');
            addLog('ADD_PRODUCT', `إضافة منتج جديد: ${productData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedProduct(null);
        setProductData({ name: '', pricePerTon: '', bagWeightKg: '25', notes: '' });
      };

      // Save Sales Rep
      const handleSaveSalesRep = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedSalesRep) {
          update(ref(db, `salesReps/${selectedSalesRep.id}`), salesRepData)
            .then(() => {
              showToast('تم تعديل بيانات المندوب بنجاح');
              addLog('UPDATE_SALES_REP', `تعديل المندوب: ${salesRepData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'salesReps'));
          set(newRef, {
            ...salesRepData,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تمت إضافة المندوب بنجاح');
            addLog('ADD_SALES_REP', `إضافة مندوب جديد: ${salesRepData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedSalesRep(null);
        setSalesRepData({ name: '', phone: '', password: '', region: '', status: 'active' });
      };

      // Save Driver
      const handleSaveDriver = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedDriver) {
          update(ref(db, `drivers/${selectedDriver.id}`), driverData)
            .then(() => {
              showToast('تم تحديث بيانات السائق');
              addLog('UPDATE_DRIVER', `تعديل السائق ${driverData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'drivers'));
          set(newRef, {
            ...driverData,
            totalTripsCount: 0,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تمت إضافة السائق بنجاح');
            addLog('ADD_DRIVER', `إضافة سائق: ${driverData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedDriver(null);
        setDriverData({ name: '', phone: '', address: '', truckNumber: '', truckType: 'تريلا', notes: '', status: 'active' });
      };

      // Save Client
      const handleSaveClient = (e) => {
        e.preventDefault();
        const { ref, push, set, update, db } = window.rtdbMethods;

        if (selectedClient) {
          update(ref(db, `clients/${selectedClient.id}`), clientData)
            .then(() => {
              showToast('تم تعديل بيانات العميل');
              addLog('UPDATE_CLIENT', `تعديل العميل ${clientData.name}`);
            });
        } else {
          const newRef = push(ref(db, 'clients'));
          set(newRef, {
            ...clientData,
            createdAt: new Date().toISOString()
          }).then(() => {
            showToast('تم إضافة العميل بنجاح');
            addLog('ADD_CLIENT', `إضافة عميل: ${clientData.name}`);
          });
        }
        setActiveModal(null);
        setSelectedClient(null);
        setClientData({ name: '', address: '', phone: '', city: '', region: '', notes: '' });
      };

      // Save Trip
      const handleSaveTrip = (e) => {
        e.preventDefault();
        if (!selectedDriver) return;
        const { ref, push, set, update, db } = window.rtdbMethods;

        const client = clients.find(c => c.id === tripData.clientId);
        const today = new Date().toISOString().slice(0, 10);
        const timeNow = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        const parsedWeight = parseFloat(tripData.weightTons) || 0;
        const parsedTripsCount = parseInt(tripData.tripsCount) || 1;

        const newTripRef = push(ref(db, 'trips'));
        set(newTripRef, {
          driverId: selectedDriver.id,
          driverName: selectedDriver.name,
          clientId: tripData.clientId,
          clientName: client ? client.name : 'غير محدد',
          clientAddress: client ? client.address : '',
          date: today,
          time: timeNow,
          tripsCount: parsedTripsCount,
          cargoType: tripData.cargoType,
          weightTons: parsedWeight,
          truckNumber: tripData.truckNumber || selectedDriver.truckNumber,
          notes: tripData.notes || '',
          createdAt: new Date().toISOString()
        }).then(() => {
          const newTotalTrips = (selectedDriver.totalTripsCount || 0) + parsedTripsCount;
          update(ref(db, `drivers/${selectedDriver.id}`), {
            totalTripsCount: newTotalTrips,
            lastTripDate: today
          });
          showToast(`تمت إضافة ${parsedTripsCount} نقلة بنجاح`);
          addLog('ADD_TRIP', `إضافة نقلة للسائق ${selectedDriver.name}`);
        });

        setActiveModal(null);
        setTripData({ clientId: '', tripsCount: 1, cargoType: 'علف تسمين', weightTons: '2.5', truckNumber: '', notes: '' });
      };

      // Delete Handler (يشمل إمكانية حذف طلب المندوب نهائياً)
      const confirmDelete = () => {
        if (!deleteTarget) return;
        const { ref, remove, update, db } = window.rtdbMethods;

        if (deleteTarget.path === 'trips' && deleteTarget.trip) {
          const driver = drivers.find(d => d.id === deleteTarget.trip.driverId);
          if (driver) {
            const updatedTotal = Math.max(0, (driver.totalTripsCount || 0) - (parseInt(deleteTarget.trip.tripsCount) || 1));
            update(ref(db, `drivers/${driver.id}`), { totalTripsCount: updatedTotal });
          }
        }

        remove(ref(db, `${deleteTarget.path}/${deleteTarget.id}`))
          .then(() => {
            showToast('تم الحذف بنجاح');
            addLog('DELETE', `حذف عنصر من ${deleteTarget.path}`);
          });
        setActiveModal(null);
        setDeleteTarget(null);
      };

      // 🖨️ تحديث حالة الطلب والتحويل المباشر للطباعة عند القبول
      const updateOrderStatus = (order, newStatus) => {
        const { ref, update, push, set, db } = window.rtdbMethods;

        update(ref(db, `orders/${order.id}`), { status: newStatus })
          .then(() => {
            showToast(`تم تغيير حالة الطلب إلى: ${newStatus}`);
            addLog('UPDATE_ORDER', `تعديل حالة طلب العميل ${order.clientName} إلى ${newStatus}`);

            if (newStatus === 'مقبول') {
              // ربط تلقائي بالنقلات والسائق
              if (order.driverId) {
                const driver = drivers.find(d => d.id === order.driverId);
                const today = order.date || new Date().toISOString().slice(0, 10);
                const tripsToAdd = parseInt(order.tripsCount) || 1;

                const newTripRef = push(ref(db, 'trips'));
                set(newTripRef, {
                  orderId: order.id,
                  driverId: order.driverId,
                  driverName: order.driverName || (driver ? driver.name : 'سائق'),
                  clientId: order.clientId,
                  clientName: order.clientName,
                  clientAddress: order.clientAddress || '',
                  date: today,
                  time: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }),
                  tripsCount: tripsToAdd,
                  cargoType: order.cargoType || 'علف',
                  weightTons: parseFloat(order.quantity) || 0,
                  truckNumber: order.driverTruck || (driver ? driver.truckNumber : ''),
                  notes: `من طلب المندوب: ${order.repName || ''}`,
                  createdAt: new Date().toISOString()
                });

                if (driver) {
                  const updatedTrips = (driver.totalTripsCount || 0) + tripsToAdd;
                  update(ref(db, `drivers/${driver.id}`), {
                    totalTripsCount: updatedTrips,
                    lastTripDate: today
                  });
                }
              }

              // 🖨️ تحويل تلقائي للطباعة بعد القبول
              setSelectedOrderDetails(order);
              setActiveModal('orderDetailsModal');
              setTimeout(() => {
                window.print();
              }, 500);
            } else if (activeModal === 'orderDetailsModal') {
              setActiveModal(null);
            }
          });
      };

      // تصفية الطلبات
      const filteredOrders = useMemo(() => {
        return orders.filter(o => {
          const matchSearch = (o.clientName && o.clientName.includes(searchQuery)) || 
                              (o.repName && o.repName.includes(searchQuery)) ||
                              (o.driverName && o.driverName.includes(searchQuery));
          
          if (orderStatusFilter === 'الكل') return matchSearch;
          return matchSearch && (o.status || 'قيد الانتظار') === orderStatusFilter;
        });
      }, [orders, searchQuery, orderStatusFilter]);

      const pendingOrdersCount = useMemo(() => orders.filter(o => (o.status || 'قيد الانتظار') === 'قيد الانتظار').length, [orders]);
      const approvedOrdersCount = useMemo(() => orders.filter(o => o.status === 'مقبول').length, [orders]);
      const rejectedOrdersCount = useMemo(() => orders.filter(o => o.status === 'ملغي').length, [orders]);

      // Filtered Trips for Reports
      const filteredReportTrips = useMemo(() => {
        return trips.filter(t => {
          const matchDriver = reportFilter.driverId ? t.driverId === reportFilter.driverId : true;
          const matchFrom = reportFilter.fromDate ? t.date >= reportFilter.fromDate : true;
          const matchTo = reportFilter.toDate ? t.date <= reportFilter.toDate : true;
          return matchDriver && matchFrom && matchTo;
        });
      }, [trips, reportFilter]);

      // Login Screen
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-dark-950">
            <form onSubmit={handleLogin} className="glass-card p-8 rounded-3xl w-full max-w-md gold-glow space-y-6">
              <div className="text-center">
                <img src={LOGO_URL} alt="Logo" className="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-gold shadow-lg p-1 bg-dark-900 object-contain" />
                <h1 className="text-2xl font-black text-white">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-xs text-gray-400 mt-1">تسجيل الدخول للنظام (admin / admin)</p>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="text-xs text-gray-300 block mb-1">اسم المستخدم</label>
                  <input type="text" required value={emailInput} onChange={e => setEmailInput(e.target.value)} placeholder="admin" className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm focus:border-gold outline-none" />
                </div>
                <div>
                  <label className="text-xs text-gray-300 block mb-1">كلمة المرور</label>
                  <input type="password" required value={passwordInput} onChange={e => setPasswordInput(e.target.value)} placeholder="admin" className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm focus:border-gold outline-none" />
                </div>
                <button type="submit" className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl hover:brightness-110 transition-all text-sm shadow-lg">
                  تسجيل الدخول
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">
          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header */}
          <header className="glass-card sticky top-0 z-40 px-6 py-4 flex items-center justify-between border-b border-dark-700">
            <div className="flex items-center gap-3">
              <img src={LOGO_URL} alt="Logo" className="w-10 h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
              <div>
                <h1 className="font-bold text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-[10px] text-gray-400">نظام المبيعات والمنتجات والنقل الشامل</p>
              </div>
            </div>

                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">السائق</th>
                        <th className="p-2 border border-black font-bold">العميل</th>
                        <th className="p-2 border border-black font-bold">النقلات</th>
                        <th className="p-2 border border-black font-bold">الحمولة</th>
                        <th className="p-2 border border-black font-bold">الوزن (طن)</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredReportTrips.map(t => (
                        <tr key={t.id} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{t.date}</td>
                          <td className="p-2 border border-black font-bold">{t.driverName}</td>
                          <td className="p-2 border border-black font-medium">{t.clientName}</td>
                          <td className="p-2 border border-black font-bold">{t.tripsCount}</td>
                          <td className="p-2 border border-black font-medium">{t.cargoType}</td>
                          <td className="p-2 border border-black font-medium">{t.weightTons}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>مجموع النقلات: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.tripsCount) || 0), 0)}</span>
                    <span>إجمالي الوزن: {filteredReportTrips.reduce((a, b) => a + (parseFloat(b.weightTons) || 0), 0).toFixed(2)} طن</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

          {activeModal === 'deleteConfirm' && deleteTarget && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="glass-card p-6 rounded-3xl w-full max-w-sm text-center space-y-4">
                <i data-lucide="alert-triangle" className="w-12 h-12 text-red-400 mx-auto"></i>
                <h3 className="font-bold text-base text-white">تأكيد عملية الحذف</h3>
                <p className="text-xs text-gray-400">هل أنت متأكد من حذف <strong>{deleteTarget.name}</strong>؟</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setActiveModal(null)} className="flex-1 py-2.5 rounded-xl bg-dark-800 text-gray-300 text-xs">إلغاء</button>
                  <button onClick={confirmDelete} className="flex-1 py-2.5 rounded-xl bg-red-600 text-white font-bold text-xs">حذف الآن</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
