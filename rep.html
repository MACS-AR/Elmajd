<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة مناديب مبيعات مصنع المجد للأعلاف</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#F5E0A3',
              DEFAULT: '#D4AF37',
              dark: '#AA820A',
            },
            dark: {
              950: '#050608',
              900: '#090A0F',
              800: '#12141D',
              700: '#1D202F',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #090A0F;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .gold-gradient {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
    }
    .gold-text {
      background: linear-gradient(135deg, #F5E0A3 0%, #D4AF37 50%, #AA820A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .glass-card:hover {
      border-color: rgba(212, 175, 55, 0.5);
    }
    .gold-glow {
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
    }

    @media print {
      @page {
        size: auto;
        margin: 8mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      table {
        width: 100% !important;
        border-collapse: collapse !important;
        margin-top: 10px !important;
      }
      th, td {
        border: 1.5px solid #000000 !important;
        color: #000000 !important;
        padding: 8px !important;
        font-size: 12px !important;
        text-align: right !important;
      }
      th {
        background-color: #e5e7eb !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBgRkceRq7FRbhCevLlULYNy-A5Tl_cr0w",
      authDomain: "sr-test-c9e06.firebaseapp.com",
      databaseURL: "https://sr-test-c9e06-default-rtdb.firebaseio.com",
      projectId: "sr-test-c9e06",
      storageBucket: "sr-test-c9e06.firebasestorage.app",
      messagingSenderId: "658396508062",
      appId: "1:658396508062:web:c56cd84f93daa2e176308f",
      measurementId: "G-3ZZV344NDK"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    window.rtdbMethods = {
      ref, set, push, onValue, db: rtdb
    };
  </script>

  <!-- React Logic -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // اللوجو الرسمي
    const LOGO_URL = "https://raw.githubusercontent.com/MACS-AR/Elmajd/refs/heads/main/logo.png"; 

    function RepApp() {
      // Auth State للمندوب
      const [currentRep, setCurrentRep] = useState(null);
      const [phoneInput, setPhoneInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');

      // Active View
      const [activeTab, setActiveTab] = useState('newOrder'); // newOrder, myOrders, clientStatement

      // Database Collections
      const [salesReps, setSalesReps] = useState([]);
      const [clients, setClients] = useState([]);
      const [drivers, setDrivers] = useState([]); 
      const [products, setProducts] = useState([]);
      const [myOrders, setMyOrders] = useState([]);

      // UI States
      const [toast, setToast] = useState(null);
      const [clientSearch, setClientSearch] = useState('');
      const [productSearch, setProductSearch] = useState('');
      const [activeModal, setActiveModal] = useState(null);

      // Form & Cart States للطلب الجديد
      const [selectedClientId, setSelectedClientId] = useState('');
      const [selectedDriverId, setSelectedDriverId] = useState(''); 
      const [cartItems, setCartItems] = useState([]);
      const [selectedProductId, setSelectedProductId] = useState('');
      const [unitType, setUnitType] = useState('ton');
      const [quantity, setQuantity] = useState('1');
      const [orderNotes, setOrderNotes] = useState('');

      // كشف حساب العملاء
      const [statementFilter, setStatementFilter] = useState({
        clientId: '',
        fromDate: new Date().toISOString().slice(0, 8) + '01',
        toDate: new Date().toISOString().slice(0, 10)
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      // Realtime Database Sync
      useEffect(() => {
        const interval = setInterval(() => {
          if (window.rtdbMethods) {
            clearInterval(interval);
            const { ref, onValue, db } = window.rtdbMethods;

            onValue(ref(db, 'salesReps'), snapshot => {
              const data = snapshot.val();
              setSalesReps(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'clients'), snapshot => {
              const data = snapshot.val();
              setClients(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'drivers'), snapshot => {
              const data = snapshot.val();
              setDrivers(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'products'), snapshot => {
              const data = snapshot.val();
              setProducts(data ? Object.keys(data).map(k => ({ id: k, ...data[k] })) : []);
            });

            onValue(ref(db, 'orders'), snapshot => {
              const data = snapshot.val();
              const list = data ? Object.keys(data).map(k => ({ id: k, ...data[k] })).reverse() : [];
              setMyOrders(list);
            });
          }
        }, 100);
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [activeTab, activeModal, currentRep, cartItems]);

      // Login Handler للمندوب
      const handleRepLogin = (e) => {
        e.preventDefault();
        const foundRep = salesReps.find(r => r.phone.trim() === phoneInput.trim() && r.password.trim() === passwordInput.trim());

        if (foundRep) {
          setCurrentRep(foundRep);
          showToast(`أهلاً بك يا ${foundRep.name}`);
        } else {
          showToast('رقم الهاتف أو كلمة المرور غير صحيحة', 'error');
        }
      };

      // إضافة منتج لسلة الطلب
      const handleAddToCart = () => {
        if (!selectedProductId) {
          showToast('يرجى اختيار صنف العلف أولاً', 'error');
          return;
        }

        const product = products.find(p => p.id === selectedProductId);
        if (!product) return;

        const qty = parseFloat(quantity) || 1;
        let price = 0;
        let weightTons = 0;

        if (unitType === 'ton') {
          price = (parseFloat(product.pricePerTon) || 0) * qty;
          weightTons = qty;
        } else {
          price = (parseFloat(product.pricePerBag) || 0) * qty;
          weightTons = (qty * (parseFloat(product.bagWeightKg) || 25)) / 1000;
        }

        const newItem = {
          id: Date.now().toString(),
          productId: product.id,
          productName: product.name,
          unitType,
          unitLabel: unitType === 'ton' ? 'طن' : `شيكارة (${product.bagWeightKg} كجم)`,
          quantity: qty,
          price,
          weightTons
        };

        setCartItems([...cartItems, newItem]);
        setSelectedProductId('');
        setQuantity('1');
        showToast('تمت إضافة الصنف إلى الطلب');
      };

      const removeFromCart = (itemId) => {
        setCartItems(cartItems.filter(item => item.id !== itemId));
      };

      const totalOrderAmount = useMemo(() => cartItems.reduce((a, b) => a + b.price, 0), [cartItems]);
      const totalOrderWeightTons = useMemo(() => cartItems.reduce((a, b) => a + b.weightTons, 0), [cartItems]);

      // رفع الطلب النهائي للإدارة مع ربط السائق والعميل
      const handleSubmitOrder = (e) => {
        e.preventDefault();
        if (!selectedClientId) {
          showToast('يرجى اختيار العميل أولاً', 'error');
          return;
        }
        if (!selectedDriverId) {
          showToast('يرجى تحديد السائق المكلف بالتوصيل', 'error');
          return;
        }
        if (cartItems.length === 0) {
          showToast('السلة فارغة، أضف منتجاً واحداً على الأقل', 'error');
          return;
        }

        const { ref, push, set, db } = window.rtdbMethods;
        const client = clients.find(c => c.id === selectedClientId);
        const driver = drivers.find(d => d.id === selectedDriverId);

        const newOrder = {
          repId: currentRep.id,
          repName: currentRep.name,
          repPhone: currentRep.phone,
          clientId: selectedClientId,
          clientName: client ? client.name : 'عميل',
          clientAddress: client ? client.address : '',
          driverId: selectedDriverId,
          driverName: driver ? driver.name : 'سائق',
          driverTruck: driver ? driver.truckNumber : '',
          region: client ? client.region || currentRep.region : currentRep.region,
          items: cartItems,
          cargoType: cartItems.map(i => i.productName).join(' + '),
          quantity: totalOrderWeightTons.toFixed(2),
          totalAmount: totalOrderAmount.toFixed(2),
          tripsCount: 1, // كل طلب يمثل نقلة واحدة تضاف لعداد السائق عند قبول الإدارة
          notes: orderNotes,
          status: 'قيد الانتظار',
          date: new Date().toISOString().slice(0, 10),
          createdAt: new Date().toISOString()
        };

        const newRef = push(ref(db, 'orders'));
        set(newRef, newOrder).then(() => {
          showToast('تم رفع الطلب بنجاح وتحديد السائق!');
          setCartItems([]);
          setSelectedClientId('');
          setSelectedDriverId('');
          setOrderNotes('');
          setActiveTab('myOrders');
        });
      };

      // تصفية العملاء (بالاسم فقط دون إظهار التليفون)
      const filteredClients = useMemo(() => {
        return clients.filter(c => c.name.includes(clientSearch));
      }, [clients, clientSearch]);

      // تصفية المنتجات بالاسم مباشرة
      const filteredProducts = useMemo(() => {
        return products.filter(p => p.name.includes(productSearch));
      }, [products, productSearch]);

      // طلبات المندوب الحالي فقط
      const repOrders = useMemo(() => {
        if (!currentRep) return [];
        return myOrders.filter(o => o.repId === currentRep.id);
      }, [myOrders, currentRep]);

      // تصفية طلبات كشف حساب العملاء
      const statementOrders = useMemo(() => {
        return repOrders.filter(o => {
          const matchClient = statementFilter.clientId ? o.clientId === statementFilter.clientId : true;
          const matchFrom = statementFilter.fromDate ? o.date >= statementFilter.fromDate : true;
          const matchTo = statementFilter.toDate ? o.date <= statementFilter.toDate : true;
          return matchClient && matchFrom && matchTo;
        });
      }, [repOrders, statementFilter]);

      // شاشة تسجيل الدخول للمندوب
      if (!currentRep) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-dark-950">
            <form onSubmit={handleRepLogin} className="glass-card p-8 rounded-3xl w-full max-w-md gold-glow space-y-6">
              <div className="text-center">
                <img src={LOGO_URL} alt="Logo" className="w-20 h-20 rounded-full mx-auto mb-3 border-2 border-gold shadow-lg p-1 bg-dark-900 object-contain" />
                <h1 className="text-2xl font-black text-white">بوابة <span className="gold-text">مناديب الأعلاف</span></h1>
                <p className="text-xs text-gray-400 mt-1">تسجيل دخول المندوب لرفع كشوف الحساب والطلبات</p>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="text-xs text-gray-300 block mb-1">رقم هاتف المندوب</label>
                  <input type="text" required value={phoneInput} onChange={e => setPhoneInput(e.target.value)} placeholder="أدخل رقم هاتفك المسجل" className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm focus:border-gold outline-none" />
                </div>
                <div>
                  <label className="text-xs text-gray-300 block mb-1">كلمة المرور / الباسورد</label>
                  <input type="password" required value={passwordInput} onChange={e => setPasswordInput(e.target.value)} placeholder="أدخل كلمة المرور" className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-sm focus:border-gold outline-none" />
                </div>
                <button type="submit" className="w-full gold-gradient text-dark-950 font-black py-3 rounded-xl hover:brightness-110 transition-all text-sm shadow-lg">
                  تسجيل الدخول كـ مندوب
                </button>
              </div>
            </form>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-dark-900 text-white">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-6 right-6 z-50 px-5 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-2 border ${toast.type === 'error' ? 'bg-red-950 text-red-300 border-red-800' : 'bg-dark-800 text-gold border-gold/40'}`}>
              <i data-lucide={toast.type === 'error' ? 'alert-triangle' : 'check-circle'} className="w-5 h-5"></i>
              {toast.message}
            </div>
          )}

          {/* Header */}
          <header className="glass-card sticky top-0 z-40 px-6 py-4 flex items-center justify-between border-b border-dark-700">
            <div className="flex items-center gap-3">
              <img src={LOGO_URL} alt="Logo" className="w-10 h-10 rounded-full border border-gold p-0.5 bg-dark-900 object-contain" />
              <div>
                <h1 className="font-bold text-base">مصنع <span className="gold-text">المجد للأعلاف</span></h1>
                <p className="text-[10px] text-gray-400">حساب المندوب: <strong className="text-gold">{currentRep.name}</strong> ({currentRep.region || 'عام'})</p>
              </div>
            </div>

            <nav className="hidden md:flex items-center gap-2 bg-dark-800/80 p-1.5 rounded-2xl border border-dark-700">
              {[
                { id: 'newOrder', label: 'إنشاء طلب جديد', icon: 'plus-circle' },
                { id: 'myOrders', label: 'طلباتي ومتابعة الحالة', icon: 'shopping-cart' },
                { id: 'clientStatement', label: 'كشف حساب العملاء', icon: 'file-text' }
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 ${activeTab === tab.id ? 'gold-gradient text-dark-950 shadow-md' : 'text-gray-400 hover:text-white'}`}>
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  {tab.label}
                </button>
              ))}
            </nav>

            <button onClick={() => setCurrentRep(null)} className="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-2 rounded-xl text-xs flex items-center gap-1.5">
              <i data-lucide="log-out" className="w-4 h-4"></i> خروج
            </button>
          </header>

          {/* Main Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">

            {/* TAB 1: NEW ORDER FORM */}
            {activeTab === 'newOrder' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div className="lg:col-span-2 space-y-6">
                  {/* Step 1: Select Client & Driver */}
                  <div className="glass-card p-6 rounded-3xl space-y-4">
                    <h3 className="text-base font-bold text-gold flex items-center gap-2">
                      <i data-lucide="user-check" className="w-5 h-5"></i>
                      ١. تحديد العميل والسائق المكلف
                    </h3>
                    
                    {/* اختيار العميل بالاسم فقط بدون تليفون */}
                    <div className="space-y-2">
                      <label className="text-xs text-gray-400 block">بحث سريع عن العميل بالاسم:</label>
                      <input type="text" placeholder="اكتب اسم العميل لظهوره مباشرة..." value={clientSearch} onChange={e => setClientSearch(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white focus:border-gold" />
                      <select value={selectedClientId} onChange={e => setSelectedClientId(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                        <option value="">-- اختر العميل --</option>
                        {filteredClients.map(c => (
                          <option key={c.id} value={c.id}>{c.name} - ({c.address || 'عنوان غير محدد'})</option>
                        ))}
                      </select>
                    </div>

                    {/* اختيار السائق المسجل بالإدارة */}
                    <div className="space-y-2 pt-2 border-t border-dark-700">
                      <label className="text-xs text-gray-400 block">تحديد السائق المسجل لدى الإدارة:</label>
                      <select value={selectedDriverId} onChange={e => setSelectedDriverId(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                        <option value="">-- اختر السائق المكلف بالتوصيل --</option>
                        {drivers.map(d => (
                          <option key={d.id} value={d.id}>{d.name} (سيارة: {d.truckNumber})</option>
                        ))}
                      </select>
                    </div>
                  </div>

                  {/* Step 2: Select Products */}
                  <div className="glass-card p-6 rounded-3xl space-y-4">
                    <h3 className="text-base font-bold text-gold flex items-center gap-2">
                      <i data-lucide="package" className="w-5 h-5"></i>
                      ٢. إضافة الأصناف إلى السلة
                    </h3>
                    <div className="flex gap-2">
                      <input type="text" placeholder="بحث باسم المنتج مباشرة..." value={productSearch} onChange={e => setProductSearch(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white focus:border-gold" />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div className="md:col-span-1">
                        <label className="text-xs text-gray-400 block mb-1">اختر العلف</label>
                        <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                          <option value="">-- الصنف --</option>
                          {filteredProducts.map(p => (
                            <option key={p.id} value={p.id}>{p.name}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="text-xs text-gray-400 block mb-1">وحدة الكمية</label>
                        <select value={unitType} onChange={e => setUnitType(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs text-white outline-none">
                          <option value="ton">بالطن</option>
                          <option value="bag">بالشيكارة</option>
                        </select>
                      </div>

                      <div>
                        <label className="text-xs text-gray-400 block mb-1">الكمية المطلوبة</label>
                        <input type="number" step="0.1" min="0.1" value={quantity} onChange={e => setQuantity(e.target.value)} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white" />
                      </div>
                    </div>

                    <button type="button" onClick={handleAddToCart} className="w-full bg-dark-800 border border-gold/40 hover:border-gold text-gold font-bold p-3 rounded-xl text-xs flex items-center justify-center gap-2">
                      <i data-lucide="plus" className="w-4 h-4"></i> إضافة الصنف للطلب
                    </button>
                  </div>
                </div>

                {/* Right Side: Order Cart Summary */}
                <div className="glass-card p-6 rounded-3xl space-y-6 flex flex-col justify-between">
                  <div className="space-y-4">
                    <h3 className="text-lg font-bold text-white border-b border-dark-700 pb-3 flex justify-between items-center">
                      <span>سلة الطلب والمجموع</span>
                      <span className="text-xs text-gold font-normal">{cartItems.length} أصناف</span>
                    </h3>

                    <div className="space-y-3 max-h-60 overflow-y-auto pr-1">
                      {cartItems.length === 0 ? (
                        <p className="text-xs text-gray-500 text-center py-6">لم يتم إضافة أي منتج للسلة حتى الآن</p>
                      ) : (
                        cartItems.map(item => (
                          <div key={item.id} className="bg-dark-800 p-3 rounded-xl flex justify-between items-center text-xs border border-dark-700">
                            <div>
                              <h5 className="font-bold text-white">{item.productName}</h5>
                              <p className="text-[10px] text-gray-400 mt-0.5">
                                {item.quantity} {item.unitLabel} | <span className="text-gold">{item.price.toLocaleString()} ج.م</span>
                              </p>
                            </div>
                            <button onClick={() => removeFromCart(item.id)} className="text-red-400 hover:text-red-300 p-1">
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                        ))
                      )}
                    </div>

                    <div>
                      <label className="text-xs text-gray-400 block mb-1">ملاحظات للمصنع (اختياري)</label>
                      <textarea rows="2" value={orderNotes} onChange={e => setOrderNotes(e.target.value)} placeholder="أي تعليمات خاصة بالطلب أو التوصيل..." className="w-full bg-dark-800 border border-dark-700 rounded-xl p-3 text-xs outline-none text-white"></textarea>
                    </div>
                  </div>

                  <div className="space-y-4 border-t border-dark-700 pt-4">
                    <div className="flex justify-between items-center text-xs">
                      <span className="text-gray-400">إجمالي وزن الطلب:</span>
                      <span className="font-bold text-white">{totalOrderWeightTons.toFixed(2)} طن</span>
                    </div>
                    <div className="flex justify-between items-center text-sm">
                      <span className="text-gray-300 font-bold">المبلغ الإجمالي المحسوب:</span>
                      <span className="font-black text-gold text-base">{totalOrderAmount.toLocaleString()} ج.م</span>
                    </div>

                    <button onClick={handleSubmitOrder} className="w-full gold-gradient text-dark-950 font-black py-3.5 rounded-xl text-xs flex items-center justify-center gap-2 hover:brightness-110 shadow-lg">
                      <i data-lucide="send" className="w-4 h-4"></i> تأكيد ورفع الطلب للإدارة
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: MY ORDERS & STATUS */}
            {activeTab === 'myOrders' && (
              <div className="space-y-6">
                <h2 className="text-xl font-bold flex items-center gap-2">
                  <i data-lucide="shopping-cart" className="w-5 h-5 text-gold"></i>
                  طلباتي المرفوعة وحالتها
                </h2>

                <div className="glass-card rounded-2xl overflow-hidden border border-dark-700">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-4">تاريخ الطلب</th>
                        <th className="p-4">اسم العميل</th>
                        <th className="p-4">اسم السائق المكلف</th>
                        <th className="p-4">الكمية الإجمالية</th>
                        <th className="p-4">المبلغ الإجمالي</th>
                        <th className="p-4">حالة الطلب لدى الإدارة</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {repOrders.map(order => (
                        <tr key={order.id} className="hover:bg-dark-800/40">
                          <td className="p-4">{order.date}</td>
                          <td className="p-4 font-bold text-white">{order.clientName}</td>
                          <td className="p-4 font-bold text-gold">{order.driverName || 'سائق'}</td>
                          <td className="p-4 font-black">{order.quantity} طن</td>
                          <td className="p-4 font-bold text-gold">{order.totalAmount ? Number(order.totalAmount).toLocaleString() + ' ج.م' : '-'}</td>
                          <td className="p-4">
                            <span className={`px-3 py-1 rounded-full text-[10px] font-bold ${order.status === 'مقبول' ? 'bg-green-500/10 text-green-400 border border-green-500/20' : order.status === 'ملغي' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'}`}>
                              {order.status || 'قيد الانتظار'}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB 3: CLIENT STATEMENT */}
            {activeTab === 'clientStatement' && (
              <div className="space-y-6">
                <div className="glass-card p-6 rounded-3xl space-y-4">
                  <h3 className="text-base font-bold text-gold">إعداد وتصفية كشف حساب العملاء</h3>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">اختر العميل</label>
                      <select value={statementFilter.clientId} onChange={e => setStatementFilter({ ...statementFilter, clientId: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white">
                        <option value="">-- جميع العملاء --</option>
                        {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">من تاريخ</label>
                      <input type="date" value={statementFilter.fromDate} onChange={e => setStatementFilter({ ...statementFilter, fromDate: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
                    </div>
                    <div>
                      <label className="text-xs text-gray-400 block mb-1">إلى تاريخ</label>
                      <input type="date" value={statementFilter.toDate} onChange={e => setStatementFilter({ ...statementFilter, toDate: e.target.value })} className="w-full bg-dark-800 border border-dark-700 rounded-xl p-2.5 text-xs text-white" />
                    </div>
                    <div className="flex items-end">
                      <button onClick={() => setActiveModal('printStatementModal')} className="w-full gold-gradient text-dark-950 font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-1">
                        <i data-lucide="printer" className="w-4 h-4"></i> معاينة وطباعة كشف الحساب
                      </button>
                    </div>
                  </div>
                </div>

                <div className="glass-card rounded-2xl p-4 overflow-x-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-dark-800 text-gold font-bold">
                      <tr>
                        <th className="p-3">التاريخ</th>
                        <th className="p-3">اسم العميل</th>
                        <th className="p-3">السائق</th>
                        <th className="p-3">الكمية (طن)</th>
                        <th className="p-3">المبلغ الإجمالي</th>
                        <th className="p-3">الحالة لدى الإدارة</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-dark-700">
                      {statementOrders.map(o => (
                        <tr key={o.id} className="hover:bg-dark-800/50">
                          <td className="p-3">{o.date}</td>
                          <td className="p-3 font-bold text-white">{o.clientName}</td>
                          <td className="p-3 text-gold">{o.driverName || 'سائق'}</td>
                          <td className="p-3 font-black text-gold">{o.quantity} طن</td>
                          <td className="p-3 font-bold">{o.totalAmount ? Number(o.totalAmount).toLocaleString() + ' ج.م' : '-'}</td>
                          <td className="p-3">
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${o.status === 'مقبول' ? 'text-green-400' : o.status === 'ملغي' ? 'text-red-400' : 'text-yellow-400'}`}>
                              {o.status || 'قيد الانتظار'}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* MODAL: PRINT CLIENT STATEMENT */}
          {activeModal === 'printStatementModal' && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white text-black p-6 rounded-3xl w-full max-w-3xl max-h-[90vh] overflow-y-auto space-y-6 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-200 pb-4 no-print">
                  <h3 className="text-lg font-bold text-black">معاينة كشف حساب العميل</h3>
                  <button onClick={() => window.print()} className="gold-gradient text-dark-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                    <i data-lucide="printer" className="w-4 h-4"></i> طباعة A4
                  </button>
                </div>

                <div id="print-area">
                  <div className="text-center border-b-2 border-black pb-3 mb-4">
                    <img src={LOGO_URL} alt="Logo" className="w-16 h-16 rounded-full mx-auto mb-2 border border-black object-contain" />
                    <h1 className="text-2xl font-black text-black">مصنع المجد للأعلاف</h1>
                    <p className="text-sm font-bold text-black">كشف حساب مبيعات وتوريدات عميل</p>
                    <div className="flex justify-between text-xs mt-3 text-black font-semibold">
                      <span>المندوب المسؤول: <strong>{currentRep.name}</strong></span>
                      <span>الفترة من: <strong>{statementFilter.fromDate || 'البداية'}</strong> إلى: <strong>{statementFilter.toDate || 'اليوم'}</strong></span>
                      <span>تاريخ الإصدار: <strong>{new Date().toLocaleDateString('ar-EG')}</strong></span>
                    </div>
                  </div>

                  <table className="w-full text-right text-xs border-collapse">
                    <thead>
                      <tr className="bg-gray-200 text-black border-b">
                        <th className="p-2 border border-black font-bold">التاريخ</th>
                        <th className="p-2 border border-black font-bold">العميل</th>
                        <th className="p-2 border border-black font-bold">السائق</th>
                        <th className="p-2 border border-black font-bold">الكمية (طن)</th>
                        <th className="p-2 border border-black font-bold">المبلغ (جنيه)</th>
                        <th className="p-2 border border-black font-bold">الحالة</th>
                      </tr>
                    </thead>
                    <tbody>
                      {statementOrders.map(o => (
                        <tr key={o.id} className="border-b text-black">
                          <td className="p-2 border border-black font-medium">{o.date}</td>
                          <td className="p-2 border border-black font-bold">{o.clientName}</td>
                          <td className="p-2 border border-black font-medium">{o.driverName || 'سائق'}</td>
                          <td className="p-2 border border-black font-bold">{o.quantity}</td>
                          <td className="p-2 border border-black font-bold">{o.totalAmount ? Number(o.totalAmount).toLocaleString() : '-'}</td>
                          <td className="p-2 border border-black font-medium">{o.status || 'قيد الانتظار'}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-xl text-xs font-bold mt-4 text-black border border-black">
                    <span>مجموع الكمية: {statementOrders.reduce((a, b) => a + (parseFloat(b.quantity) || 0), 0).toFixed(2)} طن</span>
                    <span>إجمالي المبيعات: {statementOrders.reduce((a, b) => a + (parseFloat(b.totalAmount) || 0), 0).toLocaleString()} ج.م</span>
                  </div>
                </div>

                <div className="flex justify-end pt-2 no-print">
                  <button onClick={() => setActiveModal(null)} className="px-5 py-2 rounded-xl bg-gray-800 text-white text-xs font-bold">إغلاق</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RepApp />);
  </script>
</body>
</html>
