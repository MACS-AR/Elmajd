<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>الإدارة - المجد للأعلاف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-[#047857] text-white flex flex-col">
    <div class="p-4 flex gap-3 border-b border-green-800">
      <img src="https://raw.githubusercontent.com/username/elmajd-erp/main/assets/images/logo.png" alt="Logo" class="h-10 bg-white rounded p-1" onerror="this.outerHTML='<i class=\'fa-solid fa-wheat-awn text-3xl\'></i>'">
      <h1 class="font-bold text-lg">لوحة الإدارة</h1>
    </div>
    <nav class="flex-1 p-4 space-y-2">
      <button onclick="switchTab('dashboard')" class="w-full text-right p-3 rounded hover:bg-green-800"><i class="fa-solid fa-chart-pie w-6"></i> الرئيسية</button>
      <button onclick="switchTab('orders')" class="w-full text-right p-3 rounded hover:bg-green-800"><i class="fa-solid fa-boxes-stacked w-6"></i> الطلبات</button>
    </nav>
    <div class="p-4"><button id="logoutBtn" class="w-full bg-red-600 p-2 rounded">خروج <i class="fa-solid fa-power-off"></i></button></div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto">
    <header class="bg-white p-4 shadow-sm flex justify-between">
      <h2 class="text-xl font-bold" id="pageTitle">نظرة عامة</h2>
    </header>

    <div class="p-6 relative">
      <!-- Tab: Dashboard -->
      <div id="tab-dashboard" class="tab-content">
        <div class="grid grid-cols-4 gap-4 mb-6">
          <div class="card p-5 border-t-4 border-[#10b981]"><p class="text-sm">إجمالي المبيعات</p><h3 class="text-2xl font-bold" id="statSales">0</h3></div>
          <div class="card p-5 border-t-4 border-[#d97706]"><p class="text-sm">طلبات للمراجعة</p><h3 class="text-2xl font-bold" id="statOrders">0</h3></div>
          <div class="card p-5 border-t-4 border-blue-500"><p class="text-sm">العملاء</p><h3 class="text-2xl font-bold" id="statCustomers">0</h3></div>
        </div>
      </div>

      <!-- Tab: Orders Management -->
      <div id="tab-orders" class="tab-content hidden card p-5">
        <h3 class="font-bold mb-4">إدارة الطلبات</h3>
        <table class="w-full text-right text-sm">
          <thead class="bg-gray-100">
            <tr><th class="p-3">رقم</th><th class="p-3">العميل</th><th class="p-3">المندوب</th><th class="p-3">الإجمالي</th><th class="p-3">الحالة</th><th class="p-3">إجراء</th></tr>
          </thead>
          <tbody id="adminOrdersTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./assets/js/firebase/config.js";
    import { logoutUser } from "./assets/js/firebase/auth.js";
    import { updateOrderStatus } from "./assets/js/services/db.js";
    import { formatCurrency } from "./assets/js/utils/helpers.js";
    import { showToast } from "./assets/js/utils/ui.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.getElementById('logoutBtn').addEventListener('click', logoutUser);

    // نظام التبويبات البسيط
    window.switchTab = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.getElementById('pageTitle').innerText = tabId === 'dashboard' ? 'الرئيسية' : 'إدارة الطلبات';
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";

      // مراقبة الطلبات
      onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snapshot) => {
        const table = document.getElementById('adminOrdersTable'); table.innerHTML = '';
        let pending = 0, sales = 0;

        snapshot.forEach(docSnap => {
          const order = { id: docSnap.id, ...docSnap.data() };
          if(order.status === 'تحت المراجعة') pending++;
          if(order.status === 'مقبول' || order.status === 'تم التسليم') sales += order.netTotal;

          const tr = document.createElement('tr'); tr.className = "border-b";
          tr.innerHTML = `
            <td class="p-3">#${order.id.slice(-6)}</td>
            <td class="p-3 font-bold">${order.customerName}</td>
            <td class="p-3">${order.salesEmail}</td>
            <td class="p-3 text-[#10b981] font-bold">${formatCurrency(order.netTotal)}</td>
            <td class="p-3"><span class="px-2 py-1 rounded text-xs bg-gray-100">${order.status}</span></td>
            <td class="p-3 flex gap-2">
              <button class="approve-btn bg-green-500 text-white px-2 py-1 rounded text-xs">قبول</button>
              <button class="reject-btn bg-red-500 text-white px-2 py-1 rounded text-xs">رفض</button>
            </td>
          `;
          
          tr.querySelector('.approve-btn').onclick = async () => {
            await updateOrderStatus(order.id, 'مقبول'); showToast('تم الاعتماد');
          };
          tr.querySelector('.reject-btn').onclick = async () => {
            await updateOrderStatus(order.id, 'مرفوض'); showToast('تم الرفض', 'error');
          };
          
          table.appendChild(tr);
        });
        
        document.getElementById('statOrders').innerText = pending;
        document.getElementById('statSales').innerText = formatCurrency(sales);
      });

      // عدد العملاء
      onSnapshot(collection(db, "users"), (snapshot) => {
        let count = 0; snapshot.forEach(d => { if(d.data().role === 'customer') count++; });
        document.getElementById('statCustomers').innerText = count;
      });
    });
  </script>
</body>
</html>
